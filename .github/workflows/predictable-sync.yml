# Predictable Code — analysis in your own GitHub Actions.
#
# WHAT THIS RUNS AND WHERE. Everything happens on your runner, in your repository,
# billed to your account. Predictable's hosted Control Center dispatches this workflow
# and reads the results you commit; it never runs your code and never holds a copy of
# it. That is the whole compute model, and this file is the visible, auditable,
# revocable form of it — delete it and the hosted side can do nothing to this repo.
#
# WHAT IT NEEDS FROM US. Only a download. The CLI lives in a private repository, so the
# job proves who it is with the OIDC token GitHub mints for it and receives a
# short-lived, pre-signed URL in return. No secret is stored in this repository, none
# is configured, and no credential of ours ever reaches this runner.
#
# WHAT IT WRITES. Everything Predictable keeps lives on ONE branch of its own,
# `predictable-code-database`, which `predictable` checks out at `.predictable-code/` and commits
# and pushes itself: the configuration (`project.json`) and the acknowledged findings at its root,
# and each analysis under the analysed branch's name — `<branch>/.analysis.json` says which commit
# it describes and who asked, and `<branch>/.predictable-code/` holds the datasets. It never commits
# to your code's branches and opens no pull request for an analysis. A fix, an authored spec or its
# documentation is a change to your code, so each of those is proposed as a pull request on its
# own branch. An analysis asks no model and is never handed a model key of yours: only a fix, a
# spec whose requirements a model writes, or a run that writes the specs' missing descriptions —
# each one started by a person — reads an `ANTHROPIC_API_KEY` secret. A pull request review you
# turned on reads it too, when it is there, to explain what it found and propose a verified fix;
# without it the review still runs, because only the analysis decides its check.
#
# The stamp below is how the Control Center knows whether this repository is running a
# current copy. It is compared as a NUMBER, never as a diff, so your own edits to this
# file — a bigger `runner:`, a different `heap_mb` — are yours and are left alone.
# predictable-workflow-version: 64
name: Predictable Code

on:
  workflow_dispatch:
    inputs:
      control_plane:
        description: "Control Center base URL"
        required: true
        type: string
      release_tag:
        description: "Release to run, or 'latest'"
        required: false
        default: latest
        type: string
      command:
        # WHAT THIS RUN IS FOR. One workflow rather than one per verb, because every
        # verb needs the identical twenty lines above it — check out, prove who we are,
        # download the runtime, put the launcher on PATH — and a second file would be a
        # second copy of all of it to keep in step, in someone else's repository where
        # we cannot fix it.
        #
        # `sync` analyses. `fix` applies the DETERMINISTIC fix for one finding: it is
        # `predictable analyze fix-issue`, which edits narrowly and keeps the edit only
        # if its own accept gates hold, so it needs no agent, no model and no API key of
        # anybody's. That is why it is the fix this workflow can offer — an agent fix
        # would need a provider key configured here, which would end the "no secret is
        # stored in this repository" promise above.
        #
        # `spec-new`, `spec-describe`, `requirement-add`, `requirement-update` and `requirement-remove`
        # AUTHOR a spec (#2019, #2342): each is one
        # deterministic CLI verb that edits one Markillo `.md`, and the propose step turns
        # that one file into a pull request. They need no model and no key — see the key
        # check below, which runs for the two fix verbs only.
        #
        # `spec-generate` (#2055) authors a spec too, with the requirements WRITTEN BY A MODEL
        # from the person's name and short description: the same `specs new` verb without
        # `--blank`, so it needs the customer's key like a fix does, and proposes its one `.md`
        # exactly like the three verbs above.
        #
        # `spec-fill-descriptions` (#2103) asks a model for the descriptions the specs lack —
        # every one, or the spec files `text` names — and proposes exactly the files it wrote on
        # `predictable/specs/documentation`. It needs the key like a fix.
        #
        # `spec-implement` (#2339) IMPLEMENTS a spec: an agent changes the code until this run's own
        # analysis verifies every requirement of the spec and reports no finding the project did not
        # have at the start (`predictable implement`, gated by `predictable spec-check`). It runs on
        # the spec's own branch while its pull request is open, so the spec and the code that meets
        # it are ONE pull request — a draft until the gate is met. It needs the key like a fix.
        #
        # `plugins-discover` (#2355) LOOKS FOR WHAT PREDICTABLE MISSES: an agent hunts the code for
        # defects the analysis does not report and installs a project plugin — a deterministic
        # check over the IL, never code — for each one it reproduces (`predictable plugins
        # discover`), and the same job then syncs, so the checks run and are published with the
        # database. `text` is what to focus on, empty for everything. It needs the key like a fix.
        #
        # `review` (#2367) REVIEWS A PULL REQUEST: the Control Center dispatches it on the pull
        # request's head branch when this repository turned review on, with `target` the pull
        # request's number and `text` its base commit. It analyses the merge-base and the head with
        # `predictable review`, explains what the change introduced and stacks a verified fix on the
        # pull request when a model key is there, and reports to the Control Center, whose App posts
        # the check and the comment. Only the analysis decides the check, so it needs no key.
        #
        # A SETTING AND A CLEAN ARE NOT VERBS HERE: both are writes to `predictable-code-database`,
        # which the Control Center makes itself.
        #
        # `republish` (#2257) rebuilds the datasets over the branch's last analysis WITHOUT
        # analysing: what a merge that changed only module summaries is owed. It recompiles the
        # specs (`predictable specs compile`) over the branch's analysis in the database and
        # publishes the result as the analysis of the commit it checked out. Keyless, and started by
        # the Control Center alone; over an analysis another build wrote it analyses instead, since
        # that analysis is not this build's to rebuild.
        description: "What to run: sync (analyse), fix (one deterministic fix), fix-agent (one agent fix), fix-all-agent (every defect in one agent session, into a live draft pull request), spec-new / spec-describe / requirement-add / requirement-update / requirement-remove (author a spec), spec-generate (a new spec whose requirements a model writes), spec-fill-descriptions (a model writes the specs' missing descriptions), spec-implement (an agent implements a spec until the analysis verifies it), plugins-discover (an agent writes checks for defects the analysis misses, then the run syncs with them), review (review a pull request, on its head branch), or republish (rebuild the datasets over the last analysis when only module summaries changed)."
        required: false
        default: sync
        type: string
      target:
        description: "For a fix, the finding to fix. For spec-describe, requirement-add and spec-implement, the spec id. For requirement-update and requirement-remove, SPEC-ID/REQ-ID. For review, the pull request's number. Ignored by sync and spec-new."
        required: false
        default: ""
        type: string
      prompt:
        # SUPPLIED, NOT REBUILT HERE. The Control Center's `fixPrompt` is the one
        # producer of what a fix agent is asked — the desktop product uses the same
        # function — and a second builder written in shell is how a hosted agent would
        # come to be told something a local one is not.
        # For `spec-generate` it is the person's short description of the feature, which the
        # model expands: also what a model is asked, and also supplied verbatim.
        description: "For command=fix-agent, what the agent is asked to do. For spec-generate, the person's short description of the feature."
        required: false
        default: ""
        type: string
      text:
        # WHAT A PERSON WROTE, for the three authoring verbs: the new spec's name, the
        # description, or the requirement sentence. Its own input rather than `prompt`,
        # because `prompt` is what an AGENT is asked, and a field whose meaning depends
        # on the verb is how a hosted run comes to hand prose to the wrong reader.
        # Free text from an API call, so it reaches the script through the ENVIRONMENT,
        # exactly like `prompt`.
        description: "For spec-new and spec-generate, the spec name; for spec-describe, the description; for requirement-add and requirement-update, the requirement sentence; for spec-fill-descriptions, all or the spec files, one per line; for spec-implement, the spec's branch (predictable/specs/…); for plugins-discover, what to focus on (empty for everything); for review, the pull request's base commit."
        required: false
        default: ""
        type: string
      runner:
        # A BIGGER MACHINE IS THE ONLY LEVER FOR A BIG REPOSITORY TODAY, so it is
        # offered rather than hidden.
        #
        # Measured on a 1,213-file TypeScript repository on the standard runner
        # (2 cores, 7 GB): the tsc front end exhausted its 3,374 MB V8 old-space budget
        # and TypeScript was reported as not translated, which leaves the analysis with
        # nothing to read. Raising the budget on THAT machine does not help — V8's RSS
        # runs above its old-space cap, so a cap near the machine's size trades a clean
        # heap error for the kernel killing the process, which is why
        # `nodeFrontEndHeapMb` caps at half the measured headroom on purpose.
        #
        # Sharding would be the answer that scales, and it is NOT available: a split
        # invocation emits 10 of 95 documents differently and resolves fewer call
        # targets, which reads downstream as fewer obligations against identical code.
        # `make check-il-identity` gates that work and is red by design until it lands.
        description: "Runner to analyse on. A large repository needs more memory than the standard runner has."
        required: false
        default: ubuntu-24.04
        type: string
      started_by:
        # WHO STARTED IT, recorded in the analysis's `.analysis.json` and nowhere else. Empty for a
        # run nobody started — the analysis a push dispatches. Data, never shell: it reaches the
        # script through the environment and is written with `jq --arg`.
        description: "The GitHub login of the person who started this run; empty for an automatic one."
        required: false
        default: ""
        type: string
      attempt:
        # WHICH ATTEMPT AT A FIX THIS IS (#2240), named by the Control Center and written into the
        # fix branch's `.analysis.json` — nowhere else. A fix chain retries a still-reported finding
        # on the SAME branch, so that branch's directory on the data branch is overwritten attempt
        # after attempt; this is how the plane tells the analysis of the attempt it is waiting on
        # from an earlier one, without trusting two clocks. Data, never shell: environment + `jq`.
        description: "For command=fix-agent, the Control Center's id for this attempt; empty otherwise."
        required: false
        default: ""
        type: string
      finding:
        # THE FINDING AS THE ANALYSIS KEYS IT (`fqn|vc`, or `fqn|category` for a finding with no
        # `vc`), so this run can tell from its own re-analysis whether the fix closed it. `target`
        # is the FIN id a person reads, which no analysis output carries. Data, never shell:
        # environment + `jq --arg`.
        description: "For command=fix-agent, the finding's analysis key (fqn|vc); empty otherwise."
        required: false
        default: ""
        type: string
      heap_mb:
        # Only useful together with a bigger runner, for the reason above. Empty means
        # the product decides from the memory it can actually see, which is the right
        # default and the one every measurement here supports.
        description: "Override the tsc front end V8 old-space budget, in MB. Leave empty to let the run size it from measured headroom."
        required: false
        default: ""
        type: string

# Least privilege, and each one is load-bearing:
#   contents     — check the code out, push `predictable-code-database`, and push
#                  the branch a fix or an authored spec is proposed on
#   id-token     — mint the OIDC token that authenticates this job to the control plane
#   pull-requests— open the pull request a fix or an authored spec is proposed in
permissions:
  contents: write
  id-token: write
  pull-requests: write

# One run at a time per ref, whatever it is. Two syncs in one tree is a documented
# hazard, and so is a fix beside a sync — the fix's own edits leave a sync running as it
# settles, which is why the desktop product refuses the same pair. The group deliberately
# does NOT include the command, or a fix and a sync would be allowed to overlap.
concurrency:
  group: predictable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ${{ inputs.runner }}
    # MUST EQUAL `PC_JOB_SECONDS` / 60 in the Run step (#2264). A description run derives its time
    # bound and its hard stop from that number, and no step can read this one; changed apart, the
    # run would stop early or be cancelled by GitHub with its work unpublished.
    # `cloud-workflow-template.test.ts` fails the build when the two disagree.
    timeout-minutes: 60

    steps:
      # WHEN THIS JOB STARTED, before anything else spends its hour (#2264). A description run
      # bounds itself by TIME so the runner's own timeout never cancels it: a cancelled job
      # publishes nothing, and a whole run's descriptions — the customer's key spent on them —
      # were lost exactly that way. The Run step derives the bound from this.
      - name: Note when the job started
        run: |
          set -euo pipefail
          echo "PC_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # THE CLI DOWNLOADS WHILE EVERYTHING ELSE GETS READY (#2481). Every verb needs the runtime
      # package, and fetching it is network and disk the steps before the first command do not use:
      # the checkout, the checks and the dependency stores' restore. So it starts FIRST, in the
      # background, and `Fetch a short-lived download of the CLI` waits for it where the package is
      # first needed — by then it has usually finished. It used to be a cache restore here, one
      # after another with every other restore: 14 s of a warm run's 46 s of setup, after a
      # 1.3 GB whole-root entry that cost 36 s.
      #
      # NO PACKAGE CACHE ANY MORE. Downloaded every run, overlapped, the package costs no more than
      # restoring it did, works for `latest` too, needs no save, and keeps 433 MB per release out of
      # this repository's 10 GB cache budget. What a release does NOT change — the toolchains — is
      # kept, in `Restore the provisioned toolchains`.
      #
      # A refusal below (no key, an engine the package cannot run) still ends the job before
      # anything waits on this: the job ends, and the runner stops what it started.
      - name: Start the download of the CLI
        id: download
        env:
          CONTROL_PLANE: ${{ inputs.control_plane }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PC_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          # What the background job says, kept apart from this step: its outputs (this step's
          # `$GITHUB_OUTPUT` is gone by the time it finishes), its log, and its exit status, which
          # the waiting step reads. Written under `$RUNNER_TEMP`, outside the checkout.
          PC_FETCH="${RUNNER_TEMP}/pc-fetch"
          rm -rf "$PC_FETCH" && mkdir -p "$PC_FETCH"
          : > "$PC_FETCH/outputs"
          {
            # THE STATUS IS WRITTEN WHATEVER THE DOWNLOAD DID. This group would otherwise inherit the
            # step's `set -e` and die with the subshell, before the line that records why — and the
            # waiting step would then sit out its whole bound and report a timeout instead of the
            # refusal, the expired URL or the missing platform that actually happened.
            set +e
            (
              set -euo pipefail
              # This step's own output file is gone once it exits; the job writes to its own, and
              # the waiting step publishes from it only the names it expects.
              GITHUB_OUTPUT="$PC_FETCH/outputs"
            set -euo pipefail

            # The audience is the control plane itself. GitHub mints a token for whatever
            # audience is asked for, so naming it here is what stops this token being
            # replayable at any other service.
            OIDC=$(curl -sSf \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CONTROL_PLANE}" | jq -r '.value')

            # ONE helper for all six assets. A signed URL is a credential for the life of
            # its signature, so it must never reach the command line, a log, or a step
            # output: `-K` makes curl read it from a file, keeping it out of `ps` and out
            # of any shell trace, and the file is deleted the moment it is consumed.
            #
            # `--fail-with-body` so a refusal is readable — the control plane explains
            # itself in JSON, and a bare `-f` would discard exactly that.
            LAST_RESPONSE=""
            # STREAMED INTO `tar`, never written to disk first (#2481): the download and the unpack
            # overlap, and 400 MB is never written only to be read back. The signing call runs in
            # THIS shell, so `LAST_RESPONSE` survives it; only the transfer is in the pipeline, and
            # `pipefail` fails the step when either end of it does.
            #
            # ZSTD WHERE THE RUNNER HAS IT (#2481): asked for with `format=zst`, answered with the zstd
            # package where the release publishes one and the gzip one otherwise, and the answer's
            # `format` names which — so a release, a control plane or a runner from before zstd
            # packages still gets the gzip one it always did. Measured on a standard runner: 26%
            # fewer bytes and 2.1 s to unpack against 5.9 s.
            fetch_unpacked() { # fetch_unpacked <query> <directory>
              local q="$1" dest="$2" started format
              command -v zstd >/dev/null 2>&1 && q="${q}&format=zst"
              LAST_RESPONSE=$(curl -sS --fail-with-body \
                -H "Authorization: Bearer ${OIDC}" \
                "${CONTROL_PLANE}/api/cloud/toolchain?${q}&tag=${RELEASE_TAG}")
              printf 'url = "%s"\n' "$(echo "${LAST_RESPONSE}" | jq -r '.url')" > /tmp/pc-curlrc
              format=$(echo "${LAST_RESPONSE}" | jq -r '.format // "gz"')
              started=$(date +%s)
              unpack() {
                if [ "${format}" = "zst" ]; then zstd -dcq | tar -xf - -C "${dest}"; else tar -xzf - -C "${dest}"; fi
              }
              curl -sSfL -K /tmp/pc-curlrc | unpack || {
                echo "::error::the signed download for ${q} failed or expired"
                rm -f /tmp/pc-curlrc
                exit 1
              }
              rm -f /tmp/pc-curlrc
              echo "Downloaded and unpacked the ${format} package in $(( $(date +%s) - started ))s."
            }

            # THE SAME LAYOUT `install.sh` PRODUCES, and that is the whole requirement:
            # the launcher resolves the binary as `$PREDICTABLE_HOME/bin/predictable`, so
            # a flat root here is an install the launcher correctly refuses to run
            # ("no binary at .../bin/predictable; this install is incomplete"). A second
            # layout would also be a second thing to keep in step with the launcher.
            # OUTSIDE THE CHECKOUT, and that is not tidiness. Placed inside it, the
            # install root is part of the project as far as any scan is concerned:
            # `predictable init --accept-config-suggestions` walked it and reported
            # Lean's own sources, z3's bundled python and node's docs as this
            # repository's code paths, turning a 400-file project into 20,775 files to
            # translate. `$RUNNER_TEMP` is on the same filesystem and outside the tree.
            UNPACK="${RUNNER_TEMP}/predictable-pkg"
            mkdir -p "$UNPACK"

            # THE RUNTIME PACKAGE, NOT A BARE BINARY.
            #
            # A bare `predictable` can analyse Java and nothing else: the TypeScript front
            # end is a binary PLUS `typescript-tsc/dist/emit.js` and a
            # `node_modules/typescript` tree, which is a directory and can never be an
            # individual release asset. Measured on the first customer-shaped run — the
            # job installed the binary, provisioned a toolchain successfully, and then
            # died at `predictable_typescript_direct binary not found next to
            # predictable` having translated nothing.
            #
            # WHAT THE PACKAGE CARRIES, AND WHAT IT DOES NOT. It carries what we BUILD: the
            # binaries, the front ends, and the compiled artefacts a generated verification
            # project imports. It does NOT carry the Lean toolchain, z3 or node — since
            # #1863 those are fetched from their pinned URLs and checksums by the
            # provisioning step below, which took the customer download from 1.2 GB to
            # 229 MiB. `make test-bundle-install` proves the package half of that shape:
            # unpacked where it was not built, system PATH only, analysing a real project.
            #
            # THIS PARAGRAPH USED TO SAY THE OPPOSITE — that the package carried the
            # toolchain "so there is no separate provisioning step" — and that is exactly
            # the premise `cfeb78159` acted on when it DELETED the provisioning step. The
            # step's own comment below records what that cost: "without this the hosted run
            # dies on its first command". The claim is corrected here rather than only
            # there, because a reader who believes this one will delete that step again.
            # THE PLATFORM IS DERIVED, NOT ASSUMED. This said `platform=linux-x64`, while the
            # `runner` input above is one we INVITE the customer to change — its own description is
            # "A large repository needs more memory than the standard runner has", and the
            # out-of-memory summary this workflow prints tells them to do exactly that. Follow that
            # advice onto a macOS runner and the job downloaded Linux binaries: the shape check below
            # still PASSES, because `bin/predictable` exists and is executable, so the failure
            # surfaced much later as an exec format error with nothing pointing back here.
            #
            # The same two cases `install.sh`'s `detect_platform` resolves, and the same refusal for
            # anything else — a release publishes darwin-arm64 and linux-x64 and nothing more, so an
            # arm64 Linux or an Intel macOS runner is told so by name rather than handed an archive
            # that cannot run.
            case "$(uname -s)-$(uname -m)" in
              Linux-x86_64)  PC_PLATFORM=linux-x64 ;;
              Darwin-arm64)  PC_PLATFORM=darwin-arm64 ;;
              *)
                echo "::error::no Predictable Code package is published for $(uname -s)/$(uname -m); this workflow's \`runner\` must be a linux-x64 or darwin-arm64 machine"
                exit 1
                ;;
            esac
            RECORD="$UNPACK/release.json"
            rm -rf "$UNPACK"
            mkdir -p "$UNPACK"
            echo "Installing the ${PC_PLATFORM} package on $(uname -s)/$(uname -m)."
            fetch_unpacked "platform=${PC_PLATFORM}&kind=runtime" "$UNPACK"
            # Read off the response we already have, rather than a second call that would
            # mint a signed URL nobody downloads.
            echo "tag=$(echo "${LAST_RESPONSE}" | jq -r '.tag')" >> "$GITHUB_OUTPUT"
            echo "schema_hash=$(echo "${LAST_RESPONSE}" | jq -r '.schemaHash // ""')" >> "$GITHUB_OUTPUT"
            # What a restored root is checked against: the tag and schema the control plane named
            # for these bytes. Never the signed URL, which is a credential.
            echo "${LAST_RESPONSE}" | jq '{tag, schemaHash}' > "$RECORD"

            # ONE NAME FOR THE ROOT WHATEVER THE RELEASE, because the toolchains are kept apart from
            # the package and must outlive it: a provisioned tool can hold its own absolute path (a
            # virtualenv's interpreter does), and a cache entry is only ever restored to the paths it
            # was saved from. The archive's directory carries the version, so a root left under
            # that name would make every release a cold toolchain install. Nothing reads the
            # version off the directory: `release.json` beside it records the tag.
            set -- "$UNPACK"/predictable-runtime-*/
            [ "$#" -eq 1 ] && [ -d "$1" ] || {
              echo "::error::the runtime package holds $# root directories where it should hold one"
              exit 1
            }
            mv "${1%/}" "$UNPACK/predictable-runtime-installed"


            # The archive holds ONE `predictable-runtime-*` directory, and that directory
            # is the install root — the same layout `install.sh` produces, which is what
            # `launcher.sh` inside it resolves against.
            set -- "$UNPACK"/predictable-runtime-*/
            PC_HOME="${1%/}"
            [ -x "$PC_HOME/bin/predictable" ] || {
              echo "::error::the runtime package holds no bin/predictable; this release cannot analyse"
              exit 1
            }

            echo "predictable_home=$PC_HOME" >> "$GITHUB_OUTPUT"

            # WHERE THE PLUGIN'S OWN WRAPPER LOOKS FOR THE CLI, which is not where we just
            # put it — and until this line, on a runner, it never found it.
            #
            # MEASURED on the v21 run of this very workflow. The plugin ships a `bin/predictable`
            # wrapper that every hook and the `sync` skill invoke, and it resolves
            # `${CLAUDE_PLUGIN_DATA:-${PLUGIN_DATA:-$HOME/.predictable-code-runtime}}/runtime/bin/predictable`
            # first, falling back to a `predictable` on PATH. On a runner NEITHER hits: we unpack
            # to `$RUNNER_TEMP`, not `$HOME/.predictable-code-runtime`, and the package's own `bin`
            # is deliberately kept off PATH (see the `--pinned` note below — putting it on PATH
            # would let `resolveUserClaude` find our bundled agent under the user's name). So the
            # wrapper printed `no runtime bundle in /home/runner/.predictable-code-runtime/runtime
            # and no predictable on PATH` and exited 127, three times, in a run that went GREEN.
            #
            # WHAT THAT COST, and it is the whole point of loading the plugin at all: the
            # SessionStart hook could not start the background sync, so the agent worked with no
            # findings, no requirements and no way to check its own change. It said so plainly —
            # "I started the sync, but it can't run in this environment" — and the run still
            # settled successfully, because an agent declining is a legitimate outcome and
            # nothing downstream could tell that one apart from a considered refusal.
            #
            # A SYMLINK AND A VARIABLE, rather than exporting PATH: the wrapper primes PATH,
            # `LEAN_SYSROOT` and `LEAN_PATH` itself, exactly as `launcher.sh` does, and it does so
            # INSIDE its own process — so the bundled agent never reaches the PATH this workflow's
            # own `predictable claude` resolves against, and the rule above is kept.
            ln -sfn "$PC_HOME" "$UNPACK/runtime"
            echo "plugin_data=$UNPACK" >> "$GITHUB_OUTPUT"

            # RESTORED TO THIS STEP, and the move out of it was the whole defect. This block
            # reads `PC_COMMAND`, `OIDC` and `CONTROL_PLANE`: the first two are this step's own
            # (`env:` above and a shell local), and step state does not cross steps — so from
            # the provisioning step it ran under `set -euo pipefail` against an unset
            # `PC_COMMAND` and exited 1 on the FIRST line it reached, for every command, not
            # only `fix-agent`. It also wrote `plugin_dir` into a step with no `id:` while the
            # consumer reads `steps.toolchain.outputs.plugin_dir`, so even a fixed environment
            # would have handed the agent an empty plugin directory.
            # THE CLAUDE PLUGIN, and only for the verb that needs it.
            #
            # `predictable claude` normally provisions its plugin directory by shallow-
            # cloning our plugin repository — which is PRIVATE, so this runner's
            # `GITHUB_TOKEN` cannot read it and the clone would fail AFTER the download
            # above, the most expensive possible place to find out. The control plane
            # hands over a short-lived, credential-free URL instead, exactly as it does
            # for the runtime package.
            #
            # OUTSIDE THE CHECKOUT, which is not tidiness: the CLI's own default cache is
            # `.predictable-code/claude-plugin`, and the fix branch stages SOURCE with
            # `git add -A` — so a plugin unpacked in the tree would be committed into the
            # customer's pull request. `PREDICTABLE_CLAUDE_PLUGIN_DIR` is what stops the
            # clone happening at all.
            # A REVIEW (#2367) gets it too: the verified fix it stacks is the Fix All driver's session.
            if [ "${PC_COMMAND}" = "fix-agent" ] || [ "${PC_COMMAND}" = "fix-all-agent" ] || [ "${PC_COMMAND}" = "spec-implement" ] || [ "${PC_COMMAND}" = "plugins-discover" ] || [ "${PC_COMMAND}" = "review" ]; then
              PLUGIN_ROOT="${RUNNER_TEMP}/predictable-plugin"
              mkdir -p "$PLUGIN_ROOT"
              PLUGIN_RESPONSE=$(curl -sS --fail-with-body \
                -H "Authorization: Bearer ${OIDC}" "${CONTROL_PLANE}/api/cloud/plugin")
              printf 'url = "%s"\n' "$(echo "${PLUGIN_RESPONSE}" | jq -r '.url')" > /tmp/pc-curlrc
              curl -sSfL -o "${RUNNER_TEMP}/pc-plugin.tar.gz" -K /tmp/pc-curlrc || {
                echo "::error::the signed download for the Claude plugin failed or expired"
                rm -f /tmp/pc-curlrc
                exit 1
              }
              rm -f /tmp/pc-curlrc
              # GitHub's tarball wraps everything in one `<owner>-<repo>-<sha>/`
              # directory, so it is stripped: `--plugin-dir` is handed the directory that
              # CONTAINS `.claude-plugin/plugin.json`, not its parent.
              tar -xzf "${RUNNER_TEMP}/pc-plugin.tar.gz" -C "$PLUGIN_ROOT" --strip-components=1
              rm -f "${RUNNER_TEMP}/pc-plugin.tar.gz"
              [ -f "$PLUGIN_ROOT/.claude-plugin/plugin.json" ] || {
                echo "::error::the plugin download holds no .claude-plugin/plugin.json"
                exit 1
              }
              echo "plugin_dir=$PLUGIN_ROOT" >> "$GITHUB_OUTPUT"
              echo "Installed the Claude plugin"
            fi

            echo "Installed the runtime package from ${RELEASE_TAG}"
            )
            rc=$?
            # Renamed into place, so the waiting step never reads a status file that exists but is
            # still empty.
            echo "$rc" > "$PC_FETCH/status.tmp" && mv "$PC_FETCH/status.tmp" "$PC_FETCH/status"
          } > "$PC_FETCH/log" 2>&1 < /dev/null &
          # Detached from this step's shell, which exits now; the runner reaps it at the job's end.
          disown
          echo "The CLI is downloading in the background."

      - uses: actions/checkout@v6
        with:
          # Full history: the analysis records which commit it describes, and a shallow
          # clone makes that unanswerable.
          fetch-depth: 0
          # EVERY COMMIT, ONLY THE CHECKED-OUT TREE'S CONTENTS. History is what a run reads (which
          # commit, which merge-base); the bytes of every file at every past commit are what a full
          # clone spends its time on, and a run reads almost none of them. A blob a later step does
          # need — a merge-base checked out for a review, a branch a fix continues — is fetched on
          # demand through the credentials this checkout keeps, so nothing reads differently.
          filter: blob:none

      - name: Check the configured engine
        id: engine
        # A STEP OF ITS OWN, APART FROM THE KEY CHECK BELOW, because GitHub names a step with
        # nothing but its conclusion. While the two refusals shared one step, its failure was read
        # as a missing key: a repository configured for GitHub Copilot CLI, or for OpenCode
        # inference, that HAD a key was remembered as missing one, and the Fix button sent its
        # reader to add a secret that changes nothing. Apart, each step that fails says one thing,
        # and `run-steps.ts` words each with its own remedy.
        #
        # BEFORE ANYTHING WAITS FOR THE DOWNLOAD, like the key check and for the same reason: a run
        # that cannot start its engine must not install the runtime package to find out. The
        # download it started in the background ends with the job.
        #
        # THE SAME VERBS AS THE KEY CHECK — the ones that spawn an engine (see below). It reads no
        # secret: which engine a repository chose is in its own file.
        if: inputs.command == 'fix' || inputs.command == 'fix-agent' || inputs.command == 'fix-all-agent' || inputs.command == 'spec-generate' || inputs.command == 'spec-fill-descriptions' || inputs.command == 'spec-implement' || inputs.command == 'plugins-discover'
        env:
          # Which verb is asking: a generation asks the INFERENCE engine, a fix the main one,
          # and the refusal names the verb.
          PC_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          # WHICH ENGINE THIS REPOSITORY CHOSE, because the key it needs follows from it.
          # `analyze fix-issue` dispatches through `mkFlowAdapter`, which honours the
          # project's own `aiProvider` — so demanding an Anthropic key from a repository
          # configured for another engine asks for a credential the run will never use,
          # and then fails later for the real reason.
          #
          # MEASURED SPELLING: the field serialises the CONSTRUCTOR name — `claudeCode`,
          # `copilotCli`, `opencodeCli` — not the `toKey` spellings (`claude`, `copilot`,
          # `opencode`) that appear elsewhere in the codebase. Read from two real
          # `project.json` files. A check written against the short names would match
          # `claudeCode` by accident and `copilotCli` by accident too, which is worse than
          # not checking.
          #
          # DEFAULTS TO CLAUDE when there is no project file: that is the product's own
          # compiled-in fallback, and a repository with no committed analysis is refused a
          # few lines later for that reason instead — a better message than this one.
          #
          # A SPEC GENERATION ASKS THE INFERENCE ENGINE (#2055): `specs new` goes through
          # `mkInferenceAdapter`, which prefers `inferenceProvider` and falls back to the main
          # one — so that is the engine this reads, and whose key the next step checks, in the
          # same order.
          ENGINE=claudeCode
          if [ -f .predictable-code/project.json ]; then
            if [ "${PC_COMMAND}" = "spec-generate" ] || [ "${PC_COMMAND}" = "spec-fill-descriptions" ]; then
              ENGINE=$(jq -r '.inferenceProvider.engine // .aiProvider.engine // "claudeCode"' .predictable-code/project.json 2>/dev/null || echo claudeCode)
            else
              ENGINE=$(jq -r '.aiProvider.engine // "claudeCode"' .predictable-code/project.json 2>/dev/null || echo claudeCode)
            fi
          fi
          # REDUCED TO LETTERS AND DIGITS, the alphabet of every engine's constructor name, because
          # the value comes from the repository's own file and is written below as this step's
          # output: a newline in it would forge a second output line.
          ENGINE=$(printf '%s' "${ENGINE}" | tr -cd 'A-Za-z0-9')
          echo "Configured engine: ${ENGINE}"

          # NOT SHIPPED, AND SAID BEFORE ANYTHING IS DOWNLOADED. The runtime package
          # carries `claude` and `opencode`; this repository pins no `copilot` at all, so
          # a run configured for it would install 3.9 GB and then fail on a missing
          # binary. The remedy is the customer's and it is one command, so it is named.
          if [ "${ENGINE}" = "copilotCli" ]; then
            echo "::error::this repository is configured to use GitHub Copilot CLI, which the Predictable runtime package does not ship — a hosted ${PC_COMMAND} cannot run it"
            {
              echo "### The configured engine is not available on a runner"
              echo
              echo 'This repository'"'"'s configuration (`project.json` on the `predictable-code-database` branch) selects **GitHub Copilot CLI**. The runtime package this workflow installs ships `claude` and `opencode`, and no `copilot` — so a hosted fix has nothing to run.'
              echo
              echo 'Either switch the project to an engine the package ships (`predictable settings engine set claude <model>`, or `opencode`), or run the fix from your own machine where your `copilot` CLI is installed and signed in.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # NO INFERENCE ON OPENCODE YET (#2234): a generation or a description run writes text
          # people read, and it must not carry a memory file the model was never meant to see.
          # The `claude` it spawns runs isolated from every `CLAUDE.md`; OpenCode still reads
          # the checkout's and `~/.claude/CLAUDE.md`, and its isolation is #2239. Refused here,
          # before the download, rather than run leaking — the fix verbs read the main engine
          # and are not affected, and Claude is the default.
          if [ "${ENGINE}" = "opencodeCli" ] && { [ "${PC_COMMAND}" = "spec-generate" ] || [ "${PC_COMMAND}" = "spec-fill-descriptions" ]; }; then
            echo "::error::opencode inference is temporarily unavailable pending memory isolation, see #2239 — a hosted ${PC_COMMAND} cannot run on it"
            {
              echo "### OpenCode inference is temporarily unavailable"
              echo
              echo 'This repository'"'"'s configuration (`project.json` on the `predictable-code-database` branch) selects **OpenCode** for inference. A hosted '"${PC_COMMAND}"' does not run on it yet: OpenCode still reads memory files (`CLAUDE.md`) the model must not see in what it writes, and isolating it is tracked in #2239.'
              echo
              echo 'Switch inference to Claude (`predictable settings inference-engine set claude <model>`), which runs isolated, and run it again.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # HANDED TO THE KEY CHECK, which reads it rather than deciding the engine a second time.
          echo "engine=${ENGINE}" >> "$GITHUB_OUTPUT"

      - name: Check for a model key
        # EVERY FIX VERB, not just the agent one. MEASURED, and it corrects a claim this
        # file used to make: `predictable analyze fix-issue` is NOT model-free. Its own
        # module header says it runs `AnalysisFixAgent.run`, and a real hosted run
        # spawned `bin/claude` with an EMPTY `ANTHROPIC_API_KEY` and published a pull
        # request containing nothing but our log.
        #
        # What actually separates the two verbs is the ACCEPT GATES: `fix-issue`
        # re-translates, re-analyses, and DISCARDS the edit unless all four hold — so it
        # is narrower and revertible, not unmodelled. Both need the customer's key.
        #
        # BEFORE ANYTHING WAITS FOR THE DOWNLOAD, and that is the whole point of its position. A
        # missing key discovered after installing the runtime package costs minutes of the
        # customer's runner to tell them to add a secret; discovered here it costs
        # seconds, and the download started in the background ends with the job. The same reason the product refuses a control it cannot honour
        # rather than starting a run that cannot finish.
        # THE TWO FIX VERBS, NAMED — not "everything but sync". Authoring a spec (#2019) runs
        # a deterministic verb that spawns no engine, so demanding a model key for it would
        # refuse a repository that has every right to author; while `fix` MUST stay in, for
        # the measured reason above (an empty key published a pull request of our own log).
        # AND `spec-generate` (#2055): it is `specs new` WITHOUT `--blank`, whose requirements a
        # model writes through the project's engine — the same `claude` spawn `fix-issue` makes,
        # so the same missing key would fail it after the download, or leave an empty spec.
        # AND `spec-fill-descriptions` (#2103), which asks the inference engine for every
        # description it writes.
        # AND `spec-implement` (#2339), an agent session like a fix.
        if: inputs.command == 'fix' || inputs.command == 'fix-agent' || inputs.command == 'fix-all-agent' || inputs.command == 'spec-generate' || inputs.command == 'spec-fill-descriptions' || inputs.command == 'spec-implement' || inputs.command == 'plugins-discover'
        env:
          # NOT CONFIGURED BY US AND NOT REQUIRED OF ANYONE ELSE: this is the one
          # secret the workflow reads, it is the customer's own, and it is read only on
          # this verb. A repository that never runs an agent fix never needs it, which
          # is why the file's promise is still that nothing must be configured to
          # ANALYSE. An unset secret arrives as an empty string, never as an error.
          #
          # ONE EXPRESSION, TWO PLACES IT CAN BE SET. `secrets.ANTHROPIC_API_KEY`
          # resolves whatever secret of that name this REPOSITORY CAN SEE — one set on
          # the repository itself, or one set on the organisation and shared with it.
          # The workflow does not and cannot tell them apart, and does not need to.
          #
          # AND ONE ALTERNATIVE NAME, WHICH IS A CONVENTION AND NOT A PRODUCT CONCEPT.
          # `ORG_ANTHROPIC_KEY` is what one organisation already calls its org-wide key;
          # measured on a repository whose org shared exactly that secret and whose fix
          # still refused, because GitHub does not alias secret names and this expression
          # only ever asked for one. A reader who finds this later should feel free to
          # delete it once that org renames: it buys compatibility with a name somebody
          # chose, never a capability.
          #
          # A FIXED PAIR, NOT A CONFIGURABLE NAME. Reading `secrets[inputs.…]` would let
          # anyone who can dispatch this workflow name ANY org secret shared with the
          # repository and have it injected into an agent's environment, where the agent
          # can print it. That is an exfiltration path wearing the clothes of a feature,
          # so the set of names this reads is closed and lives here.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ORG_ANTHROPIC_KEY }}
          # Which verb is asking, so the refusal names it — a spec generation told "a fix
          # needs a key" is sent looking for a fix it never asked for.
          PC_COMMAND: ${{ inputs.command }}
          # THE ENGINE THE STEP ABOVE READ — one producer of which engine this run uses, so the
          # two checks cannot disagree about it.
          PC_ENGINE: ${{ steps.engine.outputs.engine }}
          # `self-hosted` or `github-hosted`: a self-hosted runner may hold a Claude Code account.
          PC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          # AN ENGINE STEP THAT SAID NOTHING is read as the product's own fallback, Claude, so the
          # key is checked. Never as a pass: this step passing is what records a key as PRESENT.
          ENGINE="${PC_ENGINE:-claudeCode}"
          # ONLY CLAUDE'S KEY IS CHECKED HERE, and only for Claude. OpenCode's credential
          # depends on the MODEL its provider config names (a Groq model wants
          # `GROQ_API_KEY`, an Anthropic one wants `ANTHROPIC_API_KEY`), and this step
          # cannot know which without reading a config it does not have. Demanding the
          # wrong one would be a refusal the reader cannot act on; the run reports the
          # real requirement itself.
          if [ "${ENGINE}" != "claudeCode" ]; then
            echo "Engine ${ENGINE} supplies its own credentials; not checking for an Anthropic key."
            exit 0
          fi
          # A SELF-HOSTED RUNNER MAY BE SIGNED IN TO A CLAUDE CODE ACCOUNT (#2490), and a machine that
          # is runs every `claude` on that account, key or none (#2190). Whether it is, is decided
          # where `claude` is launched — the CLI's one rule, `claudeCredentialEnv` — and never copied
          # here: this step cannot ask it before the package is installed. So on a self-hosted
          # runner a missing key is not refused; the launch uses the account, or says it has no
          # credential. A GitHub-hosted runner holds no account, and is refused as before.
          # What that account is spent on is what this repository asks: a `review` builds a pull
          # request's head on that machine, under that sign-in. The plane asks one only for a pull
          # request whose head is a branch of this repository, never a fork's.
          if [ -z "${ANTHROPIC_API_KEY}" ] && [ "${PC_RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
            echo "No model key: on this self-hosted runner, ${PC_COMMAND} runs on the machine's Claude Code account if it is signed in to one."
            exit 0
          fi
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::${PC_COMMAND} needs an ANTHROPIC_API_KEY secret this repository can see — set it on the repository, or on the organisation and share it with this repository (a secret named ORG_ANTHROPIC_KEY is also read)"
            {
              echo "### No model key"
              echo
              # SAYS BOTH PLACEMENTS. It used to say "add a repository secret", which is
              # narrower than what the workflow reads: an organisation owner who had
              # already set the key org-wide was told to add a second one per repository.
              # A message that sends a reader to do redundant work is wrong even when the
              # work would succeed.
              if [ "${PC_COMMAND}" = "spec-generate" ]; then
                echo 'Generating a spec'"'"'s requirements runs a model on this runner, so it needs a model key that belongs to you. Set a secret named `ANTHROPIC_API_KEY` that this repository can see — either on the repository (Settings -> Secrets and variables -> Actions) or on the organisation, shared with this repository — and try again. A secret named `ORG_ANTHROPIC_KEY` is read as well.'
                echo
                echo 'A **blank** new spec needs no key: it writes the spec for you to fill in, with no model.'
              elif [ "${PC_COMMAND}" = "spec-implement" ]; then
                echo 'Implementing a spec runs an agent on this runner, so it needs a model key that belongs to you. Set a secret named `ANTHROPIC_API_KEY` that this repository can see — either on the repository (Settings -> Secrets and variables -> Actions) or on the organisation, shared with this repository — and try again. A secret named `ORG_ANTHROPIC_KEY` is read as well.'
                echo
                echo 'The spec itself is already proposed; ANALYSIS needs no key.'
              elif [ "${PC_COMMAND}" = "plugins-discover" ]; then
                echo 'Looking for what Predictable misses runs an agent on this runner, so it needs a model key that belongs to you. Set a secret named `ANTHROPIC_API_KEY` that this repository can see — either on the repository (Settings -> Secrets and variables -> Actions) or on the organisation, shared with this repository — and try again. A secret named `ORG_ANTHROPIC_KEY` is read as well.'
                echo
                echo 'ANALYSIS needs no key, and neither do the checks once written: every sync runs them with no model.'
              elif [ "${PC_COMMAND}" = "spec-fill-descriptions" ]; then
                echo 'Writing the missing descriptions runs a model on this runner, so it needs a model key that belongs to you. Set a secret named `ANTHROPIC_API_KEY` that this repository can see — either on the repository (Settings -> Secrets and variables -> Actions) or on the organisation, shared with this repository — and try again. A secret named `ORG_ANTHROPIC_KEY` is read as well.'
                echo
                echo 'ANALYSIS needs no key: it counts the specs without a description and never writes one.'
              else
                echo 'A fix runs an agent on this runner, so it needs a model key that belongs to you. Set a secret named `ANTHROPIC_API_KEY` that this repository can see — either on the repository (Settings -> Secrets and variables -> Actions) or on the organisation, shared with this repository — and run the fix again. A secret named `ORG_ANTHROPIC_KEY` is read as well, so if your organisation already uses that name there is nothing to add.'
                echo
                echo 'ANALYSIS needs no key — only a fix does. The **verified fix** differs from the agent fix by re-analysing and discarding its own edit unless four accept gates hold, not by running without a model.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "A model key is configured."

      # The package managers' own stores, so installing the repository's dependencies fetches only
      # what its lockfiles changed. Keyed by those lockfiles and manifests; a store holding more
      # than one tree's packages is still the registry's bytes, checked by each install.
      #
      # WHILE THE CLI DOWNLOADS (#2481): it reads nothing the CLI writes, so it runs before the step
      # that waits for the download, and the two overlap instead of queueing.
      #
      # ONLY FOR A VERB THAT ANALYSES — a sync, a fix (its check is a sync), a review, an
      # implementation, a discovery (which syncs with its checks). Writing descriptions, generating
      # or editing a spec and republishing install no dependency, and the store was the largest
      # restore of their setup. A verb left out here that does install costs time, never a result:
      # its install fetches from the registry instead.
      - name: Restore the dependency stores
        id: depcache
        if: contains(fromJSON('["sync","fix","fix-agent","fix-all-agent","spec-implement","plugins-discover","review"]'), inputs.command)
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.npm/_cacache
            ~/.m2/repository
            ~/.gradle/caches/modules-2
            ~/.nuget/packages
          key: predictable-deps-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/pom.xml', '**/*.gradle', '**/*.gradle.kts', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            predictable-deps-${{ runner.os }}-

      # WHERE THE PACKAGE IS FIRST NEEDED: waits for `Start the download of the CLI`, replays what
      # it printed (its `::error::` lines become this step's annotations), and fails exactly when
      # it did. The name and the `toolchain` id are what the steps below and `run-steps.ts` read.
      - name: Fetch a short-lived download of the CLI
        id: toolchain
        run: |
          set -euo pipefail
          PC_FETCH="${RUNNER_TEMP}/pc-fetch"
          waited=$(date +%s)
          # Bounded: a download the control plane never answered is a failure here, not a job that
          # hangs until its timeout.
          until [ -f "$PC_FETCH/status" ]; do
            if [ $(( $(date +%s) - waited )) -ge 900 ]; then
              cat "$PC_FETCH/log" 2>/dev/null || :
              echo "::error::the download of the CLI did not finish within 15 minutes"
              exit 1
            fi
            sleep 0.2
          done
          cat "$PC_FETCH/log"
          echo "Waited $(( $(date +%s) - waited ))s for the download."
          status=$(cat "$PC_FETCH/status")
          [ "$status" = "0" ] || exit "$status"
          # BY NAME, never the file whole: what the background job wrote is published only as the
          # outputs the steps below read, each once.
          published() { awk -v k="$1=" 'index($0, k) == 1 { print substr($0, length(k) + 1); exit }' "$PC_FETCH/outputs"; }
          echo "tag=$(published tag)" >> "$GITHUB_OUTPUT"
          echo "schema_hash=$(published schema_hash)" >> "$GITHUB_OUTPUT"
          echo "predictable_home=$(published predictable_home)" >> "$GITHUB_OUTPUT"
          echo "plugin_data=$(published plugin_data)" >> "$GITHUB_OUTPUT"
          echo "plugin_dir=$(published plugin_dir)" >> "$GITHUB_OUTPUT"

      # THE PACKAGE NO LONGER CARRIES THE TOOLCHAIN, so this step is back.
      #
      # It was removed in `cfeb78159` on the stated premise that the package carried `base`.
      # That premise is gone: since #1863 the release ships what WE build and a provisioning
      # record — `mise.toml`, `mise.lock`, `provision.sh` — and Lean, z3 and node are fetched
      # here from their pinned URLs and checksums. The customer download went 1.2 GB to
      # 229 MiB for the same reason. Without this the hosted run dies on its first command.
      #
      # IT ALSO PUTS THE AGENT BACK. `group_base` includes `aqua:anthropics/claude-code` and
      # `links()` maps it to `bin/claude` — beside `bin/predictable`, which is exactly where
      # `--pinned` looks (`resolvePinnedClaude` reads `(← IO.appPath).parent`). So the same
      # step that fixes `sync` is what makes the agent fix resolvable again; without it
      # `--pinned` selects a copy that stopped shipping with #1868.
      #
      # WHAT THIS VERB RUNS, NOT ALL OF `base` (#2481) — and a language group is fetched the first
      # time a project needs one, so a TypeScript repository does not pay for a JDK.
      #
      # `node` for every verb: the TypeScript front end and the witness engine are written in it.
      # The agent CLI only for a verb that starts one, and OpenCode only where the repository chose
      # it. LEAN IS NOT INSTALLED HERE: nothing a hosted run does by default reads it (a sync
      # renders and compiles no Lean, `needsLeanTree`), and installing it was most of this step's
      # time and most of the bytes every later run restored. A run that does need it — a project
      # whose input is Lean, the opt-in proving tail — and any `base` tool this step did not
      # install is provisioned by the product the first time it is resolved (`provisionBase`), so
      # choosing less here can only cost time, never a result.
      - name: Name the provisioned toolchains
        id: toolkey
        env:
          PC_HOME: ${{ steps.toolchain.outputs.predictable_home }}
        run: |
          set -euo pipefail
          # KEYED BY THE PINS, NOT THE RELEASE: what `provision.sh` installs is exactly what these
          # files name, so a release that changed no pin installs the same bytes and reuses them.
          pins=$(cat "$PC_HOME/mise.toml" "$PC_HOME/mise.lock" "$PC_HOME/lock.sh" \
            "$PC_HOME/python-frontend.lock.txt" 2>/dev/null | { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-16)
          echo "prefix=predictable-tools-${RUNNER_OS}-${RUNNER_ARCH}-${pins}-" >> "$GITHUB_OUTPUT"

      # EVERY TOOLCHAIN AN EARLIER RUN OF THESE PINS PROVISIONED, the language groups a sync installs
      # while it runs included — those used to be fetched again on every run, since nothing kept
      # them. The most recent entry for these pins is the widest set this repository has needed.
      - name: Restore the provisioned toolchains
        id: toolcache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/predictable-pkg/predictable-runtime-installed/mise
            ${{ runner.temp }}/predictable-pkg/predictable-runtime-installed/bin/mise
            ${{ runner.temp }}/predictable-pkg/predictable-runtime-installed/.venv*
          key: ${{ steps.toolkey.outputs.prefix }}restore
          restore-keys: |
            ${{ steps.toolkey.outputs.prefix }}

      - name: Provision the pinned toolchain
        id: provision
        env:
          PC_HOME: ${{ steps.toolchain.outputs.predictable_home }}
          PC_COMMAND: ${{ inputs.command }}
          PC_ENGINE: ${{ steps.engine.outputs.engine }}
        run: |
          set -euo pipefail
          tools=(node)
          # THE ENGINE THE CHECK ABOVE READ, and for a review — which that check does not run for,
          # since a review must run without an engine and the check refuses some — the same field of
          # the same file, read the same way. Only to choose what to install: a Copilot repository
          # gets no agent CLI (the package ships none for it), an OpenCode one gets OpenCode.
          ENGINE="${PC_ENGINE:-}"
          if [ -z "${ENGINE}" ]; then
            ENGINE=claudeCode
            if [ -f .predictable-code/project.json ]; then
              ENGINE=$(jq -r '.aiProvider.engine // "claudeCode"' .predictable-code/project.json 2>/dev/null || echo claudeCode)
            fi
            ENGINE=$(printf '%s' "${ENGINE}" | tr -cd 'A-Za-z0-9')
          fi
          case "${PC_COMMAND}" in
            fix|fix-agent|fix-all-agent|spec-generate|spec-fill-descriptions|spec-implement|plugins-discover|review)
              case "${ENGINE}" in
                opencodeCli) tools+=("aqua:anomalyco/opencode") ;;
                copilotCli) ;;
                *) tools+=("aqua:anthropics/claude-code") ;;
              esac
              ;;
          esac
          PREDICTABLE_HOME="$PC_HOME" "$PC_HOME/provision.sh" install "${tools[@]}"

      - name: Open the database
        # EVERY VERB READS IT. A sync reuses the analysis of the same state and counts the specs
        # that are new since the last one; a fix resolves its finding against the analysis that
        # found it; a generated requirement binds against its IL; documenting or editing a spec the
        # analysis inferred needs that spec's page. All of it lives on `predictable-code-database`,
        # which `predictable migrate` checks out at `.predictable-code/` — the same worktree a
        # developer's machine has, so this run and theirs read and write it alike.
        #
        # A REPOSITORY FROM BEFORE THE DATABASE (a `.predictable-code/` on the code branch) is
        # migrated HERE ONLY FOR THIS RUN (`--keep-code-branch`): its configuration moves to the
        # database, and the code branch is not touched — that is a person's commit to make, with
        # `predictable migrate` on their own machine.
        #
        # SPEC PAGES ONLY FOR THE VERBS THAT TOUCH AN EXISTING SPEC — describing one, adding a
        # requirement to one, writing missing descriptions — and only where the branch has none.
        # Restored for a fix, they would ride into its pull request; restored for a sync, they
        # would be analysed as if a person had written them. WRITTEN TO A FILE AS WELL AS RUN,
        # because the spec step may check another branch out — with `-f`, over these untracked
        # copies — and then restores again on top of that branch.
        env:
          PC_HOME: ${{ steps.toolchain.outputs.predictable_home }}
          EXPECTED: ${{ steps.toolchain.outputs.schema_hash }}
          PC_COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          # A BRANCH, NEVER A TAG. Everything this workflow reads and writes is keyed by the branch
          # name: the analysis on the database, and the base of every pull request.
          if [ "${GITHUB_REF_TYPE:-branch}" != "branch" ]; then
            echo "::error::this workflow runs on a branch; it was dispatched on the ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
            exit 1
          fi
          git config user.name "predictable-code[bot]"
          git config user.email "predictable-code[bot]@users.noreply.github.com"
          # NO HOOK OF THE REPOSITORY'S RUNS FOR ANY PUSH OF THIS JOB — the database's included, which
          # the sync pushes itself: see "THE REPOSITORY'S OWN GIT HOOKS" in the Propose step.
          git config core.hooksPath /dev/null
          PREDICTABLE_HOME="$PC_HOME" "$PC_HOME/launcher.sh" migrate --force --keep-code-branch \
            --path "$PWD/.predictable-code"
          RESTORE="${RUNNER_TEMP:-/tmp}/pc-restore.sh"
          cat > "$RESTORE" <<'PC_RESTORE'
          set -euo pipefail
          ENTRY=".predictable-code/${GITHUB_REF_NAME}"
          # A CONTINUED BRANCH READS THE ANALYSIS THIS RUN WAS DISPATCHED ON. `predictable` works on
          # the entry of the branch CHECKED OUT, and the spec step may check out a spec's or a fix's
          # branch that has no analysis of its own: it gets a copy of the dispatched branch's, here
          # only — nothing but a sync publishes, and a fix's re-analysis replaces it.
          CODE_BRANCH=$(git symbolic-ref --quiet --short HEAD || true)
          if [ -n "$CODE_BRANCH" ] && [ "$CODE_BRANCH" != "${GITHUB_REF_NAME}" ] && [ -d "$ENTRY" ] \
            && [ ! -e ".predictable-code/${CODE_BRANCH}/.analysis.json" ]; then
            mkdir -p ".predictable-code/${CODE_BRANCH}"
            cp -R "${ENTRY}/." ".predictable-code/${CODE_BRANCH}/"
          fi
          # A REPUBLISH RESTORES THE INFERRED PAGES TOO: the analysis it rebuilds over was made with
          # them, and its publish carries them forward — without them the branch's inferred pages
          # would vanish from the data branch, and their specs from the datasets.
          case "${PC_COMMAND:-sync}" in
            spec-describe|requirement-add|requirement-update|requirement-remove|spec-fill-descriptions) ;;
            republish) [ "${PC_REPUBLISH:-}" = "compile" ] || exit 0 ;;
            *) exit 0 ;;
          esac
          [ -d "${ENTRY}/.specs" ] || exit 0
          SPECS_DIR=$(jq -r '.defaultSpecsDir // "specs"' .predictable-code/project.json 2>/dev/null || echo specs)
          # NUL-separated: a page's name may hold a newline.
          (cd "${ENTRY}/.specs" && find . -type f -print0) | while IFS= read -r -d '' page; do
            page="${page#./}"
            [ -e "${SPECS_DIR}/${page}" ] && continue
            mkdir -p "$(dirname "${SPECS_DIR}/${page}")"
            cp "${ENTRY}/.specs/${page}" "${SPECS_DIR}/${page}"
          done
          PC_RESTORE

          STATE=".predictable-code/${GITHUB_REF_NAME}/.predictable-code"
          FOUND=""
          [ -f "$STATE/schema-hash" ] && FOUND=$(tr -d '[:space:]' < "$STATE/schema-hash")

          # A REPUBLISH (#2257) REBUILDS THE DATASETS OVER THE BRANCH'S ANALYSIS, so it may only use
          # one THIS build wrote: another build's state is not this one's to read back, which is the
          # rule the sync's reuse follows below. Decided BEFORE any page is restored — a republish
          # that analyses restores none, since they would be analysed as if a person had written
          # them — and handed to the Run step, which analyses the branch instead: never a republish
          # over a stale analysis, and none over no analysis at all.
          PC_REPUBLISH=""
          if [ "${PC_COMMAND:-sync}" = "republish" ]; then
            if [ -n "${EXPECTED:-}" ] && [ "$FOUND" = "${EXPECTED}" ] && [ -f "$STATE/viewer-data.json" ]; then
              PC_REPUBLISH=compile
            else
              echo "::notice::the analysis of ${GITHUB_REF_NAME} was not written by this build (found '${FOUND:-none}', expected '${EXPECTED:-unknown}'), so it cannot be republished; this run analyses the branch instead"
              PC_REPUBLISH=analyse
            fi
            echo "PC_REPUBLISH=${PC_REPUBLISH}" >> "${GITHUB_ENV:-/dev/null}"
          fi
          export PC_REPUBLISH
          bash "$RESTORE"

          # AN ANALYSIS ONLY from here — a sync, a review (#2367, which analyses the head itself), or a
          # republish that analyses. A fix reads the analysis that found the finding: clearing it
          # would leave `fix-issue` nothing to resolve the id against.
          case "${PC_COMMAND:-sync}" in
            sync|review) ;;
            republish) [ "$PC_REPUBLISH" = "analyse" ] || exit 0 ;;
            *) exit 0 ;;
          esac
          [ -d "$STATE" ] || { echo "No earlier analysis; this is a first analysis."; exit 0; }

          # Cleared rather than reconciled, and never silently: there is nobody to
          # prompt in CI, so the desktop tool's drift dialogue has no analogue here. An
          # UNKNOWN expected stamp also clears — discarding reuse costs time, and
          # reporting an old build's dataset as current costs trust.
          if [ -n "$EXPECTED" ] && [ "$FOUND" = "$EXPECTED" ]; then
            echo "The earlier analysis was written by this build ($FOUND); keeping it for reuse."
          else
            echo "::notice::Replacing the earlier analysis: found '${FOUND:-none}', expected '${EXPECTED:-unknown}'."
            find "$STATE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

      - name: Resolve an authored spec
        # AUTHORING (#2019) AND THE TWO FIXES (#2240). Resolves, BEFORE the verb edits anything,
        # which spec file an edit is about and whether to continue its branch — and writes the
        # helpers every later step uses to name that branch, so the slug rule exists once. For a fix
        # it names the proposal branch, and continues it for an AGENT fix whose pull request is
        # still open: that is a fix chain's retry, which builds on the attempt before it.
        #
        # ITS OWN STEP BECAUSE IT NEEDS A TOKEN, and the Run step must not have one: Run is also
        # where a fix agent runs with `bypassPermissions`, and a token in its environment is a
        # token the agent can print. This step launches no agent — it runs `specs details` and
        # `gh pr list` — so the job's own token is safe here.
        id: spec
        if: inputs.command == 'spec-new' || inputs.command == 'spec-describe' || inputs.command == 'requirement-add' || inputs.command == 'requirement-update' || inputs.command == 'requirement-remove' || inputs.command == 'spec-generate' || inputs.command == 'spec-fill-descriptions' || inputs.command == 'spec-implement' || inputs.command == 'fix' || inputs.command == 'fix-agent' || inputs.command == 'fix-all-agent'
        env:
          PC_HOME: ${{ steps.toolchain.outputs.predictable_home }}
          PC_COMMAND: ${{ inputs.command }}
          PC_TARGET: ${{ inputs.target }}
          # For `spec-implement` (#2339), the spec's pull request branch: the branch to continue.
          # Through the environment, like every input that arrives from an API call.
          PC_TEXT: ${{ inputs.text }}
          # The fix attempt this run is — a continuation is dispatched with the SAME one (#2306).
          PC_ATTEMPT: ${{ inputs.attempt }}
          # `gh pr list`, so a branch is continued only while its pull request is OPEN — and one
          # write, for `spec-implement` (#2339): the spec's open pull request is turned into a draft
          # while its code is written. Nothing here pushes.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          predictable() { PREDICTABLE_HOME="$PC_HOME" "$PC_HOME/launcher.sh" "$@"; }
          # THE HELPERS, written for the Run and Propose steps to source. Quoted heredoc: nothing
          # in it is expanded here.
          #
          # `spec_in_checkout` makes a path repo-relative through `realpath` — it must EXIST (`-e`
          # is GNU-only, so it is tested with `[ -e ]`) — and refuses one outside the checkout or
          # one holding a CONTROL CHARACTER: the result becomes a `git add` pathspec and a line of
          # `$GITHUB_OUTPUT`, where a newline would forge a second output. `spec_branch_for` is the
          # ONE slug rule: `predictable/specs/<file>`, keyed on the FILE — an id is not unique
          # (#1831), a file is one spec.
          HELPERS="${RUNNER_TEMP}/pc-spec-helpers.sh"
          cat > "$HELPERS" <<'PC_SPEC_HELPERS'
          WS=$(realpath "$GITHUB_WORKSPACE")
          spec_in_checkout() {
            _real=$( [ -n "$1" ] && [ -e "$1" ] && realpath "$1" 2>/dev/null || true)
            case "$_real" in
              *[[:cntrl:]]*) return 1 ;;
              "$WS"/*) printf '%s' "${_real#"$WS"/}" ;;
              *) return 1 ;;
            esac
          }
          spec_branch_for() {
            printf 'predictable/specs/%s' "$(printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-80)"
          }
          # A FIX'S PROPOSAL BRANCH, keyed on the finding id the Control Center sent. SLUGGED,
          # because that id reaches us from an API call and a branch name is not a free-form
          # string: git refuses spaces, `..`, `~`, `^`, `:`, and a leading `-` would be read as an
          # option. Anything outside the safe set becomes `-`, which cannot change WHICH branch is
          # written because the id is also recorded in the commit and the pull request body. The
          # Control Center derives the same name (`hostedFixBranchOf`) to read this branch's
          # analysis, so the two are pinned together by a test. BYTE-WISE (`LC_ALL=C`), which GNU
          # `tr` and `cut` are on the runner anyway — stated so the rule is the same wherever it
          # runs, and so the plane's copy can be exact.
          fix_branch_for() {
            printf 'predictable/propose/%s' "$(printf '%s' "$1" | LC_ALL=C tr -c 'A-Za-z0-9._-' '-' | LC_ALL=C cut -c1-80)"
          }
          PC_SPEC_HELPERS
          # shellcheck disable=SC1090
          . "$HELPERS"

          # AN EDIT CONTINUES ITS SPEC'S BRANCH — ONLY WHILE ITS PULL REQUEST IS OPEN. A runner
          # starts from a clean checkout of the dispatched ref, so a second edit to a spec whose
          # first edit is still in review would otherwise start from the version WITHOUT it and
          # collide on push. So the file is resolved first, and if its branch has an OPEN pull
          # request the edit is made on THAT branch: the commit lands on top, the push
          # fast-forwards, and that pull request updates. A branch whose pull request was CLOSED
          # (a reviewer rejected the edit) or merged is NOT continued — building on it would bring
          # a rejected commit back, or an old base — and the Propose step replaces it instead.
          CONTINUED=no
          # Whether this run continues work an earlier run of the same fix pushed (#2306, #2313).
          FIX_WIP=no
          PRE_SPEC_FILE=""
          # The SPEC the edit is about: the whole target for describe and add, the part before the `/`
          # for an update or a removal, whose target is `SPEC-ID/REQ-ID` (#2342).
          PC_SPEC_ID="${PC_TARGET%%/*}"
          if [ "${PC_COMMAND}" = "spec-describe" ] || [ "${PC_COMMAND}" = "requirement-add" ] \
            || [ "${PC_COMMAND}" = "requirement-update" ] || [ "${PC_COMMAND}" = "requirement-remove" ]; then
            PRE_ABS=$(predictable specs details "${PC_SPEC_ID}" --path "$PWD/.predictable-code" --json 2>/dev/null \
              | jq -r '.[0] // empty' 2>/dev/null || true)
            PRE_SPEC_FILE=$(spec_in_checkout "$PRE_ABS" || true)
            if [ -n "$PRE_SPEC_FILE" ]; then
              PRE_BRANCH=$(spec_branch_for "$PRE_SPEC_FILE")
              OPEN=$(gh pr list --head "$PRE_BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
              if [ -n "$OPEN" ] \
                && git fetch -q origin "refs/heads/${PRE_BRANCH}:refs/remotes/origin/${PRE_BRANCH}" 2>/dev/null; then
                echo "::notice::continuing ${PRE_BRANCH}, where this spec's earlier edit is in review (${OPEN})"
                git checkout -q -f -B "$PRE_BRANCH" "origin/${PRE_BRANCH}"
                CONTINUED=yes
              fi
            fi
          fi
          # AN IMPLEMENTATION CONTINUES ITS SPEC'S BRANCH (#2339), by the same rule as an edit: while
          # the spec's pull request is OPEN, the code goes on top of the spec, so the spec and the code
          # that meets it are ONE pull request. The plane names that BRANCH in `text` — a spec still in
          # review is on no other branch, and its pull request's head is what the plane knows of it —
          # and the branch is used ONLY to find the spec: the spec is then resolved by its id ON the
          # checkout, and must be a file whose branch (`spec_branch_for`) is the one named. A merged or
          # closed spec pull request is not continued; the implementation starts from the dispatched
          # ref, and its spec's branch of that name is replaced.
          #
          # THE OPEN PULL REQUEST BECOMES A DRAFT before the run starts, the one write this step makes:
          # auto-merge would otherwise take the spec alone while its code is still being written. The
          # Propose step marks it ready again only when the gate is met.
          if [ "${PC_COMMAND}" = "spec-implement" ]; then
            case "${PC_TARGET}" in
              ''|-*|*[[:cntrl:]]*) echo "::error::'${PC_TARGET}' is not a spec id"; exit 1 ;;
            esac
            WANT="${PC_TEXT:-}"
            case "$WANT" in
              predictable/specs/*) ;;
              *) WANT="" ;;
            esac
            case "${WANT#predictable/specs/}" in ''|*[!A-Za-z0-9._-]*) WANT="" ;; esac
            if [ -n "$WANT" ]; then
              OPEN=$(gh pr list --head "$WANT" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
              if [ -n "$OPEN" ] \
                && git fetch -q origin "refs/heads/${WANT}:refs/remotes/origin/${WANT}" 2>/dev/null; then
                echo "::notice::implementing on ${WANT}, where this spec is in review (${OPEN})"
                git checkout -q -f -B "$WANT" "origin/${WANT}"
                CONTINUED=yes
                SPEC_PR="$OPEN"
              fi
            fi
            # The spec's file ON THIS CHECKOUT — the spec branch when it was continued, where the
            # spec is still in review.
            PRE_ABS=$(predictable specs details "${PC_TARGET}" --path "$PWD/.predictable-code" --json 2>/dev/null \
              | jq -r '.[0] // empty' 2>/dev/null || true)
            PRE_SPEC_FILE=$(spec_in_checkout "$PRE_ABS" || true)
            [ -n "$PRE_SPEC_FILE" ] || {
              echo "::error::no spec ${PC_TARGET} on ${GITHUB_REF_NAME}${WANT:+ or on ${WANT}}; it cannot be implemented"
              exit 1
            }
            if [ "$CONTINUED" = yes ] && [ "$(spec_branch_for "$PRE_SPEC_FILE")" != "$WANT" ]; then
              echo "::error::${PC_TARGET} on ${WANT} is ${PRE_SPEC_FILE}, whose branch is not ${WANT}; nothing is implemented"
              exit 1
            fi
            # Only once the run is known to proceed, so a refused one leaves the pull request as it was.
            if [ -n "${SPEC_PR:-}" ]; then
              gh pr ready --undo "$SPEC_PR" >/dev/null 2>&1 \
                || echo "::warning::could not turn ${SPEC_PR} into a draft; auto-merge may take the spec before its code"
            fi
          fi
          # THE VERB THAT PROPOSES A SET OF FILES (#2103) continues its own branch: while its pull
          # request is OPEN (a reviewer is looking at it), or while it is THIS LOOP's (#2264) — the
          # runs of one loop write one branch and the last of them opens one pull request.
          #
          # "This loop's" is decided by the LOOP ID the Control Center sends as `target` and every
          # run stamps on its commit (#2279), never by "no pull request has packaged it yet": that
          # rule adopted a branch an ABANDONED loop left the day before, and the next request,
          # asking for one spec, published that loop's 755 as its own. A branch that is neither
          # open for review nor this loop's is REPLACED. An unreadable answer replaces too.
          FILES_BRANCH=""
          case "${PC_COMMAND}" in
            spec-fill-descriptions) FILES_BRANCH="predictable/specs/documentation" ;;
          esac
          LOOP_ID="${PC_TARGET:-}"
          # Only an id's own characters are compared; anything else is no id, and continues nothing.
          if printf '%s' "$LOOP_ID" | grep -c '[^0-9a-f-]' >/dev/null; then LOOP_ID=""; fi
          if [ -n "$FILES_BRANCH" ]; then
            FILES_TIP=$(git ls-remote origin "refs/heads/${FILES_BRANCH}" 2>/dev/null | cut -f1 || true)
            OPEN=$(gh pr list --head "$FILES_BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
            OURS=no
            if [ -n "$FILES_TIP" ] \
              && git fetch -q origin "refs/heads/${FILES_BRANCH}:refs/remotes/origin/${FILES_BRANCH}" 2>/dev/null; then
              if [ -n "$LOOP_ID" ] && git log -1 --format=%B "origin/${FILES_BRANCH}" 2>/dev/null \
                | grep -cxF "Predictable-Describe-Loop: ${LOOP_ID}" >/dev/null; then
                OURS=yes
              fi
              if [ -n "$OPEN" ] || [ "$OURS" = "yes" ]; then
                if [ -n "$OPEN" ]; then
                  echo "::notice::continuing ${FILES_BRANCH}, whose pull request is in review (${OPEN})"
                else
                  echo "::notice::continuing ${FILES_BRANCH}, which earlier runs of this loop wrote"
                fi
                git checkout -q -f -B "$FILES_BRANCH" "origin/${FILES_BRANCH}"
                CONTINUED=yes
              else
                echo "::notice::${FILES_BRANCH} holds work no open pull request and no run of this loop wrote; it is replaced, not continued"
              fi
            fi
          fi
          # `-f` ABOVE, AND THE RESTORE AGAIN HERE. The restore step left untracked copies of the
          # analysis and of the spec pages it inferred, and a continued branch may track one of
          # those very pages — the earlier edit's — so the checkout replaces the copy with the
          # branch's version, and the restore then fills in only what the branch does not carry.
          # A FIX CHAIN'S RETRY CONTINUES ITS BRANCH (#2240), by the same rule as a spec: while the
          # pull request the first attempt opened is OPEN, the next attempt starts from it, so the
          # agent builds on what is already proposed and its commit advances that pull request. A
          # closed or merged one is not continued; the Propose step replaces the branch instead.
          # Only the AGENT fix: the deterministic verb is one mechanical pass and keeps its shape.
          FIX_BRANCH=""
          case "${PC_COMMAND}" in
            fix|fix-agent) FIX_BRANCH=$(fix_branch_for "${PC_TARGET}") ;;
            # FIX ALL DEFECTS (#2313): the batch's own branch, named by the batch id the Control
            # Center sent as `target` — REFUSED unless it is one (`fixAllBatchIdOk`'s rule), so the id
            # is used as it is everywhere after this, never a slug of it.
            fix-all-agent)
              case "${PC_TARGET}" in
                ''|-*|*[!A-Za-z0-9-]*) echo "::error::'${PC_TARGET}' is not a batch id"; exit 1 ;;
              esac
              [ "${#PC_TARGET}" -le 12 ] || { echo "::error::'${PC_TARGET}' is not a batch id"; exit 1; }
              FIX_BRANCH="predictable/fix-all/${PC_TARGET}"
              ;;
          esac
          # A BATCH CONTINUES ITS OWN BRANCH: the commits on it are the ones its gate verified, and
          # its first commit carries `Predictable-Fix-Batch: <id>`. Decided by that stamp, never by
          # "the branch exists" — a branch an abandoned batch left is replaced, not adopted (#2279).
          if [ "${PC_COMMAND}" = "fix-all-agent" ] \
            && git fetch -q origin "refs/heads/${FIX_BRANCH}:refs/remotes/origin/${FIX_BRANCH}" 2>/dev/null \
            && git log --format=%B "origin/${FIX_BRANCH}" 2>/dev/null \
              | grep -cxF "Predictable-Fix-Batch: ${PC_TARGET}" >/dev/null; then
            echo "::notice::continuing ${FIX_BRANCH}, the batch an earlier run of this fix started"
            git checkout -q -f -B "$FIX_BRANCH" "origin/${FIX_BRANCH}"
            CONTINUED=yes
            FIX_WIP=yes
          fi
          if [ "${PC_COMMAND}" = "fix-agent" ]; then
            OPEN=$(gh pr list --head "$FIX_BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
            if [ -n "$OPEN" ] \
              && git fetch -q origin "refs/heads/${FIX_BRANCH}:refs/remotes/origin/${FIX_BRANCH}" 2>/dev/null; then
              echo "::notice::continuing ${FIX_BRANCH}, where the earlier attempt at this fix is in review (${OPEN})"
              git checkout -q -f -B "$FIX_BRANCH" "origin/${FIX_BRANCH}"
              CONTINUED=yes
            fi
          fi
          # A FIX THAT RAN OUT OF TIME CONTINUES ITS OWN WORK (#2306). An earlier run of THIS attempt
          # pushed its work in progress — no pull request — and stamped the commit with the attempt
          # id; a continuation is dispatched with the same id and builds on it. Decided by the id,
          # never by "no pull request is open": that rule adopted an abandoned loop's branch once
          # (#2279). The run then judges against the ORIGINAL starting point (`fix_wip`).
          ATTEMPT_ID="${PC_ATTEMPT:-}"
          if printf '%s' "$ATTEMPT_ID" | grep -c '[^0-9a-f-]' >/dev/null; then ATTEMPT_ID=""; fi
          if [ "${PC_COMMAND}" = "fix-agent" ] && [ "$CONTINUED" = no ] && [ -n "$ATTEMPT_ID" ] \
            && git fetch -q origin "refs/heads/${FIX_BRANCH}:refs/remotes/origin/${FIX_BRANCH}" 2>/dev/null \
            && git log -1 --format=%B "origin/${FIX_BRANCH}" 2>/dev/null \
              | grep -cxF "Predictable-Fix-Attempt: ${ATTEMPT_ID}" >/dev/null; then
            echo "::notice::continuing ${FIX_BRANCH}, the work in progress an earlier run of this fix pushed"
            git checkout -q -f -B "$FIX_BRANCH" "origin/${FIX_BRANCH}"
            CONTINUED=yes
            FIX_WIP=yes
          fi
          if [ "$CONTINUED" = yes ]; then
            bash "${RUNNER_TEMP}/pc-restore.sh"
          fi
          {
            echo "pre_spec_file=${PRE_SPEC_FILE}"
            echo "continued=${CONTINUED}"
            echo "files_branch=${FILES_BRANCH}"
            echo "fix_branch=${FIX_BRANCH}"
            echo "fix_wip=${FIX_WIP}"
          } >> "$GITHUB_OUTPUT"

      # WHAT THE LAST ANALYSIS CAN LEND THIS ONE. A sync reuses a TypeScript file's lowering, a
      # witness module's outcome and an analysis walk's answer while nothing they read changed, each
      # under a key over exactly that, so serving one from an older tree or another branch is never
      # wrong, only a miss. Those
      # stores live in `verification/`, which the database does not carry, so without this every
      # hosted run started cold: umami's front end and its 82 witness modules, every push. This
      # branch's newest first, then the newest of any branch (a new branch starts from its base).
      - name: Restore what the last analysis can reuse
        uses: actions/cache/restore@v5
        with:
          path: |
            .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.ts-frontend-cache
            .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.property-check/run-cache
            .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.analysis-cache
          key: predictable-reuse-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            predictable-reuse-${{ github.ref_name }}-
            predictable-reuse-

      # THE LEAN MIRROR'S BUILD, in an entry of its own named by its CONTENT (the hash of its
      # traces): about a gigabyte on a large Lean project, so kept beside the reuse stores under
      # their per-run key it was written again by every run, and a few branches evicted each other
      # from the repository's cache. Lake's traces are content hashes, so a build from an older tree
      # or another branch is never wrong, only rebuilt where it differs.
      - name: Restore the Lean mirror's build
        id: leanbuild
        uses: actions/cache/restore@v5
        with:
          path: .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.lake/build
          key: predictable-lean-build-${{ github.ref_name }}-
          restore-keys: |
            predictable-lean-build-${{ github.ref_name }}-
            predictable-lean-build-

      - name: Run
        id: analyse
        env:
          PC_HOME: ${{ steps.toolchain.outputs.predictable_home }}
          CONTROL_PLANE: ${{ inputs.control_plane }}
          PC_COMMAND: ${{ inputs.command }}
          # What the restore step decided a republish is (#2257): `compile` over an analysis this
          # build wrote, else the whole analysis. Written to `$GITHUB_ENV` there, named here.
          PC_REPUBLISH: ${{ env.PC_REPUBLISH }}
          # When the job started (#2264), noted by its first step: a description run's time bound
          # is derived from it.
          PC_JOB_STARTED: ${{ env.PC_JOB_STARTED }}
          # Through the ENVIRONMENT, never interpolated into the script. A
          # `${{ inputs.target }}` spliced into shell is an injection site, and this
          # input reaches us from an API call. The PROMPT is free-form prose and is the
          # most important of the three to keep out of the script text.
          PC_TARGET: ${{ inputs.target }}
          PC_PROMPT: ${{ inputs.prompt }}
          # The authoring verbs' free text (#2019) — a name, a description or a requirement
          # sentence. Through the environment for the same reason as the prompt.
          PC_TEXT: ${{ inputs.text }}
          # The spec file the "Resolve an authored spec" step resolved for an edit (#2019).
          PC_PRE_SPEC_FILE: ${{ steps.spec.outputs.pre_spec_file }}
          # The finding an agent fix is about, as the Control Center keys it (#2306), and whether
          # this run continues work an earlier run of the same attempt pushed.
          PC_FINDING: ${{ inputs.finding }}
          PC_FIX_WIP: ${{ steps.spec.outputs.fix_wip }}
          # Where the plugin was unpacked. Set for every verb and used by one: the CLI
          # reads it instead of cloning, and an empty value simply means the CLI's own
          # default applies, which is right for the verbs that never launch an agent.
          PREDICTABLE_CLAUDE_PLUGIN_DIR: ${{ steps.toolchain.outputs.plugin_dir }}
          # What makes the plugin's `bin/predictable` wrapper resolve — see the symlink in the
          # toolchain step. Without it every hook in a dispatched agent fix exits 127 and the
          # agent runs blind, in a job that still reports success.
          PLUGIN_DATA: ${{ steps.toolchain.outputs.plugin_data }}
          # The same closed pair as the preflight above, and it must STAY the same pair:
          # a preflight that accepts a key the run step cannot see passes a check and then
          # spawns an agent with an empty key, which is the failure this file already
          # records having shipped once.
          #
          # ONLY TO THE VERBS THAT RUN A MODEL (#2103) — exactly the verbs the preflight above
          # checks the key for, and never an analysis or a spec a person writes, which spawn no
          # engine. The CLI not using a key is a property of one binary; an empty variable is a
          # property of this file anyone can read, and the header above says the same thing.
          # `a && b || ''` is the expression language's conditional; with no secret set, `b` is
          # empty and the result is '' either way.
          #
          # AND THE PULL REQUEST REVIEW (#2367), which is the one verb handed the key without being
          # refused for its absence: the analysis alone decides its check, and the key only lets it
          # explain what it found and stack a verified fix (`readsModelKey` in the Control Center).
          ANTHROPIC_API_KEY: ${{ contains(fromJSON('["fix","fix-agent","fix-all-agent","spec-generate","spec-fill-descriptions","spec-implement","plugins-discover","review"]'), inputs.command) && (secrets.ANTHROPIC_API_KEY || secrets.ORG_ANTHROPIC_KEY) || '' }}
          # Empty is NOT the same as unset for this knob: the product reads the variable
          # and an empty string is not a number, so it falls back to measured headroom —
          # which is what an empty input should mean.
          PREDICTABLE_TS_FRONTEND_HEAP_MB: ${{ inputs.heap_mb }}
          # WHO STARTED IT AND FROM WHERE, for the `.analysis.json` the sync commits to the database
          # itself (`predictable` publishes at the end of every sync). Empty for a run nobody
          # started — the analysis a push dispatches — which the record calls `automatic`.
          PREDICTABLE_ANALYSIS_STARTED_BY: ${{ inputs.started_by }}
          PREDICTABLE_ANALYSIS_ORIGIN: ${{ inputs.started_by != '' && 'control-center' || 'automatic' }}
          PREDICTABLE_ANALYSIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # THE LAUNCHER, never the binary directly. `launcher.sh` is what puts the
          # provisioned toolchain on PATH — running the raw binary is how a `lake` or a
          # `lean` spawn resolves to whatever the runner had, or to nothing.
          predictable() { PREDICTABLE_HOME="$PC_HOME" "$PC_HOME/launcher.sh" "$@"; }
          # SYNC ONLY, for the same reason the clearing step is: a fix runs against the
          # configuration that produced the finding, and re-detecting source paths
          # underneath it would change what the analysis was about.
          if [ "${PC_COMMAND}" = "sync" ] && [ ! -f .predictable-code/project.json ]; then
            # Headless configuration: scans the tree and populates source paths and
            # extensions itself, because there is no one here to answer prompts.
            predictable init "${GITHUB_REPOSITORY##*/}" \
              --path "$PWD/.predictable-code" --accept-config-suggestions
          fi

          # ──────────────────────────────────────────────────────────────────────────
          # REPORTING PROGRESS WHILE IT HAPPENS, not after.
          #
          # `predictable sync --json` emits the same `{"event":"phase",…}` stream a local
          # sync does, and the Control Center renders a progress bar, a phase list and a
          # live feed from exactly those lines. The control plane USED to scrape them
          # back out of the Actions log, which cannot work: that log is an Azure blob
          # that answers `404 BlobNotFound` until the job COMPLETES — measured against a
          # live run 36 minutes into this step. So the reader watched a spinner for an
          # hour and got the whole feed at the end.
          #
          # This pushes instead. The batch is whatever is new since the last push, sent
          # as text to `/api/cloud/progress` and authenticated by this job's own OIDC
          # token, so the control plane knows which run it is from a SIGNED claim rather
          # than from anything this script could assert about itself.
          #
          # EVERY PUSH IS BEST-EFFORT AND CANNOT FAIL THE ANALYSIS (`push_progress || :` at
          # both call sites, and a bounded `-m`). The work is happening either way; a status
          # bar is not a reason to fail a run that is analysing the repository perfectly well.
          # ──────────────────────────────────────────────────────────────────────────
          PROGRESS_SENT=0
          AGENT_SENT=0
          PUSH_SENT=0
          # Whether the control plane has ever said it is following this run, and how many
          # POLLS in a row it said it is not (one poll pushes both streams, so a per-answer
          # count ran out twice as fast on an agent verb). See "DELIVERED MEANS FOLLOWED"
          # in `push_stream` and "A RUN NOBODY FOLLOWS" in `push_progress`.
          PUSH_FOLLOWED=0
          PUSH_UNFOLLOWED=0
          PUSH_REFUSED=0
          PUSH_POLL=0
          # THE CADENCE AND THE PATIENCE, named together because one is measured in the other:
          # a poll every PUSH_POLL_SECONDS (the wait loop below sleeps this), full rate for
          # PUSH_PATIENCE_POLLS polls (about a minute), then one poll in PUSH_BACKOFF_POLLS
          # (about every thirty seconds).
          PUSH_POLL_SECONDS=3
          PUSH_PATIENCE_POLLS=20
          PUSH_BACKOFF_POLLS=10
          OIDC_MINTED=0
          PC_OIDC=""
          # OUTSIDE THE CHECKOUT, for the reason the runtime package is: anything we
          # write into the tree is part of the tree as far as git is concerned. Measured
          # on this exact path — the run's ndjson was written into the working
          # directory, and the fix step's `git add -A` (which must stage SOURCE, so it
          # cannot be scoped the way the analysis step's `git add -Af .predictable-code`
          # is) committed our own scratch file into the customer's pull request.
          # TWO STREAMS, BECAUSE THE PRODUCT USES TWO, and getting this wrong is why
          # the first hosted run reported no progress at all.
          #
          # `ProgressEvent.emit` writes its NDJSON to **stderr** — "stdout stays
          # reserved for a verb's result envelope", and the desktop app's own
          # `JobRunner.consume` parses stderr line by line. This captured stdout, so the
          # push loop below watched a file that stays empty until the verb finishes and
          # writes its envelope: every phase went to the Actions log instead, which is
          # exactly the scrape-at-the-end behaviour the push exists to replace.
          RUN_JSON="${RUNNER_TEMP}/predictable-progress.ndjson"
          RESULT_JSON="${RUNNER_TEMP}/predictable-result.json"
          # A THIRD FILE, FOR THE ONE VERB WHOSE STDOUT IS PROGRESS RATHER THAN A RESULT.
          # `predictable claude --stream-json` inherits stdio and Claude writes one JSON
          # message per turn to stdout, so for `fix-agent` that stream is the live account
          # of what the agent is doing — and it is what the app renders locally. It cannot
          # share `$RESULT_JSON`: nothing pushes that file, which is exactly how a hosted
          # fix came to show a run that did nothing and then ended.
          AGENT_JSON="${RUNNER_TEMP}/predictable-agent.ndjson"

          mint_oidc() {
            # RE-MINTED ON A CLOCK, because an Actions ID token is short-lived and a sync
            # is not: a token taken once at the top of this step is expired long before a
            # large repository finishes, and every push after that would be refused.
            now=$(date +%s)
            if [ -n "$PC_OIDC" ] && [ $((now - OIDC_MINTED)) -lt 240 ]; then return 0; fi
            PC_OIDC=$(curl -sS -m 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CONTROL_PLANE}" \
              | jq -r '.value // empty') || PC_OIDC=""
            OIDC_MINTED=$now
          }

          # PUSH ONE FILE, SAYING WHICH STREAM IT IS, and echo the new sent-count.
          #
          # WHY THE STREAM TRAVELS WITH THE BYTES. The control plane feeds every pushed
          # line into the same `consume` a local run uses, and `consume` reads the two
          # streams differently ON PURPOSE: phases are parsed from STDERR (the product
          # emits its NDJSON there) and the AGENT's own stream-json — tool calls, denied
          # tools, the terminal result — is parsed from STDOUT. So a channel that
          # flattened everything to one stream could carry an analysis or an agent fix,
          # never both.
          #
          # MEASURED, which is why this changed: an agent fix pushed only stderr, so the
          # agent's work never left the runner and the app showed a run that did nothing
          # for the few seconds before it ended. Locally the same fix shows every tool
          # call, because the local pump feeds stdout to the same parser.
          #
          # IT ANSWERS IN A GLOBAL (`PUSH_SENT`) RATHER THAN ON STDOUT, so that no caller
          # needs a command substitution. MEASURED, in the test harness that caught it:
          # `$(push_stream …)` is a SUBSHELL, so `mint_oidc`'s assignments to `PC_OIDC`
          # and `OIDC_MINTED` die with it — the four-minute token cache becomes dead code
          # and a forty-minute sync mints a fresh ID token every three seconds. Answering
          # in a variable keeps every call in this shell, which is also why the
          # diagnostics below can stay on stdout, where the job log is.
          push_stream() {
            _file=$1; _stream=$2; _sent=$3
            PUSH_SENT=$_sent
            [ -f "$_file" ] || return 0
            total=$(wc -l < "$_file" | tr -d ' ')
            [ "$total" -gt "$_sent" ] || return 0
            mint_oidc
            [ -n "$PC_OIDC" ] || return 0
            # The token is a credential, so it goes in a header from a variable and never
            # onto a command line that `ps` or a shell trace could read.
            #
            # `sed` READS THE FILE ITSELF, never `tail | head`. The product is still writing
            # this file, so it grows between the count above and this read; `head` then
            # stopped after the counted lines while `tail` still held more, `tail` failed on
            # the broken pipe (the runner ignores SIGPIPE, so that is an exit 1, not a quiet
            # death), and `pipefail` with `errexit` ended an analysis that was going
            # perfectly well (run 37652090245). Stopping at line `total` also never sends a
            # line the product is halfway through writing.
            sed -n "$((_sent + 1)),${total}p;${total}q" "$_file" > "${RUNNER_TEMP}/pc-batch.ndjson"
            # A BACKLOG THE CONTROL PLANE WOULD REFUSE IS TRIMMED HERE, AND SAID OUT LOUD.
            # Its ingest bounds a body at 1 MB and answers 413. A batch that big can only
            # arrive after several failed pushes, and re-sending it forever would mean the
            # feed never resumes — so the oldest lines are dropped, which is a LOSS and is
            # therefore announced. The whole output is still in this job's log either way.
            # `tail -c` can cut mid-line, so the partial first line goes with it.
            bytes=$(wc -c < "${RUNNER_TEMP}/pc-batch.ndjson" | tr -d ' ')
            if [ "$bytes" -gt 900000 ]; then
              echo "::warning::the progress backlog reached ${bytes} bytes, more than the app accepts in one push; its oldest lines are being dropped from the live feed — this job's log still holds all of them"
              tail -c 900000 "${RUNNER_TEMP}/pc-batch.ndjson" | tail -n +2 \
                > "${RUNNER_TEMP}/pc-batch-trimmed.ndjson"
              mv "${RUNNER_TEMP}/pc-batch-trimmed.ndjson" "${RUNNER_TEMP}/pc-batch.ndjson"
            fi
            # ADVANCED ONLY ON SUCCESS. It used to advance unconditionally, so one refused
            # or dropped push lost those lines from the app for good — while the file that
            # still held them sat right there, and the next poll would have re-sent them
            # for nothing. A failure now simply leaves them pending, and the batch that
            # grows out of repeated failures is bounded by the trim above.
            #
            # DELIVERED MEANS FOLLOWED, not "curl exited 0". `curl` without `--fail` exits 0
            # on any HTTP answer, and the ingest answers `202 {"following":false}` — having
            # kept nothing — when it cannot tell which run the lines belong to: before the
            # run is resolvable, or on an instance that never adopted it. Advancing on that
            # answer lost the run's FIRST lines for good, which is why the feed showed every
            # phase but translation. So the cursor moves only on `"following":true`.
            #
            : > "${RUNNER_TEMP}/pc-push-answer.json"
            if curl -sS -m 30 -o "${RUNNER_TEMP}/pc-push-answer.json" \
              -H "Authorization: Bearer ${PC_OIDC}" \
              -H 'content-type: text/plain' \
              --data-binary "@${RUNNER_TEMP}/pc-batch.ndjson" \
              "${CONTROL_PLANE}/api/cloud/progress?stream=${_stream}"; then
              if jq -e '.following == true' "${RUNNER_TEMP}/pc-push-answer.json" > /dev/null 2>&1; then
                PUSH_SENT=$total
                PUSH_FOLLOWED=1
              elif jq -e '.following == false' "${RUNNER_TEMP}/pc-push-answer.json" > /dev/null 2>&1; then
                PUSH_REFUSED=1
              fi
            fi
            rm -f "${RUNNER_TEMP}/pc-batch.ndjson" "${RUNNER_TEMP}/pc-push-answer.json"
          }

          # BOTH STREAMS, each as itself. `AGENT_JSON` is written by the agent verb alone;
          # for every other one the second call finds an empty file and does nothing.
          #
          # A RUN NOBODY FOLLOWS IS RE-SENT LESS OFTEN, NEVER ABANDONED. Started from GitHub's
          # own UI it has no job to feed, and holding the cursor would re-send a growing
          # backlog every few seconds for the length of the run; but a run the plane has not
          # bound YET (GitHub slow to list it, no webhook) is followed late, and giving up
          # would lose every line after that. So past PUSH_PATIENCE_POLLS polls refused with
          # no acceptance ever, only one poll in PUSH_BACKOFF_POLLS pushes, said once; the
          # trim bounds what accumulates, and the first `following:true` restores full rate.
          # `final` is the tail after the process exits, which always pushes: those lines
          # name the outcome.
          push_progress() {
            PUSH_POLL=$((PUSH_POLL + 1))
            if [ "${1:-}" != final ] && [ "$PUSH_FOLLOWED" = 0 ] \
              && [ "$PUSH_UNFOLLOWED" -ge "$PUSH_PATIENCE_POLLS" ] \
              && [ $((PUSH_POLL % PUSH_BACKOFF_POLLS)) -ne 0 ]; then
              return 0
            fi
            PUSH_REFUSED=0
            push_stream "$RUN_JSON" stderr "$PROGRESS_SENT"
            PROGRESS_SENT=$PUSH_SENT
            push_stream "$AGENT_JSON" stdout "$AGENT_SENT"
            AGENT_SENT=$PUSH_SENT
            if [ "$PUSH_FOLLOWED" = 1 ]; then
              PUSH_UNFOLLOWED=0
            elif [ "$PUSH_REFUSED" = 1 ]; then
              PUSH_UNFOLLOWED=$((PUSH_UNFOLLOWED + 1))
              if [ "$PUSH_UNFOLLOWED" -eq "$PUSH_PATIENCE_POLLS" ]; then
                echo "::notice::the Control Center is not following this run yet, so its progress is now pushed every $((PUSH_POLL_SECONDS * PUSH_BACKOFF_POLLS)) seconds; this job's log holds all of it"
              fi
            fi
          }

          : > "$RUN_JSON"
          : > "$RESULT_JSON"
          : > "$AGENT_JSON"
          # ONE SPAWN, CHOSEN HERE. Both verbs emit the same `{"event":…}` stream on
          # stdout and both are followed by the same pump below, so the difference
          # between them is an argv and nothing else.
          # AUTHORING (#2019): one of the three verbs that edit a spec. Named once, because
          # four later branches ask the same question.
          PC_AUTHORING=no
          case "${PC_COMMAND}" in
            spec-new|spec-describe|requirement-add|requirement-update|requirement-remove|spec-generate) PC_AUTHORING=yes ;;
          esac
          # A SET OF FILES (#2103): the description run, whose propose step stages exactly the files
          # the command reports.
          PC_FILES=no
          case "${PC_COMMAND}" in
            spec-fill-descriptions) PC_FILES=yes ;;
          esac
          if [ "${PC_COMMAND}" != "sync" ]; then
            if [ "${PC_AUTHORING}" = "yes" ]; then
              # WHAT A PERSON WROTE IS REQUIRED, and so is the spec it is about — except
              # for a new spec, which has no id yet. A GENERATION's text is its NAME, which may be
              # empty (#2307): the person described the feature (`prompt`, checked below) and the
              # model names it.
              # A REMOVAL says nothing but which requirement (#2342), so it alone needs no text.
              if [ "${PC_COMMAND}" != "spec-generate" ] && [ "${PC_COMMAND}" != "requirement-remove" ]; then
                [ -n "${PC_TEXT}" ] || {
                  echo "::error::${PC_COMMAND} needs text"
                  exit 1
                }
              fi
              # AN UPDATE OR A REMOVAL names one requirement as `SPEC-ID/REQ-ID`, and both halves
              # reach the verb as POSITIONALS, so EACH HALF is held to the spec id's rule here. The
              # whole-target check below cannot stand in for the spec half: `/R1` does not start
              # with `-` and is not empty, yet its spec half is, and the verb would be handed `""`.
              if [ "${PC_COMMAND}" = "requirement-update" ] || [ "${PC_COMMAND}" = "requirement-remove" ]; then
                case "${PC_TARGET}" in */*) ;; *) echo "::error::${PC_COMMAND} needs SPEC-ID/REQ-ID"; exit 1 ;; esac
                case "${PC_TARGET%%/*}" in ""|-*|*[[:cntrl:]]*) echo "::error::invalid spec id"; exit 1 ;; esac
                case "${PC_TARGET#*/}" in ""|-*|*/*|*[[:cntrl:]]*) echo "::error::invalid requirement id"; exit 1 ;; esac
              fi
              if [ "${PC_COMMAND}" != "spec-new" ] && [ "${PC_COMMAND}" != "spec-generate" ]; then
                [ -n "${PC_TARGET}" ] || {
                  echo "::error::${PC_COMMAND} needs a target spec"
                  exit 1
                }
              fi
              # BOTH ARE POSITIONAL OR FLAG VALUES, and a leading `-` is read by the CLI as
              # an option wherever it lands (`--path=…` would redirect the write). The
              # Control Center refuses these before dispatching; this refuses them again,
              # because the workflow can be dispatched by anything holding the App's token.
              case "${PC_TARGET}" in -*|*[[:cntrl:]]*) echo "::error::invalid spec id"; exit 1 ;; esac
              case "${PC_TEXT}" in -*) echo "::error::text cannot start with '-'"; exit 1 ;; esac
              # A NEW SPEC'S NAME becomes its title, its commit subject and a line of
              # `$GITHUB_OUTPUT`, so it may hold no control character: a newline there would
              # forge a second output (`spec_branch=main`). A description or a requirement
              # sentence may be multi-line; it reaches only the verb and the commit body.
              if [ "${PC_COMMAND}" = "spec-new" ] || [ "${PC_COMMAND}" = "spec-generate" ]; then
                case "${PC_TEXT}" in *[[:cntrl:]]*) echo "::error::a spec name cannot contain control characters"; exit 1 ;; esac
              fi
              # A GENERATION IS SEEDED BY WHAT THE PERSON WROTE (#2055): without it the model has a
              # name alone to invent a feature from. It is a FLAG VALUE (`--context`), so a leading
              # `-` is refused for the same reason as the text's.
              if [ "${PC_COMMAND}" = "spec-generate" ]; then
                [ -n "${PC_PROMPT}" ] || {
                  echo "::error::spec-generate needs a description (the prompt input)"
                  exit 1
                }
                case "${PC_PROMPT}" in -*) echo "::error::the description cannot start with '-'"; exit 1 ;; esac
              fi
            elif [ "${PC_FILES}" = "yes" ]; then
              [ -n "${PC_TEXT}" ] || {
                echo "::error::${PC_COMMAND} needs text"
                exit 1
              }
              # `all`, or spec files one per line — each a FLAG VALUE's line, so a leading `-`
              # or a control character inside a line is refused, as for every authored value.
              if [ "${PC_TEXT}" != "all" ]; then
                printf '%s\n' "${PC_TEXT}" > "${RUNNER_TEMP}/pc-selection.txt"
                while IFS= read -r _line; do
                  case "$_line" in -*|*[[:cntrl:]]*) echo "::error::invalid spec file in the selection"; exit 1 ;; esac
                done < "${RUNNER_TEMP}/pc-selection.txt"
              fi
            elif [ "${PC_COMMAND}" = "spec-implement" ]; then
              [ -n "${PC_TARGET}" ] || {
                echo "::error::spec-implement needs a target spec"
                exit 1
              }
            elif [ "${PC_COMMAND}" = "plugins-discover" ]; then
              # A DISCOVERY NAMES NOTHING (#2355); its focus is a FLAG VALUE, so a leading `-` or a
              # control character is refused, as for every authored value.
              case "${PC_TEXT}" in -*|*[[:cntrl:]]*) echo "::error::invalid focus"; exit 1 ;; esac
            elif [ "${PC_COMMAND}" = "republish" ]; then
              # A REPUBLISH (#2257) NAMES NOTHING: it rebuilds the branch's whole analysis, so it is
              # dispatched with no target. It still needs that analysis — the check below, which
              # it does not skip.
              :
            elif [ "${PC_COMMAND}" = "review" ]; then
              # A REVIEW (#2367) names its pull request by NUMBER and its base by COMMIT, both from an
              # API call: each is held to its own alphabet before it reaches a branch name, a flag or
              # `git`, so neither can be read as an option or a second line of `$GITHUB_OUTPUT`.
              case "${PC_TARGET}" in ''|0*|*[!0-9]*) echo "::error::review needs the pull request's number"; exit 1 ;; esac
              case "${PC_TEXT}" in *[!0-9a-f]*) echo "::error::review needs the pull request's base commit"; exit 1 ;; esac
              [ "${#PC_TEXT}" -eq 40 ] || { echo "::error::review needs the pull request's base commit"; exit 1; }
            else
              [ -n "${PC_TARGET}" ] || {
                echo "::error::${PC_COMMAND} needs a target finding"
                exit 1
              }
            fi
            [ -f .predictable-code/project.json ] || {
              # NAMED, because the remedy is a different button. A branch with no analysis —
              # no configuration on `predictable-code-database` —
              # has nothing to fix, and "no such finding" would send the reader looking for a
              # typo in an id that was never the problem.
              echo "::error::this branch has no analysis yet; run an analysis of it first"
              exit 1
            }
          fi
          # AN AUTHORED SPEC'S HELPERS (#2019) — `spec_in_checkout`, `spec_branch_for` and `WS` —
          # written ONCE by the "Resolve an authored spec" step, so the slug rule exists in one
          # place for every step that names the branch. `PRE_SPEC_FILE` is the file that step
          # resolved for an edit (empty for a new spec).
          PRE_SPEC_FILE="${PC_PRE_SPEC_FILE:-}"
          if [ "${PC_AUTHORING}" = "yes" ] || [ "${PC_FILES}" = "yes" ] || [ "${PC_COMMAND}" = "spec-implement" ]; then
            # shellcheck disable=SC1091
            . "${RUNNER_TEMP}/pc-spec-helpers.sh"
          fi

          if [ "${PC_COMMAND}" = "fix-agent" ]; then
            [ -n "${PC_PROMPT}" ] || {
              # The prompt is BUILT BY THE CONTROL PLANE from the finding's own fields,
              # so an empty one means the dispatch was malformed, not that the agent has
              # nothing to do — and running an agent with an empty prompt in a
              # `bypassPermissions` session is the last thing to do about it.
              echo "::error::command=fix-agent needs a prompt"
              exit 1
            }
            # `--pinned` IS REQUIRED HERE, and its absence is why the first hosted agent
            # fix that got past the segfault still ran nothing:
            #
            #     could not execute external process 'claude'
            #     claude exited with code 255
            #
            # `predictable claude` defaults to the USER's own Claude Code — their version,
            # auth, MCP — and `resolveUserClaude` DELIBERATELY skips the copy bundled beside
            # the running binary, so a developer's launcher never silently runs ours under
            # the name of theirs. That is right at a terminal and wrong on a runner, where
            # there is no user install at all: the lookup falls through to a bare `claude`
            # that PATH cannot resolve, because the package's own `bin` is deliberately not
            # on PATH either.
            #
            # On this machine the pinned copy is the ONLY Claude, and it is the build this
            # release is tested against. It is NO LONGER IN THE TARBALL — #1868 stopped
            # redistributing the agent CLIs, because nothing in Claude Code's terms grants us
            # the right — so it arrives the way every other pinned tool now does: the
            # `Provision the pinned toolchain` step above installs `aqua:anthropics/claude-code`
            # for every verb that starts an agent, and `links()` puts it at
            # `bin/claude` beside `bin/predictable`. That is precisely where `--pinned` looks,
            # so the flag still selects it and still errors plainly if it is absent rather than
            # falling back to a different agent than we asked for.
            #
            # `--stream-json` so the agent's own work arrives as ndjson, one message per
            # turn and per tool call, and is pushed by the same pump below.
            #
            # STDOUT GOES TO `$AGENT_JSON`, WHICH IS PUSHED. This verb is the exception to
            # "stdout is the result envelope": `predictable claude` spawns the CLI with
            # stdio INHERITED, so what lands on this process's stdout is Claude's own
            # stream — and the app's `consume` parses exactly that, from stdout, to show
            # tool calls while a fix is still running. Sending it to `$RESULT_JSON`, which
            # no pump reads, is why the hosted fix showed nothing; the envelope is not
            # read for a fix anyway (the verdict comes from the TREE, below).
            #
            # `PREDICTABLE_REPORTED_RUN=1`: the agent syncs to check its own work over a tree whose
            # fix is not committed, and such a sync still commits an analysis to the database on the
            # branch checked out — the BASE branch on a first attempt. The publish below would then
            # push it, and the base would read as fixed before anything merged. Only what the
            # propose step verified is published. A current CLI sets this itself for every headless
            # agent; it is set here too so an older one cannot publish. Exported on its own line
            # so the agent's spawn still begins its line, where the key-pair check looks for it.
            export PREDICTABLE_REPORTED_RUN=1
            # THE DRIVER, NOT A BARE AGENT (#2306): `predictable fix` records where the fix starts,
            # runs the agent (through `predictable claude`, so `--pinned` keeps its meaning) and
            # after every turn runs `fix-check` itself, sending the agent back until the finding is
            # gone and the project's findings went down. No round cap; it stops when provably stuck.
            #
            # BOUNDED BY THE JOB'S CLOCK, the budget the description loop takes (#2264): it starts
            # no round that would end within FIFTEEN MINUTES of `timeout-minutes`, which leaves the
            # verification and the push, and ends `continue` instead — the Propose step pushes the
            # work in progress and the Control Center dispatches this same attempt again.
            [ -n "${PC_FINDING:-}" ] || {
              echo "::error::command=fix-agent needs the finding's key"
              exit 1
            }
            KEEP_START=""
            # THE COMMIT THIS ATTEMPT STARTED FROM, carried by every continuation's stamp: the
            # default branch may have moved since, and a start recorded on a newer commit would
            # credit the fix with whatever changed between the two.
            FIX_BASE="$GITHUB_SHA"
            if [ "${PC_FIX_WIP:-no}" = "yes" ]; then
              # `tail`, which reads all of its input: a reader that stops early kills the writer
              # under `pipefail`.
              STAMPED=$(git log -1 --format=%B HEAD | sed -n 's/^Predictable-Fix-Base: \([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)
              [ -n "$STAMPED" ] && git cat-file -e "${STAMPED}^{commit}" 2>/dev/null && FIX_BASE="$STAMPED"
              # A CONTINUATION judges against the ORIGINAL code, not its own work in progress: the
              # starting point is recorded on the attempt's base commit, then the work is put back.
              WIP_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              git checkout -q --detach "$FIX_BASE"
              predictable fix-check --key "${PC_FINDING}" --start --json \
                --path "$PWD/.predictable-code" > "${RUNNER_TEMP}/pc-fix-start.json" 2>> "$RUN_JSON" || true
              git checkout -q "$WIP_BRANCH"
              KEEP_START="--keep-start"
            fi
            echo "PC_FIX_BASE=${FIX_BASE}" >> "$GITHUB_ENV"
            # THE BUDGET IS READ NOW, after the continuation's own starting check — a full sync —
            # so that sync is charged to it, not to the fifteen minutes kept for verify and push.
            PC_JOB_SECONDS=3600
            PC_NOW=$(date +%s)
            PC_STARTED="${PC_JOB_STARTED:-$PC_NOW}"
            FIX_DEADLINE=$(( PC_STARTED + PC_JOB_SECONDS - 900 - PC_NOW ))
            [ "$FIX_DEADLINE" -gt 300 ] || FIX_DEADLINE=300
            # shellcheck disable=SC2086
            predictable fix \
              --key "${PC_FINDING}" \
              --prompt "${PC_PROMPT}" \
              --pinned \
              --permission-mode bypassPermissions \
              --deadline-seconds "$FIX_DEADLINE" $KEEP_START \
              --path "$PWD/.predictable-code" > "$AGENT_JSON" 2> "$RUN_JSON" &
          # FIX ALL DEFECTS (#2313): every defect in ONE session, from the batch the Control Center
          # wrote to `predictable-code-database` — a whole project's prompt does not fit in the
          # 65,535 characters GitHub allows a dispatch's inputs, so only the batch's id travels —
          # and the driver reads it as a FILE, because Linux caps one argument at 131,072 bytes.
          # The driver commits each round the gate verified onto the batch branch; this step never
          # holds a token, so the Propose step is what pushes them.
          elif [ "${PC_COMMAND}" = "fix-all-agent" ]; then
            export PREDICTABLE_REPORTED_RUN=1
            case "${PC_TARGET}" in
              ''|-*|*[!A-Za-z0-9-]*) echo "::error::'${PC_TARGET}' is not a batch id"; exit 1 ;;
            esac
            [ "${#PC_TARGET}" -le 12 ] || { echo "::error::'${PC_TARGET}' is not a batch id"; exit 1; }
            BATCH_FILE=".predictable-code/.fix-all/${PC_TARGET}.json"
            [ -f "$BATCH_FILE" ] || {
              echo "::error::no batch ${PC_TARGET} on predictable-code-database (.fix-all/${PC_TARGET}.json)"
              exit 1
            }
            BATCH_BRANCH="predictable/fix-all/${PC_TARGET}"
            KEEP_START=""
            FIX_BASE="$GITHUB_SHA"
            if [ "${PC_FIX_WIP:-no}" = "yes" ]; then
              # A CONTINUATION judges every defect against the batch's ORIGINAL code, stamped on its
              # first commit; the starting point is recorded there, then the work is put back.
              STAMPED=$(git log --format=%B HEAD | sed -n 's/^Predictable-Fix-Base: \([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)
              [ -n "$STAMPED" ] && git cat-file -e "${STAMPED}^{commit}" 2>/dev/null && FIX_BASE="$STAMPED"
              git checkout -q --detach "$FIX_BASE"
              jq -r '.findings[] | "\(.fqn)|\(.vc // .category)"' "$BATCH_FILE" | while IFS= read -r KEY; do
                predictable fix-check --key "$KEY" --start --json \
                  --path "$PWD/.predictable-code" > /dev/null 2>> "$RUN_JSON" || true
              done
              git checkout -q "$BATCH_BRANCH"
              KEEP_START="--keep-start"
            else
              git checkout -q -B "$BATCH_BRANCH"
              git commit -q --allow-empty -m "Predictable Code: fixing every defect" \
                -m "Predictable-Fix-Batch: ${PC_TARGET}" \
                -m "Predictable-Fix-Base: ${GITHUB_SHA}"
            fi
            echo "PC_FIX_BASE=${FIX_BASE}" >> "$GITHUB_ENV"
            # THE BUDGET, read after the continuation's starting checks, as for a single fix.
            PC_JOB_SECONDS=3600
            PC_NOW=$(date +%s)
            PC_STARTED="${PC_JOB_STARTED:-$PC_NOW}"
            FIX_DEADLINE=$(( PC_STARTED + PC_JOB_SECONDS - 900 - PC_NOW ))
            [ "$FIX_DEADLINE" -gt 300 ] || FIX_DEADLINE=300
            # shellcheck disable=SC2086
            predictable fix \
              --together \
              --commit-verified \
              --batch-file "$BATCH_FILE" \
              --pinned \
              --permission-mode bypassPermissions \
              --deadline-seconds "$FIX_DEADLINE" $KEEP_START \
              --path "$PWD/.predictable-code" > "$AGENT_JSON" 2> "$RUN_JSON" &
          # IMPLEMENTING A SPEC (#2339): `predictable implement` records where the work starts
          # (`spec-check --start`: the spec's requirements as agreed, and the project's findings),
          # runs the agent through `predictable claude` (so `--pinned` keeps its meaning, as for a
          # fix) and after every turn runs `spec-check` itself, sending the agent back until every
          # requirement of the spec is verified and no finding was added — or it is provably stuck,
          # or out of rounds or time. ONE JOB: the run's cap is an hour (#2339's decision), which a
          # continuation across jobs would exceed, so the driver's clock is this job's, less the
          # fifteen minutes the propose step keeps, exactly as for a fix.
          #
          # On the spec's branch when its pull request is open (the resolve step checked it out), so
          # the code lands beside the spec it meets.
          elif [ "${PC_COMMAND}" = "spec-implement" ]; then
            export PREDICTABLE_REPORTED_RUN=1
            [ -n "${PRE_SPEC_FILE}" ] || {
              echo "::error::spec-implement resolved no spec file"
              exit 1
            }
            {
              echo "spec_file=${PRE_SPEC_FILE}"
              echo "spec_branch=$(spec_branch_for "$PRE_SPEC_FILE")"
              echo "spec_id=$(printf '%s' "$PC_TARGET" | tr -d '\r\n')"
            } >> "$GITHUB_OUTPUT"
            PC_JOB_SECONDS=3600
            PC_NOW=$(date +%s)
            PC_STARTED="${PC_JOB_STARTED:-$PC_NOW}"
            IMPLEMENT_SECONDS=$(( PC_STARTED + PC_JOB_SECONDS - 900 - PC_NOW ))
            [ "$IMPLEMENT_SECONDS" -gt 300 ] || IMPLEMENT_SECONDS=300
            # THE SECOND LINE, as for a description run: the driver stops its own agent in time, and
            # if it does not, it is stopped eight minutes before the job's timeout so the Propose
            # step still pushes what was written. MEASURED: a run whose first round outlasted the
            # hour was cancelled by GitHub and everything the agent wrote was lost.
            PC_HARD_STOP=$(( PC_STARTED + PC_JOB_SECONDS - 480 ))
            predictable implement \
              --spec "${PC_TARGET}" \
              --pinned \
              --permission-mode bypassPermissions \
              --max-seconds "$IMPLEMENT_SECONDS" \
              --path "$PWD/.predictable-code" > "$AGENT_JSON" 2> "$RUN_JSON" &
          elif [ "${PC_COMMAND}" = "fix" ]; then
            predictable analyze fix-issue "${PC_TARGET}" \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          # AUTHORING (#2019): the same three verbs the desktop product runs, with `--json` so
          # the one file each wrote comes back as `filePath` — the ONLY path the propose step
          # stages. `--blank` because a hosted spec is authored by a person, never generated.
          elif [ "${PC_COMMAND}" = "spec-new" ]; then
            predictable specs new "${PC_TEXT}" --blank \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          # GENERATION (#2055): the same verb WITHOUT `--blank`, so the model writes the
          # description and the requirements, and every requirement is held to the canonical
          # check before it is written. NO PLUGIN: this is the inference adapter's plain `claude`
          # spawn — the one `fix-issue` makes — not `predictable claude`, so the plugin download
          # above (fix-agent only) is not needed; the provisioned `bin/claude` is.
          #
          # TWO PASSES (#2307). The FIRST carries only the person's description: the model names the
          # spec, and with `--confirm-assumptions` a generation that had to ASSUME what the
          # description did not say writes nothing and reports its draft (a `spec-draft` progress
          # event, pushed like every other) for the person to confirm in the Control Center. The
          # CONFIRMED pass carries the name they approved, and writes.
          elif [ "${PC_COMMAND}" = "spec-generate" ] && [ -z "${PC_TEXT}" ]; then
            predictable specs new --context "${PC_PROMPT}" --confirm-assumptions \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          elif [ "${PC_COMMAND}" = "spec-generate" ]; then
            predictable specs new "${PC_TEXT}" --context "${PC_PROMPT}" \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          elif [ "${PC_COMMAND}" = "spec-describe" ]; then
            predictable specs describe "${PC_TARGET}" --text "${PC_TEXT}" \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          elif [ "${PC_COMMAND}" = "requirement-add" ]; then
            predictable specs requirements add "${PC_TARGET}" --description "${PC_TEXT}" \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          # EDITING AND REMOVING a requirement (#2342), the desktop product's own two verbs: the same
          # one `.md` comes back as `filePath`, so the propose step stages it exactly as an add's.
          elif [ "${PC_COMMAND}" = "requirement-update" ]; then
            predictable specs requirements update "${PC_TARGET%%/*}" "${PC_TARGET#*/}" --description "${PC_TEXT}" \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          elif [ "${PC_COMMAND}" = "requirement-remove" ]; then
            predictable specs requirements remove "${PC_TARGET%%/*}" "${PC_TARGET#*/}" \
              --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
          # DESCRIPTIONS (#2103): the one run that asks a model for them, with the inference
          # adapter's plain `claude` spawn like a generation. `--json` so the files it wrote come
          # back as `written[].key` — the ONLY paths the propose step stages.
          #
          # BOUNDED BY TIME, NEVER BY A COUNT (#2264). The job has `timeout-minutes: 60`
          # (`PC_JOB_SECONDS`), and a job GitHub cancels publishes nothing. So the run starts no
          # model call once `--time-limit` has passed — FIFTEEN MINUTES before the timeout, room
          # for the calls still in flight (each bounded by the engine's own timeout), the
          # re-render, and the propose step's commit and push — and reports what it left as
          # `overTime`, which the Control Center hands to the next run. As a second line, the wait
          # loop below stops the process EIGHT minutes before the timeout if it is still running,
          # and the pages it wrote are proposed from `--checkpoint`, which it appends to as it
          # writes each one. A run never loses its work to the clock.
          elif [ "${PC_COMMAND}" = "spec-fill-descriptions" ]; then
            # THE JOB'S `timeout-minutes` IN SECONDS, and it MUST stay equal to it: a step cannot
            # read its job's timeout, so the number is stated twice and a test holds them equal.
            PC_JOB_SECONDS=3600
            PC_NOW=$(date +%s)
            PC_STARTED="${PC_JOB_STARTED:-$PC_NOW}"
            DESCRIBE_LIMIT=$(( PC_STARTED + PC_JOB_SECONDS - 900 - PC_NOW ))
            [ "$DESCRIBE_LIMIT" -gt 60 ] || DESCRIBE_LIMIT=60
            PC_HARD_STOP=$(( PC_STARTED + PC_JOB_SECONDS - 480 ))
            DESCRIBE_CHECKPOINT="${RUNNER_TEMP}/pc-describe-checkpoint.ndjson"
            if [ "${PC_TEXT}" = "all" ]; then
              predictable specs fill-descriptions --all \
                --time-limit "$DESCRIBE_LIMIT" --checkpoint "$DESCRIBE_CHECKPOINT" \
                --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
            else
              predictable specs fill-descriptions --specs "${PC_TEXT}" \
                --time-limit "$DESCRIBE_LIMIT" --checkpoint "$DESCRIBE_CHECKPOINT" \
                --path "$PWD/.predictable-code" --json > "$RESULT_JSON" 2> "$RUN_JSON" &
            fi
          # FINDING WHAT PREDICTABLE MISSES (#2355): the agent's driver, then the sync that runs the
          # plugins it installed — and, like every sync, publishes them with the database
          # (`.plugins/` at its root). The driver needs the IL, which a database never carries
          # (`verification/` is never committed), so a state restored without it is analysed first,
          # publishing nothing (`PREDICTABLE_REPORTED_RUN`): the sync after the driver publishes.
          # The driver's clock leaves the job twenty-five minutes for that sync.
          elif [ "${PC_COMMAND}" = "plugins-discover" ]; then
            PC_JOB_SECONDS=3600
            PC_NOW=$(date +%s)
            PC_STARTED="${PC_JOB_STARTED:-$PC_NOW}"
            DISCOVER_SECONDS=$(( PC_STARTED + PC_JOB_SECONDS - 1500 - PC_NOW ))
            [ "$DISCOVER_SECONDS" -gt 300 ] || DISCOVER_SECONDS=300
            # `${A[@]+"${A[@]}"}` below, never `"${A[@]}"`: an EMPTY array is unbound under `set -u`
            # on every bash before 4.4.
            FOCUS_ARGS=()
            [ -z "${PC_TEXT}" ] || FOCUS_ARGS=(--focus "${PC_TEXT}")
            # ONE SPAWN, like every verb's: the function's stdout is the driver's stream (the agent's
            # turns, pushed as stdout) and its stderr the progress of all three steps. The closing
            # sync writes its envelope where every sync does, which is what the verdict reads.
            pc_discover() {
              # THIS branch's entry, as the republish below names it: the IL of another branch is
              # not the code this run checked out.
              if [ ! -d ".predictable-code/${GITHUB_REF_NAME}/.predictable-code/verification/Code/.il" ]; then
                PREDICTABLE_REPORTED_RUN=1 PREDICTABLE_SYNC_FULL=1 \
                  predictable sync --path "$PWD/.predictable-code" --json >/dev/null
              fi
              predictable plugins discover \
                --pinned \
                --permission-mode bypassPermissions \
                --max-seconds "$DISCOVER_SECONDS" \
                --run "${GITHUB_RUN_ID}" \
                ${FOCUS_ARGS[@]+"${FOCUS_ARGS[@]}"} \
                --path "$PWD/.predictable-code"
              predictable sync --path "$PWD/.predictable-code" --json >"$RESULT_JSON"
            }
            pc_discover > "$AGENT_JSON" 2> "$RUN_JSON" &
          # A PULL REQUEST REVIEW (#2367), dispatched on the pull request's HEAD branch. Four steps in
          # ONE spawn, so the pump pushes all of them as they happen:
          #
          #  1. the MERGE-BASE of the base commit (`text`) and this head — what the change is measured
          #     against, whatever moved on the base since the branch left it;
          #  2. `predictable review --start` on that merge-base, DETACHED, then back to the head;
          #  3. `predictable review --base` on the head: it decides, and prints ONE result line —
          #     `--explain` (Claude says why each defect matters and what to change) only when this
          #     repository has a model key, because only the analysis decides the check;
          #  4. when it found defects, there is a key and the pull request is not ours (a head under
          #     `predictable/`): the verified fix, stacked on the pull
          #     request — the Fix All driver over exactly the introduced defects, on
          #     `predictable/review-fix/<number>`, cut from the head. The Propose step pushes what it
          #     verified and reports both to the Control Center, which posts the check and the comment.
          #
          # NOTHING PUBLISHES (`PREDICTABLE_REPORTED_RUN`): a review's analyses describe a pull
          # request's head and its merge-base, which are no branch's analysis a reader looks at.
          elif [ "${PC_COMMAND}" = "review" ]; then
            export PREDICTABLE_REPORTED_RUN=1
            PC_JOB_SECONDS=3600
            PC_NOW=$(date +%s)
            PC_STARTED="${PC_JOB_STARTED:-$PC_NOW}"
            REVIEW_OUT="${RUNNER_TEMP}/pc-review-out.ndjson"
            REVIEW_FILE="${RUNNER_TEMP}/pc-review.json"
            REVIEW_FIX="${RUNNER_TEMP}/pc-review-fix.state"
            : > "$REVIEW_OUT"
            : > "$REVIEW_FILE"
            : > "$REVIEW_FIX"
            pc_review() {
              REVIEW_HEAD=$(git rev-parse HEAD)
              REVIEW_BRANCH=$(git symbolic-ref --quiet --short HEAD || echo "$REVIEW_HEAD")
              # The base commit is on the base branch, which a full checkout already holds; one that
              # was force-pushed away since is fetched by its id where the server still has it.
              git cat-file -e "${PC_TEXT}^{commit}" 2>/dev/null \
                || git fetch -q origin "${PC_TEXT}" 2>/dev/null || true
              MERGE_BASE=$(git merge-base "${PC_TEXT}" "$REVIEW_HEAD") || {
                echo "::error::${PC_TEXT} and ${REVIEW_HEAD} share no history, so there is nothing to measure this change against" >&2
                return 1
              }
              git checkout -q --detach "$MERGE_BASE"
              predictable review --start --json --path "$PWD/.predictable-code" > /dev/null || true
              git checkout -q "$REVIEW_BRANCH"
              # `${A[@]+"${A[@]}"}` below, never `"${A[@]}"`: an EMPTY array is unbound under `set -u`
              # on every bash before 4.4.
              #
              # NO `--permission-mode`: the explaining agent reads a diff the pull request's author
              # wrote, in a job holding the model key and an OIDC token, so it is never handed a mode
              # that lets it run a command or reach the network. `predictable review --explain` keeps
              # it to reading the checkout and writing its one reply file whatever it is passed, and
              # passing `bypassPermissions` here would say the opposite. The fix below is the Fix All
              # driver and keeps that driver's flags.
              EXPLAIN_ARGS=()
              if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
                EXPLAIN_SECONDS=$(( PC_STARTED + PC_JOB_SECONDS - 1800 - $(date +%s) ))
                [ "$EXPLAIN_SECONDS" -gt 120 ] || EXPLAIN_SECONDS=120
                EXPLAIN_ARGS=(--explain --pinned --max-seconds "$EXPLAIN_SECONDS")
              fi
              # `tee`, which reads all of its input, so what the review prints — Claude's stream when it
              # explains — is pushed live AND kept for the result line below.
              REVIEW_STATUS=0
              predictable review --base "$MERGE_BASE" --pr "${PC_TARGET}" --json \
                ${EXPLAIN_ARGS[@]+"${EXPLAIN_ARGS[@]}"} \
                --path "$PWD/.predictable-code" | tee "$REVIEW_OUT" || REVIEW_STATUS=$?
              # THE ONE RESULT LINE, each line parsed on its own so a banner cannot hide it.
              jq -cR 'fromjson? | objects | select(.type == "result") | .predictable_review // empty' \
                "$REVIEW_OUT" 2>/dev/null | tail -n 1 > "$REVIEW_FILE" || : > "$REVIEW_FILE"
              REVIEW_OUTCOME=$(jq -r '.outcome // empty' "$REVIEW_FILE" 2>/dev/null || true)
              if [ "$REVIEW_OUTCOME" != "defects" ]; then
                printf 'none\n' > "$REVIEW_FIX"
                return "$REVIEW_STATUS"
              fi
              # A PULL REQUEST OF OURS (its head under `predictable/`: a fix, a spec, a workflow
              # update) is reviewed only so the check a ruleset requires reports on it. A fix stacked
              # on it would be a second fix on our own, which nobody asked for.
              case "${GITHUB_REF_NAME:-}" in
                predictable/*)
                  printf 'none\na pull request of ours is not given a second fix\n' > "$REVIEW_FIX"
                  return "$REVIEW_STATUS"
                  ;;
              esac
              if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                printf 'not-attempted\nthis repository has no model key (ANTHROPIC_API_KEY), so no fix was attempted\n' > "$REVIEW_FIX"
                return "$REVIEW_STATUS"
              fi
              # CUT FROM THE HEAD, AS COMMITTED: whatever an explaining agent left in the checkout is
              # not the pull request's code, and the fix is judged against exactly that code.
              git reset -q --hard "$REVIEW_HEAD"
              git clean -q -f -d -e .predictable-code
              git checkout -q -B "predictable/review-fix/${PC_TARGET}" "$REVIEW_HEAD"
              bash "${RUNNER_TEMP}/pc-restore.sh" || true
              # THE BATCH, as Fix All's: each introduced defect's finding key (`fqn`, `vc`, `category`),
              # which the review reports for exactly this, read by the driver as a FILE. Its prompt
              # names the defects and the rules every fix keeps.
              REVIEW_BATCH="${RUNNER_TEMP}/pc-review-fix-batch.json"
              jq --arg pr "${PC_TARGET}" '
                {findings: [.introduced[] | {fqn, vc, category}],
                 prompt: ("Pull request #" + $pr + " introduces " + (.introduced | length | tostring)
                   + " defect(s) that Predictable Code reports. Fix each one in the source, the way a careful programmer would. Do NOT delete or disable code, and do NOT weaken an existing check: either would make a defect disappear without fixing anything. A fix must leave each defect gone and add no finding.\n\n"
                   + ([.introduced[] | "- " + .file + ":" + (.line | tostring) + " in " + .fqn + " (" + .label + "): " + .message] | join("\n")))}' \
                "$REVIEW_FILE" > "$REVIEW_BATCH"
              FIX_DEADLINE=$(( PC_STARTED + PC_JOB_SECONDS - 900 - $(date +%s) ))
              [ "$FIX_DEADLINE" -gt 300 ] || FIX_DEADLINE=300
              FIX_STATUS=0
              predictable fix \
                --together \
                --commit-verified \
                --batch-file "$REVIEW_BATCH" \
                --pinned \
                --permission-mode bypassPermissions \
                --deadline-seconds "$FIX_DEADLINE" \
                --path "$PWD/.predictable-code" || FIX_STATUS=$?
              # WHAT THE DRIVER COMMITTED is what its gate verified; anything else is not proposed.
              if [ "$(git rev-list --count "${REVIEW_HEAD}..HEAD" 2>/dev/null || echo 0)" -gt 0 ]; then
                printf 'verified\n' > "$REVIEW_FIX"
              else
                printf 'failed\nno change the analysis verified (the fix driver exited %s)\n' "$FIX_STATUS" > "$REVIEW_FIX"
              fi
              return "$REVIEW_STATUS"
            }
            pc_review > "$AGENT_JSON" 2> "$RUN_JSON" &
          # THE SYNC PUBLISHES ITSELF: it commits this branch's analysis to `predictable-code-database`
          # and pushes it, the same way a sync on a developer's machine does.
          elif [ "${PC_COMMAND}" = "sync" ]; then
            # AN ANALYSIS STOPS INSIDE ITS HOUR, so what it built is KEPT. A first analysis of a large
            # Lean project does not fit one hour on the standard runner (this product's own
            # repository: its ~1,250 mirrored modules alone are 50–70 minutes on two cores), and a
            # job GitHub cancels runs no later step, so it kept nothing and the next one started over.
            # Stopped fifteen minutes before the hour, the job still saves the Lean mirror's build and
            # the other stores below, and the next analysis continues from them.
            PC_JOB_SECONDS=3600
            PC_STARTED="${PC_JOB_STARTED:-$(date +%s)}"
            PC_HARD_STOP=$(( PC_STARTED + PC_JOB_SECONDS - 900 ))
            predictable sync --path "$PWD/.predictable-code" --json \
              > "$RESULT_JSON" 2> "$RUN_JSON" &
          # A REPUBLISH (#2257): the specs recompiled over the branch's analysis in the database — no
          # translation, no solver, no witness — which rebuilds every dataset, the module hierarchy's
          # summaries included, from the pages as merged; it is published below, once it has
          # rebuilt them. Over an analysis this build did not write (`PC_REPUBLISH` is not
          # `compile`), a sync instead, over the entry the database step cleared as it clears a
          # sync's.
          elif [ "${PC_COMMAND}" = "republish" ]; then
            if [ "${PC_REPUBLISH:-}" = "compile" ]; then
              predictable specs compile --path "$PWD/.predictable-code" --json \
                > "$RESULT_JSON" 2> "$RUN_JSON" &
            else
              # As a sync's, above: stopped inside the hour so what it built is kept.
              PC_JOB_SECONDS=3600
              PC_STARTED="${PC_JOB_STARTED:-$(date +%s)}"
              PC_HARD_STOP=$(( PC_STARTED + PC_JOB_SECONDS - 900 ))
              predictable sync --path "$PWD/.predictable-code" --json \
                > "$RESULT_JSON" 2> "$RUN_JSON" &
            fi
          else
            # NAMED, never a fall-through to `sync`: a verb this file does not know is a dispatch
            # from a control plane newer than this copy, and analysing instead would report an
            # outcome for something nobody asked for.
            echo "::error::unknown command '${PC_COMMAND}'; this workflow is older than the Control Center that dispatched it — merge the update pull request"
            exit 1
          fi
          SYNC_PID=$!
          # `kill -0` rather than a `pgrep` pattern: this repo has already been bitten by
          # a waiter whose pattern matched its own command line and never terminated.
          IMPL_LOGGED=0
          while kill -0 "$SYNC_PID" 2>/dev/null; do
            sleep "$PUSH_POLL_SECONDS"
            push_progress || :
            # AN IMPLEMENTATION'S ROUNDS REACH THIS LOG AS THEY HAPPEN (#2339), not only when the
            # driver exits: a job GitHub cancels never reaches the dump below, and a cancelled run
            # whose log says nothing about its rounds cannot be told apart from one that never
            # started. Only the driver's own start, baseline and round events — never the agent's.
            if [ "${PC_COMMAND}" = "spec-implement" ] && [ -f "$AGENT_JSON" ]; then
              IMPL_LINES=$(wc -l < "$AGENT_JSON" | tr -d ' ')
              if [ "$IMPL_LINES" -gt "$IMPL_LOGGED" ]; then
                sed -n "$((IMPL_LOGGED + 1)),${IMPL_LINES}p" "$AGENT_JSON" \
                  | grep -E '"subtype":"predictable_implement_(start|baseline|round)"' || true
                IMPL_LOGGED=$IMPL_LINES
              fi
            fi
            # AN ANALYSIS SAYS WHERE IT IS AND WHAT IT COSTS, ONCE A MINUTE. Its output goes to
            # `$RUN_JSON` and reaches this log only when it exits, so a run that the runner killed
            # (out of memory: "The runner has received a shutdown signal", exit 143) or that GitHub
            # cancelled at the hour left a log that said nothing for its whole length. MEASURED on
            # this product's own repository: 25 silent minutes, then the shutdown. The line names
            # the elapsed time, the last phase, the Lean mirror's progress, the machine's memory
            # and the three largest processes, so the next such run says what it was doing.
            if [ "${PC_COMMAND}" = "sync" ] || [ "${PC_COMMAND}" = "republish" ]; then
              PC_BEAT_NOW=$(date +%s)
              if [ $(( PC_BEAT_NOW - ${PC_LAST_BEAT:-0} )) -ge 60 ]; then
                PC_LAST_BEAT=$PC_BEAT_NOW
                PC_PHASE=$(grep -o '"phase":"[^"]*"' "$RUN_JSON" 2>/dev/null | tail -1 | cut -d'"' -f4 || true)
                PC_MIRROR=$(grep -oE 'mirror built [0-9]+ of [0-9]+' "$RUN_JSON" 2>/dev/null | tail -1 || true)
                PC_MEM=$(free -m 2>/dev/null | awk '/^Mem:/ {print $3 " of " $2 " MB used, " $7 " MB available"}' || true)
                PC_TOP=$(ps -eo rss=,comm= --sort=-rss 2>/dev/null \
                  | awk 'NR <= 3 {printf "%s %d MB; ", $2, $1 / 1024}' || true)
                echo "[heartbeat] $(( PC_BEAT_NOW - ${PC_JOB_STARTED:-$PC_BEAT_NOW} ))s into the job; phase ${PC_PHASE:-starting}${PC_MIRROR:+; Lean }${PC_MIRROR}; memory ${PC_MEM:-unknown}; largest: ${PC_TOP:-unknown}"
              fi
            fi
            # THE SECOND LINE of a description run's time bound (#2264), set by its branch above:
            # past it the process is stopped, so the propose step still has time to run.
            if [ -n "${PC_HARD_STOP:-}" ] && [ "${PC_HARD_STOPPED:-no}" = "no" ] \
              && [ "$(date +%s)" -ge "$PC_HARD_STOP" ]; then
              if [ "${PC_COMMAND}" = "sync" ] || [ "${PC_COMMAND}" = "republish" ]; then
                echo "::warning::the analysis is still running fifteen minutes before this job's timeout; stopping it so what it built is kept for the next one"
              else
                echo "::warning::${PC_COMMAND} is still running eight minutes before this job's timeout; stopping it so what it has can be proposed"
              fi
              # THE WHOLE TREE, never the one process: an implementation's agent is a grandchild
              # (`predictable implement` → `predictable claude` → `claude`), and stopping only the
              # driver orphaned it, still editing the checkout while the Propose step commits it.
              # Collected BEFORE anything is signalled — a stopped parent leaves its children to
              # init, where `pgrep -P` no longer finds them — then asked to stop, then made to.
              pc_tree() { echo "$1"; for _c in $(pgrep -P "$1" 2>/dev/null || true); do pc_tree "$_c"; done; }
              PC_TREE=$(pc_tree "$SYNC_PID")
              # shellcheck disable=SC2086
              kill -TERM $PC_TREE 2>/dev/null || true
              sleep 5
              # shellcheck disable=SC2086
              kill -KILL $PC_TREE 2>/dev/null || true
              PC_HARD_STOPPED=yes
            fi
          done
          # THE EXIT STATUS IS KEPT, and exactly one thing is done with it.
          #
          # An ordinary non-zero exit is still not acted on: the VERDICT below decides
          # whether an analysis is usable, and a fix that declines its own accept gates
          # is a real and ordinary outcome, not a failure. That reasoning is unchanged.
          #
          # A DEATH BY SIGNAL IS NOT THAT, and it was being reported as if it were.
          # MEASURED on a hosted agent fix: `predictable claude` took SIGSEGV before
          # reading a word of its prompt, `|| true` swallowed it, and the job exited 0
          # with `result=fix-agent` — the same thing it reports for a fix that ran fine
          # and chose to change nothing. The reader was told their defect needed a
          # different remedy; what actually happened is that the agent never started.
          #
          # No legitimate outcome of these verbs is a signal death, so this is a crash
          # and is reported as one.
          wait "$SYNC_PID" && RUN_STATUS=0 || RUN_STATUS=$?
          # STOPPED BY US AT THE TIME BOUND is not a crash: the pages it wrote are whole (each is
          # written before it is checkpointed), and the propose step reads them from the
          # checkpoint. Any other signal death is still reported as the crash it is, below. The
          # status is cleared on ONE line, guarded by the same test, so nothing else can clear it.
          # A STOPPED ANALYSIS is not a crash either, and not an answer: it published nothing, the job
          # fails as the verdict check below finds no verdict, and what it built is kept. Said here.
          if [ "${PC_HARD_STOPPED:-no}" = "yes" ] && { [ "${PC_COMMAND}" = "sync" ] || [ "${PC_COMMAND}" = "republish" ]; }; then
            echo "::warning::the analysis was stopped at its time bound before it finished; nothing was published, and what it built is kept, so the next analysis continues from it"
            echo "The analysis was stopped at its time bound before it finished. Nothing was published; what it built is kept, so the next analysis continues from it." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${PC_HARD_STOPPED:-no}" = "yes" ] && [ "$RUN_STATUS" -gt 128 ]; then
            if [ "${PC_COMMAND}" = "spec-implement" ]; then
              echo "::warning::${PC_COMMAND} was stopped at its time bound; what the agent wrote is proposed as a draft, unchecked"
              echo "The implementation was stopped at its time bound; what the agent wrote is proposed as a draft, unchecked." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::${PC_COMMAND} was stopped at its time bound; the descriptions it wrote are proposed from its checkpoint, and the rest are left for another run"
              echo "The run was stopped at its time bound; what it wrote is proposed, and the rest are left for another run." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "${PC_HARD_STOPPED:-no}" = "yes" ] && [ "$RUN_STATUS" -gt 128 ]; then RUN_STATUS=0; fi
          # The tail: phases written between the last poll and the process exiting are
          # the ones naming the outcome, and losing them loses the answer.
          push_progress final || :

          # AND BACK INTO THIS LOG, because redirecting stderr to a file took it out of
          # one. Before the split, `predictable`'s progress went to the job log and the
          # control plane scraped it; now it goes to `$RUN_JSON` and is pushed — which
          # is what makes it live, and also what made the customer's OWN log stop
          # carrying it. Measured on a real run: the job log held ZERO progress events,
          # its only match being this comment.
          #
          # That matters twice. A push is best-effort, so a network failure would have
          # left the phases in NEITHER place; and the Actions log is where a customer
          # debugs their own run, with no account of ours to consult.
          #
          # Appended after the fact rather than tee'd: a `tee` through process
          # substitution reorders against the step's other output and can lose the tail
          # when the shell exits, and the ordering here is not worth that risk — the
          # live copy is the pushed one.
          if [ -s "$RUN_JSON" ]; then
            echo "::group::Progress events ($(wc -l < "$RUN_JSON" | tr -d ' ') lines)"
            cat "$RUN_JSON"
            echo "::endgroup::"
          fi
          # THE AGENT'S STREAM, for the same reason and with the same caveat: a push is
          # best-effort, and this is the customer's own record of what the agent did.
          if [ -s "$AGENT_JSON" ]; then
            echo "::group::Agent stream ($(wc -l < "$AGENT_JSON" | tr -d ' ') lines)"
            cat "$AGENT_JSON"
            echo "::endgroup::"
          fi

          # A CRASH IS REPORTED AS A CRASH, before anything downstream reads a tree the
          # dead process may have left half-written. `128 + N` is the shell's encoding of
          # "killed by signal N"; 139 is SIGSEGV, which is the one this was written for.
          #
          # It FAILS THE JOB deliberately. Every alternative lies in the reader's favour:
          # exiting 0 publishes a pull request from a tree nobody finished writing, and
          # the app's own honest "unverified" line still leaves them looking for a reason
          # in their code. A red job with this sentence is the only outcome that says what
          # happened.
          if [ "$RUN_STATUS" -gt 128 ]; then
            SIG=$((RUN_STATUS - 128))
            echo "::error::${PC_COMMAND} was killed by signal ${SIG} (exit ${RUN_STATUS}) — this is a crash, not a run that chose to change nothing, so nothing it may have written is trusted"
            {
              echo "### The run crashed"
              echo
              echo "\`${PC_COMMAND}\` was killed by **signal ${SIG}** (exit ${RUN_STATUS}). That is a crash of the tool, **not** a finding about your code and not a fix that declined — so no pull request is opened and whatever it had written is left alone."
              echo
              echo "The output above is everything it managed to report before it died."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # AN AGENT THAT NEVER RAN IS NOT A FIX THAT DECLINED, and only the agent verb can
          # tell the two apart by its exit status.
          #
          # The rule above — "an ordinary non-zero exit is not acted on" — is right for
          # `fix-issue` and for `sync`: `fix-issue` has accept gates and restoring its snapshot
          # is an ordinary outcome, and a partial sync is still a usable analysis. `predictable
          # claude` has no accept gates. It either launches the agent or it does not, so a
          # non-zero exit from it means the run produced nothing, for a reason that is ours.
          #
          # MEASURED on run 35879959641, which reported SUCCESS: `predictable claude --pinned`
          # found no pinned Claude ("No pinned Claude ships with this build"), threw, exited
          # non-zero — and this step swallowed it, so the empty tree downstream was announced as
          # "the fix did not change any source; nothing to propose". That is the sentence a
          # reader gets when an agent considered their defect and declined, and the agent had not
          # started. The crash arm above was written for exactly this shape and catches only
          # signal deaths; this is the same lie arriving through an ordinary exit code.
          # AN AUTHORING VERB THAT EXITS NON-ZERO WROTE NOTHING WE TRUST — no such spec, a name
          # that is already a spec's file, an unparsable sentence — and unlike a fix there is
          # no "declined" outcome to read from the tree. So it fails here, with the verb's own
          # words above, and no pull request is opened.
          if [ "${PC_AUTHORING}" = "yes" ] && [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::${PC_COMMAND} was refused (exit ${RUN_STATUS}); the output above says why, and no pull request is opened"
            {
              echo "### The spec was not changed"
              echo
              echo "\`${PC_COMMAND}\` exited **${RUN_STATUS}**. Nothing was written to your repository and no pull request is opened; the output above is the command's own reason."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${PC_FILES}" = "yes" ] && [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::${PC_COMMAND} was refused (exit ${RUN_STATUS}); the output above says why, and no pull request is opened"
            {
              echo "### Nothing was changed"
              echo
              echo "\`${PC_COMMAND}\` exited **${RUN_STATUS}**. Nothing was written to your repository and no pull request is opened; the output above is the command's own reason."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # THE SAME FOR AN IMPLEMENTATION (#2339): `predictable implement` reports every outcome of
          # its loop on a `result` line and exits 0; a non-zero exit is a driver or an agent that did
          # not start, never "the spec is not met".
          if [ "${PC_COMMAND}" = "spec-implement" ] && [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::the implementation did not run (exit ${RUN_STATUS}); the output above says why"
            {
              echo "### The implementation did not run"
              echo
              echo "\`predictable implement\` exited **${RUN_STATUS}** without completing. That is a failure to start or to finish the agent, **not** a verdict on the spec — so nothing is pushed. The spec's pull request, if it has one, was made a draft for the run and stays one: implement it again, or mark it ready to merge the spec alone."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # A FIX THE DRIVER'S OWN CHECK VERIFIED IS PROPOSED, whatever the driver's exit code. The
          # driver records every round's verdict in the stream before it decides anything else, so a
          # last round reading `gone` with `next: done`, over a tree that holds a change, is a fix
          # that was made and checked. Measured: a driver that crashed in its cleanup AFTER such a
          # round exited 1, and the job reported "the agent did not run" over a verified fix, and no
          # pull request was opened. Here the run goes on to propose it, and says what happened.
          # Each line is read on its own (`fromjson?`), so a stray line that is not a JSON object (a
          # CLI banner) cannot hide the rounds. Only a per-finding round (`.check`) is read: a
          # `--together` round carries `checks`/`remaining` and reads "no", which fails CLOSED (the
          # run is reported as not run, as before); widening it is a decision of its own.
          PC_FIX_VERIFIED_DESPITE_EXIT=""
          if [ "${PC_COMMAND}" = "fix-agent" ] && [ "$RUN_STATUS" -ne 0 ] && [ "$RUN_STATUS" -le 128 ] \
            && [ -s "$AGENT_JSON" ] \
            && [ "$(jq -cR 'fromjson? | objects | select(.subtype == "predictable_fix_round")' "$AGENT_JSON" 2>/dev/null \
                  | jq -rs 'last
                  | if . == null then "no" elif (.check.verdict? == "gone" and .next == "done") then "yes" else "no" end' \
                  2>/dev/null || echo no)" = "yes" ] \
            && [ -n "$(git status --porcelain -- . ':(exclude).predictable-code' 2>/dev/null)" ]; then
            echo "::warning::predictable claude exited ${RUN_STATUS} after its own check verified the fix; the verified change is proposed"
            {
              echo "### Fix verified; the tool then exited ${RUN_STATUS}"
              echo
              echo "The last check of this run found the defect gone. The tool exited ${RUN_STATUS} afterwards, which is a fault in the tool, not in the fix, so the verified change is proposed as usual."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PC_FIX_VERIFIED_DESPITE_EXIT=yes" >> "${GITHUB_ENV:-/dev/null}"
            PC_FIX_VERIFIED_DESPITE_EXIT=yes
            RUN_STATUS=0
          fi

          if [ "${PC_COMMAND}" = "fix-agent" ] && [ "$RUN_STATUS" -ne 0 ]; then
            echo "::error::the agent did not run (exit ${RUN_STATUS}) — this is not a fix that chose to change nothing, and the output above says why"
            {
              echo "### The agent did not run"
              echo
              echo "\`predictable claude\` exited **${RUN_STATUS}** without completing. That is a failure to start or to finish the agent, **not** a decision about your code — so no pull request is opened and the finding stands untouched."
              echo
              echo "The most common cause is a toolchain this workflow did not provision: the package ships no agent CLI, so \`provision.sh install aqua:anthropics/claude-code\` has to install one first. The output above names what it could not find."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # THE ONE OUTCOME THAT LOOKS LIKE A DEFECT IN THE CUSTOMER'S CODE AND IS NOT.
          #
          # MEASURED: a 1,213-file TypeScript repository on the standard runner (2 cores,
          # 7 GB) exhausted the tsc front end's 3,374 MB V8 old-space budget. TypeScript
          # was then reported as not translated, so the analysis had nothing to read, and
          # everything downstream followed — no datasets, and an app that says "not
          # analyzed" about a repository it had just spent forty minutes on.
          #
          # The engine already names its own remedy, on STDERR. That used to reach the
          # job log; since the progress split it reaches `$RUN_JSON`, is pushed to the
          # control plane as one progress line among hundreds, and is echoed back into
          # the group above where nobody scrolling a green run will find it. The reader's
          # account of the run — the verdict, the step summary, the pull request — says
          # `degraded`, which is true and does not say WHY.
          #
          # So it is lifted to an annotation and a summary, where a degraded verdict is
          # explained rather than merely stated.
          #
          # WHICH REMEDY DEPENDS ON THE BUDGET THAT DIED, and the first version of this
          # block got that backwards. `nodeFrontEndHeapMbFor` is
          # `min 4096 (max (h/2) (h-1024))`, pinned by `#guard`s: a standard GitHub runner
          # (~6.7 GB of headroom) derives 4096, and so does a 64 GB machine — the
          # `#guard nodeFrontEndHeapMbFor 65536 == 4096` says it outright. So above about
          # 5 GB THE CEILING BINDS AND A BIGGER RUNNER CHANGES THE BUDGET BY NOTHING, and
          # telling a reader whose 4096 MB budget was exhausted to rent a larger machine
          # sends them to spend money on an identical result.
          #
          # Below the ceiling the opposite holds: the budget followed a small machine down,
          # and memory is exactly the lever.
          #
          # The ceiling itself is measured and deliberate — 8192 MB bought no time and
          # 1.3 GB more resident memory on this corpus — so raising `heap_mb` past it is a
          # considered override, not a default, and it needs a machine that can hold it:
          # V8's RSS runs above its own old-space cap, so a cap near the machine's size
          # trades this clean error for the kernel killing the process.
          # WHY THIS RUN COVERED LESS, WRITTEN ONCE AND RENDERED TWICE. The step summary below is
          # read by somebody looking at THIS run; the pull request the next step opens outlives it
          # and is what a reviewer sees. Both need the same answer, and computing it twice would be
          # two producers of one fact — the shape this branch keeps finding. So it is extracted
          # here, beside the data, and the propose step renders the file.
          WHY_FILE="${RUNNER_TEMP}/pc-degraded-why.txt"
          : > "$WHY_FILE"
          HEAP_EXPLAINED=no
          if grep -q "exhausted its" "$RUN_JSON" 2>/dev/null; then
            HEAP_EXPLAINED=yes
            # ONE PASS THAT STOPS ITSELF, never `grep | head -1`: under `pipefail` a writer cut
            # off by an early-exiting reader is a failed pipeline, which `errexit` turns into a
            # failed step — the shape that ended run 37652090245.
            BUDGET=$(awk 'match($0, /exhausted its [0-9]* MB/) { s = substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", s); print s; exit }' "$RUN_JSON")
            printf 'The TypeScript front end exhausted its %s MB V8 old-space budget on this runner, so TypeScript is reported as not translated.\n' "${BUDGET:-derived}" > "$WHY_FILE"
            echo "::warning::the TypeScript front end ran out of memory (${BUDGET:-its} MB V8 old-space budget), so TypeScript is reported as not translated and this analysis covers less than the project"
            {
              echo "### TypeScript did not translate: the front end ran out of memory"
              echo
              echo "The tsc front end exhausted its **${BUDGET:-derived} MB** V8 old-space budget on this runner, so TypeScript is reported as not translated and everything downstream of it — analysis, inferred requirements, the datasets this app reads — covers less than your project. **Nothing here says your code is wrong.**"
              echo
              if [ -n "${BUDGET}" ] && [ "${BUDGET}" -lt 4096 ]; then
                echo 'This budget is **below the 4096 MB ceiling**, which means it was sized down to fit this machine. Run this workflow again with a `runner` that has more memory and the budget rises with it, up to that ceiling — no other change needed.'
              else
                echo 'This budget is **at the 4096 MB ceiling**, so a bigger `runner` alone will not change it: the budget is `min 4096 (max (headroom/2) (headroom - 1024))`, and every machine from a standard runner upwards derives the same 4096. To go further you must raise `heap_mb` explicitly **and** run on a machine large enough to hold it — V8 uses more resident memory than its own cap, so a cap near the size of the machine trades this clean error for the kernel killing the process. The ceiling is deliberate: 8192 MB was measured to buy no time and 1.3 GB more resident memory.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # A SYNC REPORTS ITS VERDICT, NOT ITS EXIT CODE. `degraded` (only part of the
          # project translated) and `mechanical` (stopped before proving) both exit 0,
          # so reading the exit status alone reports a partial analysis as a clean one.
          # THE VERDICT IS THE SINGLE KEY OF `result`, not `result` itself.
          #
          # `SyncResponse` is an inductive — `inSync`, `mechanical`, `degraded`,
          # `verificationError` and the rest — so `.result` serialises as an OBJECT and
          # `jq -r '.result'` prints the whole thing across many lines. A multi-line
          # value written as `result=…` into `$GITHUB_OUTPUT` is malformed, so the
          # propose step read it as EMPTY and titled the pull request
          # "Predictable Code analysis ()" on a run that had analysed the project fine.
          # The Control Center's own parser says it plainly: "the verdict is the single
          # key of the envelope's `result`".
          # A REPUBLISH CARRIES THE VERDICT OF THE ANALYSIS IT REBUILT OVER (#2257): nothing was
          # analysed, so nothing could have changed it, and inventing one would be a verdict nobody
          # reached. It is read from that analysis's own record in the database; a record that names
          # none, or a compile that failed, republishes nothing.
          #
          # PUBLISHED HERE, since no sync ran to publish it: `predictable publish` commits the rebuilt
          # datasets as the analysis of the commit checked out, with the verdict the entry's sync
          # left, by the rule every sync's publish follows. The entry's `sync-delta.json` goes
          # first: it is what the LAST SYNC changed, and a republish changed nothing, so it would log
          # that sync's found and fixed a second time.
          if [ "${PC_COMMAND}" = "republish" ] && [ "${PC_REPUBLISH:-}" = "compile" ]; then
            if [ "$RUN_STATUS" -ne 0 ] || [ -z "$(jq -r '.dataPath // empty' "$RESULT_JSON" 2>/dev/null || true)" ]; then
              echo "::error::predictable specs compile did not rebuild the datasets (exit ${RUN_STATUS}); nothing is republished, and the output above says why"
              exit 1
            fi
            RESULT=$(jq -r '.verdict // empty' ".predictable-code/${GITHUB_REF_NAME}/.analysis.json" 2>/dev/null \
              | tr -d '\r\n' || true)
            if [ -z "$RESULT" ]; then
              echo "::error::the analysis being republished records no verdict, so there is none to carry; nothing is republished"
              exit 1
            fi
            rm -f ".predictable-code/${GITHUB_REF_NAME}/.predictable-code/specs/.data/sync-delta.json"
            predictable publish || {
              echo "::error::the rebuilt datasets of ${GITHUB_REF_NAME} could not be published; the line above says why"
              exit 1
            }
            echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
            echo "::notice::republished over the analysis of ${GITHUB_REF_NAME}, whose verdict was ${RESULT}"
            exit 0
          fi
          # A REVIEW (#2367) REPORTS ITS RESULT LINE, and nothing else decides it: a review that printed
          # none did not look, so the run fails saying so — and the Control Center, hearing no result,
          # fails the check as not analysed with this run's conclusion. A result printed beside a
          # non-zero exit is still the result.
          if [ "${PC_COMMAND}" = "review" ]; then
            if [ ! -s "${RUNNER_TEMP}/pc-review.json" ]; then
              echo "::error::predictable review reported no result (exit ${RUN_STATUS}); the output above says why, and this change is reported as not analysed"
              {
                echo "### The review reported no result"
                echo
                echo "\`predictable review\` exited **${RUN_STATUS}** without its result line, so nothing decided this pull request. Its check fails as **not analysed**: a change nobody analysed is never passed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            OUTCOME=$(jq -r '.outcome // empty' "${RUNNER_TEMP}/pc-review.json" | tr -cd 'a-z-')
            INTRODUCED=$(jq -r '.introduced | length' "${RUNNER_TEMP}/pc-review.json" | tr -cd '0-9')
            echo "::notice::review of #${PC_TARGET}: ${OUTCOME} (${INTRODUCED:-0} introduced)"
            echo "### Review of #${PC_TARGET}: \`${OUTCOME}\`, ${INTRODUCED:-0} defect(s) this change introduces" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A republish that ANALYSED falls through to the sync's verdict below, and so does a
          # discovery (#2355), whose run ENDS in a sync: its verdict is that sync's.
          if [ "${PC_COMMAND}" != "sync" ] && [ "${PC_COMMAND}" != "republish" ] \
            && [ "${PC_COMMAND}" != "plugins-discover" ]; then
            # A FIX IS NOT JUDGED BY A VERDICT FIELD, and not by the exit code either.
            # The product's rule is that a fix is `applied` only on POSITIVE EVIDENCE
            # THAT SOURCE CHANGED — `fix-verdict.ts` is the one place that rule lives,
            # and it exists because an exit code says a process finished, never that it
            # did anything. On a runner that evidence is directly observable, so it is
            # read from the tree in the next step rather than asserted here.
            #
            # `fix-issue` keeps its edit only if its own accept gates hold and restores
            # the snapshot otherwise, so "changed nothing" is a real and ordinary
            # outcome: the fix was tried and declined. That is reported, never failed.
            echo "result=${PC_COMMAND}" >> "$GITHUB_OUTPUT"
            if [ "${PC_FILES}" = "yes" ]; then
              # THE FILES THE COMMAND WROTE, repo-relative, one per line: the ONLY pathspecs the
              # propose step stages (#2103). Each is resolved by `spec_in_checkout`, which refuses
              # a path outside the checkout or holding a control character — one such path and
              # nothing is proposed, because a list that was edited on the way is not a list the
              # command wrote.
              FILES="${RUNNER_TEMP}/pc-files.txt"
              : > "$FILES"
              # A RUN STOPPED AT ITS TIME BOUND printed no report (#2264); what it wrote is in its
              # CHECKPOINT, one `Written` per line, and stands in for the report: those pages, and
              # a report that says another run is owed, since the rest were never asked.
              #
              # LINE BY LINE, each line parsed on its own (`-R` + `fromjson?`), never the file as one
              # stream: the stop can land mid-write, leaving a torn LAST line, and one unparseable
              # line failed the whole parse — so the run's final batch, every page of it whole on
              # disk, was proposed as nothing. A line that is not a whole entry is dropped; its page
              # is found unwritten by the next run.
              #
              # THE AREAS PAGE IS NOT A DESCRIBED SPEC (#2318). The run rewrites `_areas.md` each time a
              # spec adds an area and checkpoints it every time, so its key repeats: one entry per
              # key, the LAST (the page as it was left), and it is never counted as a description.
              if ! jq -e '.written' "$RESULT_JSON" >/dev/null 2>&1; then
                CK="${DESCRIBE_CHECKPOINT:-${RUNNER_TEMP}/pc-describe-checkpoint.ndjson}"
                if [ -s "$CK" ]; then
                  jq -Rn '[inputs | fromjson? | select(type == "object" and (.key | type) == "string")] | reverse | unique_by(.key) | {status: "described", reason: "was stopped at its time bound", undescribed: ([.[] | select(.kind != "areas")] | length), written: ., failed: [], overTime: 0, breakerStopped: 0, absent: [], model: null, costUsd: 0, anotherRun: true}' \
                    "$CK" > "$RESULT_JSON" 2>/dev/null || true
                fi
              fi
              jq -r '.written[]?.key' "$RESULT_JSON" > "${RUNNER_TEMP}/pc-written.txt" 2>/dev/null \
                || : > "${RUNNER_TEMP}/pc-written.txt"
              while IFS= read -r _k; do
                [ -n "$_k" ] || continue
                _f=$(spec_in_checkout "$_k") || {
                  echo "::error::the run reported a file that is not in this repository; nothing is proposed"
                  exit 1
                }
                printf '%s\n' "$_f" >> "$FILES"
              done < "${RUNNER_TEMP}/pc-written.txt"
              # WHAT A MODEL WROTE, for the pull request to state — every sentence, what failed,
              # what is left, and what it cost. INERT, because a model wrote it and GitHub
              # renders it: each value is one line in a DOUBLE-backtick span with backtick runs
              # reduced to one, so no newline starts a block, no `@` pings, no `#` links.
              jq -r 'def inert: tostring | gsub("[[:cntrl:]]+"; " ") | gsub("`+"; "`") | "`` " + . + " ``";
                "### Descriptions written by a model",
                "",
                "\(.undescribed) spec(s) in this run had no description\(if (.areasOnly // 0) > 0 then " or no area (\(.areasOnly) of them only an area: their descriptions are left as they were)" else "" end), so a model (\(.model // "unknown" | inert)) wrote \([.written[] | select(.kind != "areas")] | length) of them, using this repository'"'"'s own key, in its own Actions. **A model wrote every sentence below — review them as you would text nobody on your team wrote.** A person'"'"'s own description is never replaced, and only the spec files listed here are in this change.",
                "",
                (.written[] | "- \(.key | inert) — \(.text | inert)"),
                (if (.failed | length) > 0 then "", "Not written:", "", (.failed[] | "- \(.key | inert) — \(.reason | inert)") else empty end),
                (if .reason != null then "", "The run \(.reason | inert)." else empty end),
                (if (.breakerStopped // 0) > 0 then "", "\(.breakerStopped) spec(s) were left because the model could not be reached, so the run stopped before describing them — check this repository'"'"'s key." else empty end),
                (if (.overTime // 0) > 0 then "", "\(.overTime) more were not reached before this run'"'"'s time bound and are left for the next run." else empty end),
                (if ((.absent // []) | length) > 0 then "", "Not specs in this checkout, so not described — the analysis that listed them may not match this branch as it is now:", "", (.absent[] | "- \(. | inert)") else empty end),
                (if .sourcesWithoutSpec == null then "", "Whether every source file has a spec could not be checked in this run." elif (.sourcesWithoutSpec | length) > 0 then "", "\(.sourcesWithoutSpec | length) source file(s) have no spec yet, so there was nothing to describe for them. The next analysis creates their specs; this run never invents one:", "", (.sourcesWithoutSpec[:100][] | "- \(. | inert)"), (if (.sourcesWithoutSpec | length) > 100 then "- … and \((.sourcesWithoutSpec | length) - 100) more" else empty end) else empty end),
                "",
                "What the model calls cost: US$\((.costUsd * 100 | round) / 100)."' \
                "$RESULT_JSON" > "${RUNNER_TEMP}/pc-fill-body.md" 2>/dev/null || : > "${RUNNER_TEMP}/pc-fill-body.md"
              # WHETHER ANOTHER RUN OWES WORK HERE (#2264): the run's own `anotherRun`, the answer the
              # Control Center acts on too. Absent or unreadable reads as `false` — this run is the
              # last — so a report that cannot be read still ends in a pull request, never a branch
              # nobody packages.
              ANOTHER=$(jq -r '.anotherRun // false' "$RESULT_JSON" 2>/dev/null || echo false)
              [ "$ANOTHER" = "true" ] || ANOTHER=false
              echo "another_run=${ANOTHER}" >> "$GITHUB_OUTPUT"
              # A SELECTED FILE THAT IS NO SPEC HERE is said on the run itself too, because when it
              # is all the run was asked for, nothing is written and no pull request carries it.
              ABSENT=$(jq -r '(.absent // []) | length' "$RESULT_JSON" 2>/dev/null | tr -cd '0-9' || true)
              if [ "${ABSENT:-0}" -gt 0 ]; then
                echo "::warning::${ABSENT} selected spec file(s) are not specs in this checkout, so they were not described — the analysis that listed them may not match this branch as it is now"
                echo "${ABSENT} selected spec file(s) are not specs in this checkout, so they were not described." >> "$GITHUB_STEP_SUMMARY"
              fi
              # WHY A SPEC WAS NOT DESCRIBED, said on the run (#2289). The reasons went only into the
              # pull request's body, so a run that wrote NOTHING — no pull request — said nowhere
              # why, and three failures on a Java repository read as a clean run. Each failure is an
              # annotation, the first fifty, and the step summary counts them all.
              FAILED=$(jq -r '(.failed // []) | length' "$RESULT_JSON" 2>/dev/null | tr -cd '0-9' || true)
              if [ "${FAILED:-0}" -gt 0 ]; then
                # ESCAPED as GitHub documents for command data: a reason is a provider's error body
                # or a trace, and a newline in it would end the annotation and run the next line as
                # a workflow command of its own.
                jq -r '(.failed // [])[:50][] | "::warning::could not describe \(.key | tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")): \(.reason | tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))"' \
                  "$RESULT_JSON" 2>/dev/null || true
                WROTE=$(jq -r '[(.written // [])[] | select(.kind != "areas")] | length' "$RESULT_JSON" 2>/dev/null | tr -cd '0-9' || true)
                echo "${FAILED} spec(s) could not be described (${WROTE:-0} were); each reason is an annotation on this run." >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            if [ "${PC_AUTHORING}" = "yes" ]; then
              # A DRAFT WROTE NOTHING (#2307): the description left something to assume, so the
              # person confirms what was inferred before a spec exists. Nothing to propose; the
              # draft already reached the Control Center as a progress event.
              if [ "${PC_COMMAND}" = "spec-generate" ] && jq -e '.draft != null' "$RESULT_JSON" >/dev/null 2>&1; then
                echo "spec_drafted=yes" >> "$GITHUB_OUTPUT"
                echo "::notice::the description left things to assume, so nothing was written: the Control Center asks the person to confirm what was inferred"
                echo "The description left things to assume, so nothing was written: the Control Center asks the person who described the feature to confirm what was inferred." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              # THE ONE FILE THE VERB WROTE, repo-relative, or the run fails. `filePath` is
              # absolute on the runner; `spec_in_checkout` resolves it (it must EXIST) and the
              # workspace prefix test refuses anything outside the checkout, because this
              # value becomes a `git add` pathspec in the next step.
              SPEC_ABS=$(jq -r '.filePath // empty' "$RESULT_JSON" 2>/dev/null || true)
              SPEC_FILE=$(spec_in_checkout "$SPEC_ABS") || {
                echo "::error::${PC_COMMAND} reported no spec file inside this repository, so there is nothing to propose"
                exit 1
              }
              # The edit must have landed in the file whose branch it continued, or the pull
              # request would carry a different spec than the one resolved above.
              if [ -n "$PRE_SPEC_FILE" ] && [ "$PRE_SPEC_FILE" != "$SPEC_FILE" ]; then
                echo "::error::${PC_COMMAND} wrote ${SPEC_FILE}, not ${PRE_SPEC_FILE} as resolved; nothing is proposed"
                exit 1
              fi
              # CR/LF STRIPPED: each becomes one line of `$GITHUB_OUTPUT`, and a newline inside a
              # name a person typed would forge another output line after it — `spec_branch=main`
              # redirecting the push, or a `spec_file` that never passed `spec_in_checkout`.
              SPEC_ID=$(jq -r '.specId // .id // empty' "$RESULT_JSON" 2>/dev/null | tr -d '\r\n' || true)
              SPEC_NAME=$(jq -r '.specName // .name // empty' "$RESULT_JSON" 2>/dev/null | tr -d '\r\n' || true)
              {
                echo "spec_file=${SPEC_FILE}"
                echo "spec_branch=$(spec_branch_for "$SPEC_FILE")"
                echo "spec_id=${SPEC_ID}"
                echo "spec_name=${SPEC_NAME}"
              } >> "$GITHUB_OUTPUT"
              # WHAT A GENERATION LEFT OUT, AND WHAT IT WAS GROUNDED IN (#2055), for the pull
              # request to state. The sentences are MODEL TEXT, so they go to a FILE the propose
              # step renders, never to `$GITHUB_OUTPUT`; the count is reduced to digits first.
              #
              # AND THE FILE IS INERT MARKDOWN. It lands in a pull request body, where model text
              # seeded by what a person typed would otherwise render: a newline starts a heading
              # or a block, `@someone` pings a real person when the pull request opens, `#123`
              # cross-links an issue, a link or an image renders. So each value is collapsed to one
              # line and set in a DOUBLE-backtick code span — GitHub links nothing inside one — with
              # every run of backticks reduced to a single one, which cannot close that span.
              if [ "${PC_COMMAND}" = "spec-generate" ]; then
                jq -r 'def inert: tostring | gsub("[[:cntrl:]]+"; " ") | gsub("`+"; "`") | "`` " + . + " ``";
                  (.rejected // [])[] | "- \(.description | inert) — \(.error | inert)"' "$RESULT_JSON" \
                  > "${RUNNER_TEMP}/pc-spec-rejected.md" 2>/dev/null || : > "${RUNNER_TEMP}/pc-spec-rejected.md"
                GROUNDED=$(jq -r '.groundedFunctions // 0' "$RESULT_JSON" 2>/dev/null | tr -cd '0-9' || true)
                echo "spec_grounded=${GROUNDED:-0}" >> "$GITHUB_OUTPUT"
                # HOW MANY REQUIREMENTS IT WROTE (#2307). A generation can keep none of what the
                # model proposed, and the spec is then a description with no requirements: the
                # pull request must say so rather than propose it as if it were what the person
                # asked for. EMPTY, never a guessed zero, when the binary does not report it — a
                # count nobody stated must not claim the spec is empty.
                WRITTEN=$(jq -r '.requirementsWritten // empty' "$RESULT_JSON" 2>/dev/null | tr -cd '0-9' || true)
                echo "spec_written=${WRITTEN}" >> "$GITHUB_OUTPUT"
                if [ "${WRITTEN}" = "0" ]; then
                  echo "::warning::no requirements could be derived from the description: none of what the model proposed passed the requirement check"
                fi
              fi
            fi
            exit 0
          fi

          RESULT=$(jq -r '.result | keys[0] // empty' "$RESULT_JSON" 2>/dev/null || true)
          echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
          echo "::notice::sync verdict: ${RESULT}"

          # A DEGRADED VERDICT EXPLAINS ITSELF, WHATEVER DEGRADED IT.
          #
          # The block above lifts ONE cause — the tsc front end running out of memory —
          # because its remedy is specific enough to be worth tailoring. Its own comment
          # states the general rule it was only half applying: the reader's account of the
          # run "says `degraded`, which is true and does not say WHY". Every OTHER way a
          # run covers less than the project was still stated and not explained: a language
          # whose toolchain would not install (`provisionLanguage` answers `unavailable`
          # and that becomes the not-translated reason on THAT language's files alone), a
          # front end that produced no IL for some files, files of no supported language,
          # a Lean toolchain mismatch. The engine names each of them — `not translated
          # (<reason>)` — and all of it goes to `$RUN_JSON`, where it is one progress line
          # among hundreds inside a collapsed group on a run that ends GREEN.
          #
          # So `degraded` alone reads to a reader exactly as a clean bill with a word they
          # skim past, which is the failure every honesty rule in this product exists to
          # prevent — arriving through the reporting rather than through a verdict.
          #
          # IT LIFTS WHAT THE ENGINE SAID AND INVENTS NOTHING. Where the run left no
          # readable reason the summary says so and points at this job's log, because
          # "we could not tell you why" is an honest answer and a manufactured cause is
          # not. Bounded to a handful of distinct lines: a summary that reprints a
          # thousand per-file reasons is one nobody reads, and the count says how many
          # were left for the log.
          if [ "${RESULT}" = "degraded" ] && [ "${HEAP_EXPLAINED}" = "no" ]; then
            # `sed -n '1,5p'` reads to the end, so `sort` is never cut off mid-write: a `head`
            # here is the early-exiting reader the push loop above explains.
            REASONS=$(grep -o "not translated ([^)\\\"]*)" "$RUN_JSON" 2>/dev/null \
              | sort | uniq -c | sort -rn | sed -n '1,5p' || true)
            DISTINCT=$(grep -o "not translated ([^)\\\"]*)" "$RUN_JSON" 2>/dev/null \
              | sort -u | wc -l | tr -d ' ' || true)
            if [ -n "${REASONS}" ]; then
              printf 'What the engine reported, most common first:\n\n```\n%s\n```\n' "${REASONS}" > "$WHY_FILE"
            else
              printf 'This run recorded no per-file reason that could be read back. The job log holds the full phase output, and `Code/.il/.report.json` names every file that did not translate.\n' > "$WHY_FILE"
            fi
            echo "::warning::this analysis covers less than the project (verdict: degraded) — see the job summary for what did not translate"
            {
              echo "### This analysis covers less than your project"
              echo
              echo "The run finished and its verdict is **degraded**, which means part of the project was not translated, so the analysis, the inferred requirements and the datasets this app reads all describe less than what is in the repository. **Nothing here says your code is wrong.**"
              echo
              if [ -n "${REASONS}" ]; then
                echo "What the engine reported, most common first:"
                echo
                echo '```'
                echo "${REASONS}"
                echo '```'
                if [ "${DISTINCT:-0}" -gt 5 ]; then
                  echo
                  echo "That is the 5 most common of **${DISTINCT}** distinct reasons; this job's log holds them all, and so does \`Code/.il/.report.json\` in the results."
                fi
              else
                echo "This run recorded no per-file reason that could be read back here. The phase output in this job's log is the full account, and \`Code/.il/.report.json\` in the results names every file that did not translate."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # EMPTY IS UNREADABLE, and that is the whole point of this check. The previous
          # version tested only for the literal `unknown`, so a missing, null or
          # unparseable verdict — every realistic way this fails — walked straight past
          # the guard that exists to catch it. Reading the exit code alone reports a
          # partial analysis as a clean one, which is what the verdict is for.
          if [ -z "$RESULT" ]; then
            echo "::error::the sync produced no readable verdict"
            exit 1
          fi

      # Kept whatever the run's outcome: a store holds only entries keyed by what they were made
      # from, so what a failed run wrote is as right as what a green one did.
      - name: Keep what this analysis can reuse
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.ts-frontend-cache
            .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.property-check/run-cache
            .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.analysis-cache
          key: predictable-reuse-${{ github.ref_name }}-${{ github.run_id }}

      # Named by what it holds, and saved only when that is not what was restored: a run whose mirror
      # did not change writes nothing, and the time left after the hard stop is not spent uploading.
      - name: Name the Lean mirror's build
        id: leankey
        if: always()
        env:
          REF: ${{ github.ref_name }}
          TRACES: ${{ hashFiles(format('.predictable-code/{0}/.predictable-code/verification/.lake/build/**/*.trace', github.ref_name)) }}
        run: |
          set -euo pipefail
          if [ -n "$TRACES" ]; then
            echo "key=predictable-lean-build-${REF}-${TRACES}" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the Lean mirror's build
        if: always() && steps.leankey.outputs.key != '' && steps.leankey.outputs.key != steps.leanbuild.outputs.cache-matched-key
        uses: actions/cache/save@v5
        with:
          path: .predictable-code/${{ github.ref_name }}/.predictable-code/verification/.lake/build
          key: ${{ steps.leankey.outputs.key }}

      # NOT WHEN THE RESTORE MATCHED THIS VERY KEY: the entry already exists, so the save could only
      # be refused — after it had archived the whole store, seconds of every run spent on nothing.
      - name: Keep the dependency stores
        if: always() && steps.depcache.outcome == 'success' && steps.depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.npm/_cacache
            ~/.m2/repository
            ~/.gradle/caches/modules-2
            ~/.nuget/packages
          key: predictable-deps-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/pom.xml', '**/*.gradle', '**/*.gradle.kts', '**/*.csproj', '**/packages.lock.json') }}

      # WHAT IS PROVISIONED NOW, after the run installed whatever its languages needed. Named by
      # the SET of installed tool versions, so a run that installed nothing new names the entry it
      # restored and saves nothing, and one that added a toolchain saves a wider entry the next run
      # restores instead.
      #
      # NEVER FROM A JOB THAT WAS STOPPED, OR WHOSE PROVISIONING FAILED. A cancelled or timed-out job
      # is killed wherever it is, so a toolchain it was unpacking can be left half on disk under a
      # name that reads as installed; kept, every later run would restore it as the newest entry
      # and never save over it. An install that FAILS rather than being killed is removed by mise
      # itself, so a run whose own work failed still keeps what it installed whole.
      - name: Name what is provisioned now
        id: toolsnow
        if: ${{ !cancelled() && steps.toolkey.outcome == 'success' && steps.provision.outcome == 'success' }}
        env:
          PC_HOME: ${{ steps.toolchain.outputs.predictable_home }}
          PREFIX: ${{ steps.toolkey.outputs.prefix }}
        run: |
          set -euo pipefail
          set=$( { (cd "$PC_HOME" && ls -d mise/installs/*/* .venv-* 2>/dev/null) || :; } | sort | { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-16)
          echo "key=${PREFIX}${set}" >> "$GITHUB_OUTPUT"

      - name: Keep the provisioned toolchains
        if: ${{ !cancelled() && steps.toolsnow.outputs.key != '' && steps.toolsnow.outputs.key != steps.toolcache.outputs.cache-matched-key }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/predictable-pkg/predictable-runtime-installed/mise
            ${{ runner.temp }}/predictable-pkg/predictable-runtime-installed/bin/mise
            ${{ runner.temp }}/predictable-pkg/predictable-runtime-installed/.venv*
          key: ${{ steps.toolsnow.outputs.key }}

      - name: Propose the results
        env:
          GH_TOKEN: ${{ github.token }}
          # A fix the driver's own round check verified though it then exited non-zero, as the Run
          # step judged it and exported it: named here, so the step reads only what it declares.
          PC_FIX_VERIFIED_DESPITE_EXIT: ${{ env.PC_FIX_VERIFIED_DESPITE_EXIT }}
          # THE MODEL KEY'S VALUE, read here for ONE purpose: an agent fix's re-analysis refuses to
          # publish a dataset that contains it (#2057, `PREDICTABLE_PUBLISH_REFUSE` below). The same
          # closed pair the Run step reads; under a name no tool this step runs looks for, so
          # nothing here can USE it as a credential.
          PC_MODEL_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ORG_ANTHROPIC_KEY }}
          CONTROL_PLANE: ${{ inputs.control_plane }}
          VERDICT: ${{ steps.analyse.outputs.result }}
          TAG: ${{ steps.toolchain.outputs.tag }}
          PC_COMMAND: ${{ inputs.command }}
          # Whether a republish compiled rather than analysed (#2257), as the restore step decided.
          PC_REPUBLISH: ${{ env.PC_REPUBLISH }}
          # Through the environment for the reason the run step says: this input
          # arrives from an API call and must never be spliced into shell.
          PC_TARGET: ${{ inputs.target }}
          # What the Run step resolved for an authoring verb (#2019): the ONE file to stage,
          # already checked to be inside the checkout, and what to call the change.
          # The requirement sentence, for the commit body — through the environment, as in Run.
          PC_TEXT: ${{ inputs.text }}
          SPEC_FILE: ${{ steps.analyse.outputs.spec_file }}
          SPEC_BRANCH: ${{ steps.analyse.outputs.spec_branch }}
          # Whether the edit was made on its spec's branch with an OPEN pull request (#2019).
          SPEC_CONTINUED: ${{ steps.spec.outputs.continued }}
          SPEC_ID: ${{ steps.analyse.outputs.spec_id }}
          SPEC_NAME: ${{ steps.analyse.outputs.spec_name }}
          # How many analysed functions a generation was grounded in (#2055); digits only.
          SPEC_GROUNDED: ${{ steps.analyse.outputs.spec_grounded }}
          # How many requirements a generation wrote (#2307); digits, or empty when not reported.
          SPEC_WRITTEN: ${{ steps.analyse.outputs.spec_written }}
          # `yes` when a generation stopped at a draft for its person to confirm (#2307).
          SPEC_DRAFTED: ${{ steps.analyse.outputs.spec_drafted }}
          # The branch a set-of-files verb proposes on (#2103), named by the step that may have
          # continued it; whether it did is `SPEC_CONTINUED`.
          FILES_BRANCH: ${{ steps.spec.outputs.files_branch }}
          # Whether a description run owes another (#2264), from its own report: the Run step's
          # `another_run`. Only `true` withholds the pull request; anything else opens it.
          ANOTHER_RUN: ${{ steps.analyse.outputs.another_run }}
          # A fix's proposal branch, named once by the branch-resolution step (#2240), which also
          # continued it for an agent fix whose pull request is open (`SPEC_CONTINUED`).
          FIX_BRANCH: ${{ steps.spec.outputs.fix_branch }}
          # Which attempt at a fix this is, for the fix branch's `.analysis.json` (#2240).
          PC_ATTEMPT: ${{ inputs.attempt }}
          # The commit the attempt started from, as the Run step resolved it (#2306), stamped on a
          # continuation's work in progress so the next run records its start there.
          PC_FIX_BASE: ${{ env.PC_FIX_BASE }}
          # The finding's analysis key, which the verification below looks for.
          PC_FINDING: ${{ inputs.finding }}
          # What re-analyses an agent fix's branch (#2240): the same launcher the Run step uses, and
          # the stamp the restore step compares a reused analysis against.
          PC_HOME: ${{ steps.toolchain.outputs.predictable_home }}
          EXPECTED: ${{ steps.toolchain.outputs.schema_hash }}
          # Who started an agent fix, for its re-analysis's `.analysis.json` — through the environment
          # like every other input that arrives from an API call.
          PREDICTABLE_ANALYSIS_STARTED_BY: ${{ inputs.started_by }}
          PREDICTABLE_ANALYSIS_ORIGIN: ${{ inputs.started_by != '' && 'control-center' || 'automatic' }}
          PREDICTABLE_ANALYSIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "predictable-code[bot]"
          git config user.email "predictable-code[bot]@users.noreply.github.com"

          # THE REPOSITORY'S OWN GIT HOOKS DO NOT RUN FOR THIS PUSH, and that is a
          # correctness requirement rather than a convenience.
          #
          # Measured on a real repository: a `husky` pre-push hook ran the project's
          # frontend test suite, two tests were ALREADY failing for reasons that have
          # nothing to do with us, and git refused the push — so a completed analysis
          # was produced, committed, and then thrown away. Any repository with a red
          # test could never receive results.
          #
          # The hooks exist to gate a HUMAN pushing CODE. An analysis goes to a branch that
          # carries no code at all, and a fix or a spec is offered as a pull request the
          # repository reviews and runs its own CI against — so the gate those hooks
          # provide is not being skipped, it is being applied where it belongs. Disabling by `core.hooksPath` rather than `--no-verify` per
          # command, so a hook cannot reappear through a git call somebody adds later.
          git config core.hooksPath /dev/null

          # AN AGENT'S WORK IS STAGED BY ONE RULE, the CLI's (`stageAgentWork`), for every path here
          # that commits it to the code's branch — an implemented spec and a fix — and for
          # `fix --together --commit-verified`, which commits in the CLI itself. The tree is staged
          # whole and then ours is taken back out: the state directory, the agent's per-machine
          # settings file, and the spec pages the run's own syncs INFERRED. MEASURED: an implemented
          # spec's pull request carried 97 new `*.spec.md` pages (873 lines) beside its one spec and
          # one source file. Those pages are the database's (`<branch>/.specs/`, which the run's
          # publish already wrote), never the code's; a page the branch tracks, or one a person or
          # the agent wrote, is still committed. Which pages are inferred is decided by the parser
          # the publish decides it with, never a shell reading of Markdown. It prints each page it
          # left out; under `-e` a refusal ends the step, as a failed `git add` did.
          stage_agent_work() {
            local left_out count
            left_out=$(PREDICTABLE_HOME="$PC_HOME" "$PC_HOME/launcher.sh" stage-agent-work \
              --json --path "$PWD/.predictable-code")
            # JSON, never lines: a page's path (`specs/src/app/[vendor]/…`) is not safe through
            # Markdown, which is the verb's other rendering.
            count=$(printf '%s' "${left_out:-[]}" | jq 'length')
            if [ "$count" -gt 0 ]; then
              echo "::notice::left ${count} spec page(s) the analysis inferred out of the commit; they are in the database"
            fi
          }

          # WHY A PUSH IS WRAPPED AT ALL. A run can do every piece of work correctly and
          # then lose all of it at this line, and git's own message does not say why.
          # MEASURED: an analysis of `defuncto-predictable` translated 31 of 31 files,
          # analysed them, inferred requirements — and ended with
          #
          #   ! [remote rejected] predictable/analysis-35549208032
          #     (refusing to allow a GitHub App to create or update workflow
          #      `.github/workflows/predictable-sync.yml`)
          #
          # because the Predictable workflow update had been merged WHILE the run was in
          # flight. The run had checked the older commit out, so its branch carries the
          # older workflow file, and once the default branch moved GitHub reads the push
          # as an App updating a workflow — which this token may not do.
          #
          # The remedy is the customer's and it is one sentence long, so it is said here
          # rather than left as a git error in a log nobody reads. NOT auto-repaired:
          # rebasing the results onto the moved tip would make the analysis describe a
          # commit its branch is not based on, and that is a product decision rather
          # than a repair.
          push_or_explain() {
            # Extra push flags, if any, come first: only the authored-spec and fix paths pass one
            # (`--force-with-lease`, below); every other caller pushes exactly as before.
            if git push "$@" origin "$BRANCH" 2> "${RUNNER_TEMP}/pc-push.err"; then
              cat "${RUNNER_TEMP}/pc-push.err" >&2
              return 0
            fi
            cat "${RUNNER_TEMP}/pc-push.err" >&2
            if grep -q "create or update workflow" "${RUNNER_TEMP}/pc-push.err"; then
              echo "::error::this run started from an older commit, and the Predictable workflow was updated on ${GITHUB_REF_NAME} while it ran; nothing is wrong with what it wrote, but it cannot be pushed from a branch carrying the older workflow file — re-run it and it will push"
              {
                echo "### What this run wrote could not be pushed"
                echo
                echo "This run started before the Predictable workflow on \`${GITHUB_REF_NAME}\` was updated, so its branch carries the older copy of \`.github/workflows/predictable-sync.yml\`. GitHub refuses a push from an app that would change a workflow file, which is the right rule and is why this stopped here."
                echo
                # Said of what the run WROTE: only a fix and an authored spec push a branch now, an
                # analysis is a commit on predictable-code-database and never comes through here.
                echo '**Nothing is wrong with what this run wrote.** Run it again and it will push.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            return 1
          }

          # THE CONTROL PLANE OPENS THE PULL REQUEST, with the App's installation token.
          #
          # A pull request this job opens with its own GITHUB_TOKEN starts NO workflow run:
          # that is GitHub's rule for every event the token causes. So the repository's own
          # CI never ran on our pull requests, the Control Center had no checks to show, and
          # a base that requires checks could never merge one. Opened by the plane, CI runs
          # as on any other pull request, and the plane records it and arms the auto-merge
          # choice of whoever started this run.
          #
          # IT FALLS BACK to opening it here when the plane cannot be reached or refuses, so
          # a run never loses its results over it, and it says so: without the plane, this
          # repository's CI will not run on the pull request until something pushes to it.
          open_pull_request() {
            PC_PR_HEAD="$1"
            PC_PR_TITLE="$2"
            PC_PR_BODY="$3"
            # `$4` is the pull request's MODE, at most one: `draft` — a Fix All Defects batch's pull
            # request opens before its work is done (#2313) — or `hold`, which asks the plane NOT to
            # merge it on its own (#2307) and can only withdraw the auto-merge its opener chose,
            # never arm one.
            PC_PR_DRAFT=""
            PC_PR_HOLD=false
            case "${4:-}" in
              draft) PC_PR_DRAFT=draft ;;
              hold) PC_PR_HOLD=true ;;
            esac
            # No plane named, or no way to mint a token (a run started by hand from GitHub's own
            # UI can lack either): straight to the fallback rather than an unbound variable.
            PC_PR_OIDC=""
            if [ -n "${CONTROL_PLANE:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              PC_PR_OIDC=$(curl -sS -m 20 \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CONTROL_PLANE}" \
                | jq -r '.value // empty') || PC_PR_OIDC=""
            fi
            if [ -n "$PC_PR_OIDC" ]; then
              # BASED ON THE BRANCH THIS RAN ON: a fix or a spec of `feature/x` belongs on
              # `feature/x`, not on the default branch with every commit of `feature/x` beside it.
              jq -n --arg head "$PC_PR_HEAD" --arg base "${GITHUB_REF_NAME}" \
                --arg title "$PC_PR_TITLE" --rawfile body "$PC_PR_BODY" --arg draft "$PC_PR_DRAFT" \
                --argjson hold "$PC_PR_HOLD" \
                '{head: $head, base: $base, title: $title, body: $body, draft: ($draft == "draft"), holdAutoMerge: $hold}' \
                > "${RUNNER_TEMP}/pc-pr-request.json"
              PC_PR_STATUS=$(curl -sS -m 60 -o "${RUNNER_TEMP}/pc-pr-answer.json" -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer ${PC_PR_OIDC}" \
                -H 'content-type: application/json' \
                --data-binary "@${RUNNER_TEMP}/pc-pr-request.json" \
                "${CONTROL_PLANE}/api/cloud/pull-requests") || PC_PR_STATUS=000
              if [ "$PC_PR_STATUS" = "201" ] || [ "$PC_PR_STATUS" = "200" ]; then
                echo "Opened $(jq -r '.url // "the pull request"' "${RUNNER_TEMP}/pc-pr-answer.json")"
                return 0
              fi
              echo "::warning::the control plane did not open the pull request (HTTP ${PC_PR_STATUS}): $(head -c 300 "${RUNNER_TEMP}/pc-pr-answer.json" 2>/dev/null)"
            fi
            echo "::warning::opening the pull request with this job's own token, so this repository's CI will not run on it until something pushes to it"
            # A HOLD SURVIVES THE FALLBACK (#2307): no plane applied it, so the job writes the
            # auto-merge marker itself, OFF — which only withdraws (the plane honours an intent
            # marker on a pull request a bot opened, and adopts it rather than its own setting).
            if [ "$PC_PR_HOLD" = true ]; then
              printf '\n\n<!-- predictable-code:auto-merge off method=squash -->\n' >> "$PC_PR_BODY"
            fi
            PC_PR_DRAFT_FLAG=""
            [ "$PC_PR_DRAFT" = "draft" ] && PC_PR_DRAFT_FLAG="--draft"
            # shellcheck disable=SC2086
            gh pr create $PC_PR_DRAFT_FLAG \
              --title "$PC_PR_TITLE" \
              --body-file "$PC_PR_BODY" \
              --head "$PC_PR_HEAD" \
              --base "${GITHUB_REF_NAME}"
          }

          # ──────────────────────────────────────────────────────────────────────────
          # A PULL REQUEST REVIEW (#2367): THE FIX IS STACKED, THE RESULT IS REPORTED.
          #
          # A fix the driver verified is on `predictable/review-fix/<number>`, cut from the pull
          # request's head; it is pushed and proposed through the ONE opener with the pull request's
          # HEAD branch as its base (`open_pull_request` sends `${GITHUB_REF_NAME}`, the branch this
          # ran on), so merging it adds the fix to the pull request. HELD from merging on its own: it
          # changes somebody else's branch, which a person decides.
          #
          # THEN THE RESULT, with this job's OIDC token: the Control Center posts the check and the
          # comment with its App. This job posts neither — a pull request that edits this file cannot
          # post its own verdict, and a check its token made is not the one a ruleset requires.
          # ──────────────────────────────────────────────────────────────────────────
          if [ "${PC_COMMAND}" = "review" ]; then
            REVIEW_FILE="${RUNNER_TEMP}/pc-review.json"
            [ -s "$REVIEW_FILE" ] || {
              echo "::error::the review reported no result, so there is nothing to post"
              exit 1
            }
            FIX_STATE=$(sed -n '1p' "${RUNNER_TEMP}/pc-review-fix.state" 2>/dev/null || true)
            FIX_REASON=$(sed -n '2p' "${RUNNER_TEMP}/pc-review-fix.state" 2>/dev/null || true)
            FIX_URL=""
            FIX_NUMBER=""
            case "$FIX_STATE" in
              none|not-attempted|failed|verified) ;;
              *) FIX_STATE=failed; FIX_REASON="the run recorded no outcome for the fix" ;;
            esac
            if [ "$FIX_STATE" = "verified" ]; then
              BRANCH="predictable/review-fix/${PC_TARGET}"
              STALE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
              if push_or_explain --force-with-lease="${BRANCH}:${STALE}"; then
                # Each line read on its own (`fromjson?`), so a line that is not JSON cannot hide the rounds.
                VERIFIED=$(jq -cR 'fromjson? | objects | select(.subtype == "predictable_fix_round")' \
                  "${RUNNER_TEMP}/predictable-agent.ndjson" 2>/dev/null \
                  | jq -s 'last | (.verified // []) | length' 2>/dev/null | tr -cd '0-9' || true)
                {
                  echo "Fixes the defects pull request #${PC_TARGET} introduces, on top of its branch \`${GITHUB_REF_NAME}\`: merging this adds the fix to that pull request."
                  echo
                  echo "Verified by Predictable Code: each defect is gone and none was added."
                  echo
                  echo "An agent wrote this change with this repository's own key, in its own Actions (\`${TAG}\`). After each of its turns the analysis re-checked the code, and only what it verified was committed. Review it as you would a colleague's."
                  echo
                  # INERT, as every text a model or a repository wrote: one line, in a double-backtick
                  # span, so nothing in it renders, links or notifies.
                  jq -r --arg verified "${VERIFIED:-0}" 'def inert: tostring | gsub("[[:cntrl:]]+"; " ") | gsub("`+"; "`") | "`` " + . + " ``";
                    "### The defects this change introduced (\($verified) of \(.introduced | length) verified fixed)",
                    "",
                    (.introduced[] | "- \(.file + ":" + (.line | tostring) | inert) · \(.fqn | inert) · \(.label | inert) — \(.message | inert)")' \
                    "$REVIEW_FILE"
                } > "${RUNNER_TEMP}/pc-review-fix-body.md"
                EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
                if [ -n "$EXISTING" ]; then
                  FIX_URL="$EXISTING"
                else
                  OPENED=$(open_pull_request "$BRANCH" "Fix the defects pull request #${PC_TARGET} introduces" \
                    "${RUNNER_TEMP}/pc-review-fix-body.md" hold || true)
                  FIX_URL=$(printf '%s\n' "$OPENED" | grep -o 'https://[^ ]*/pull/[0-9][0-9]*' | tail -n 1 || true)
                fi
                FIX_NUMBER=$(printf '%s' "$FIX_URL" | sed -n 's|.*/pull/\([0-9][0-9]*\)$|\1|p')
                if [ -n "$FIX_NUMBER" ]; then
                  FIX_STATE=proposed
                  FIX_REASON=""
                else
                  FIX_STATE=failed
                  FIX_REASON="the verified fix is on ${BRANCH}, and its pull request could not be opened"
                fi
              else
                FIX_STATE=failed
                FIX_REASON="the verified fix could not be pushed to ${BRANCH}"
              fi
            fi
            jq -n --slurpfile review "$REVIEW_FILE" --arg state "$FIX_STATE" --arg reason "$FIX_REASON" \
              --arg number "$FIX_NUMBER" --arg url "$FIX_URL" \
              '{review: $review[0], fix: {state: $state, reason: (if $reason == "" then null else $reason end), pullRequest: (if $number == "" then null else {number: ($number | tonumber), url: $url} end)}}' \
              > "${RUNNER_TEMP}/pc-review-report.json"
            PC_REVIEW_OIDC=""
            if [ -n "${CONTROL_PLANE:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              PC_REVIEW_OIDC=$(curl -sS -m 20 \
                -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CONTROL_PLANE}" \
                | jq -r '.value // empty') || PC_REVIEW_OIDC=""
            fi
            [ -n "$PC_REVIEW_OIDC" ] || {
              echo "::error::no token to report the review with; the Control Center reads this change as not analysed"
              exit 1
            }
            PC_REVIEW_STATUS=$(curl -sS -m 60 -o "${RUNNER_TEMP}/pc-review-answer.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${PC_REVIEW_OIDC}" \
              -H 'content-type: application/json' \
              --data-binary "@${RUNNER_TEMP}/pc-review-report.json" \
              "${CONTROL_PLANE}/api/cloud/review") || PC_REVIEW_STATUS=000
            case "$PC_REVIEW_STATUS" in
              200)
                echo "Reported the review of #${PC_TARGET}; the Control Center posted its check and comment"
                ;;
              409)
                # A NEWER COMMIT IS BEING REVIEWED: this one's verdict is not posted, and that is right.
                echo "::notice::not posted: $(head -c 300 "${RUNNER_TEMP}/pc-review-answer.json" 2>/dev/null)"
                ;;
              *)
                echo "::error::the Control Center did not take the review (HTTP ${PC_REVIEW_STATUS}): $(head -c 300 "${RUNNER_TEMP}/pc-review-answer.json" 2>/dev/null)"
                exit 1
                ;;
            esac
            exit 0
          fi

          # ──────────────────────────────────────────────────────────────────────
          # A FIX PROPOSES DIFFERENT BYTES FOR A DIFFERENT REASON, so it branches here.
          #
          # An analysis writes `.predictable-code/` and the specs directory and touches
          # NO source. A fix does the opposite: it edits source, and the whole point of
          # the pull request is that a person reads that edit before it lands. The
          # branch name matches the desktop product's (`predictable/propose/<finding>`)
          # so the same finding proposes to the same place wherever the compute ran.
          # ──────────────────────────────────────────────────────────────────────
          # ──────────────────────────────────────────────────────────────────────────
          # AN AUTHORED SPEC (#2019): ONE FILE, ONE BRANCH PER SPEC, ONE PULL REQUEST.
          #
          # STAGED IS INVERTED from the fix below. A fix stages the tree and drops what we
          # generate; a spec stages EXACTLY the `.md` its verb reported (`SPEC_FILE`,
          # already resolved inside the checkout by the Run step) and nothing else — not
          # the specs tree, which also holds the dataset the verb just recompiled, and not
          # `.predictable-code/`. The commit is scoped to that path too (`-- "$SPEC_FILE"`
          # is git's `--only`), so nothing else in the index can ride along.
          #
          # THE BRANCH IS KEYED ON THE FILE, not the spec id: an id is not unique (#1831),
          # a file is one spec. A later edit to the same spec was made ON this branch (the
          # Run step checked it out), so it commits on top, the push is a fast-forward, and
          # the pull request it opened the first time is the one that updates.
          #
          # READY, NOT DRAFT, for symmetry with the fix pull request below.
          # ──────────────────────────────────────────────────────────────────────────
          case "${PC_COMMAND}" in
            spec-new|spec-describe|requirement-add|requirement-update|requirement-remove|spec-generate)
              if [ "${SPEC_DRAFTED:-}" = "yes" ]; then
                echo "::notice::a draft to confirm; nothing to propose"
                exit 0
              fi
              # Decided by the Run step (`spec_branch_for`), which is also where a later edit
              # checked this branch out. `-B`, not `-b`: on that later edit the checkout IS the
              # branch, and `-b` would refuse to recreate it; `-B` at HEAD leaves it as it is.
              BRANCH="${SPEC_BRANCH}"
              [ -n "$BRANCH" ] && [ -n "$SPEC_FILE" ] || {
                echo "::error::the run resolved no spec file or branch to propose"
                exit 1
              }
              # A GENERATION NEVER LANDS ON AN OPEN PULL REQUEST (#2307). It is a NEW spec, so its
              # branch is replaced rather than continued — and a pull request still open on it (the
              # same name generated again before the first was merged) would keep ITS title, body and
              # auto-merge over the new content: a spec with no requirements merged unread under a
              # normal title, or a "no requirements derived" title over one that has them. Refused,
              # before anything is pushed, naming what to do.
              if [ "${PC_COMMAND}" = "spec-generate" ]; then
                OPEN_ON_BRANCH=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
                if [ -n "$OPEN_ON_BRANCH" ]; then
                  echo "::error::a pull request for ${SPEC_FILE} is already open (${OPEN_ON_BRANCH}); merge or close it, then generate the spec again"
                  echo "A pull request for \`${SPEC_FILE}\` is already open (${OPEN_ON_BRANCH}), so nothing was pushed: merge or close it, then generate the spec again." >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
              fi
              git checkout -B "$BRANCH"
              git add -- "$SPEC_FILE"
              if git diff --cached --quiet -- "$SPEC_FILE"; then
                echo "::notice::${SPEC_FILE} is unchanged; nothing to propose"
                echo "The spec file already said this, so there is nothing to propose." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              case "${PC_COMMAND}" in
                spec-new) VERB=create ;;
                spec-generate) VERB=generate ;;
                *) VERB=edit ;;
              esac
              case "${PC_COMMAND}" in
                spec-new) CHANGE="created" ;;
                spec-generate) CHANGE="generated by a model from the description a person wrote" ;;
                spec-describe) CHANGE="description set" ;;
                requirement-update) CHANGE="requirement ${PC_TARGET#*/} changed: ${PC_TEXT}" ;;
                requirement-remove) CHANGE="requirement ${PC_TARGET#*/} removed" ;;
                *) CHANGE="requirement added: ${PC_TEXT}" ;;
              esac
              git commit -m "spec(${SPEC_ID:-spec}): ${VERB} ${SPEC_NAME:-${SPEC_FILE}}" \
                -m "Authored in the Predictable Control Center (${CHANGE}); produced by ${TAG} on ${GITHUB_SHA}." \
                -- "$SPEC_FILE"
              if [ "${SPEC_CONTINUED:-no}" = "yes" ]; then
                push_or_explain
              else
                # NOT CONTINUED, so this commit starts from the dispatched ref. A branch of this
                # name may still exist — its pull request CLOSED or merged, or a new spec's name
                # reused — and a plain push would fail as a non-fast-forward. It is REPLACED, with
                # a lease on exactly what the remote holds now (empty: it must not exist), so a
                # branch somebody pushed to meanwhile is never overwritten.
                STALE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
                push_or_explain --force-with-lease="${BRANCH}:${STALE}"
              fi
              # A GENERATION THAT KEPT NO REQUIREMENT (#2307) is still proposed — its description
              # is the model's reading of the feature, and the rejected sentences below are worth
              # authoring by hand — but it is NAMED as empty in the title the Pull requests screen
              # shows, said first in the body, and held from merging on its own: merged unread it
              # is a spec with no requirements, which the person who wrote the prompt did not ask for.
              PC_NO_REQS=no
              if [ "${PC_COMMAND}" = "spec-generate" ] && [ "${SPEC_WRITTEN:-}" = "0" ]; then
                PC_NO_REQS=yes
                echo "No requirements could be derived from the description, so the spec has a description and none. The pull request says so and waits for a person." >> "$GITHUB_STEP_SUMMARY"
              fi
              {
                echo "**${SPEC_NAME:-${SPEC_FILE}}** · spec \`${SPEC_ID:-?}\` · \`${SPEC_FILE}\`"
                echo
                if [ "$PC_NO_REQS" = "yes" ]; then
                  echo "> [!WARNING]"
                  echo "> **No requirements could be derived from the description.** None of the requirements the model proposed passed the requirement check, so this spec has a description and **no requirements**. It is not merged on its own: add requirements to it, or close this pull request and describe the feature again."
                  echo
                fi
                if [ "${PC_COMMAND}" = "spec-generate" ]; then
                  # SAYS A MODEL WROTE IT, because it did: the sentence the authored path prints
                  # ("no AI generated this text") would be false here, and a reviewer weighs a
                  # model's requirements differently from a person's.
                  echo "A person described this feature in the Predictable Control Center; **a model named the spec and wrote its description and requirements**, using this repository's own key, in its own Actions (\`${TAG}\`). Only the spec file is in this change."
                  echo
                  echo "Every requirement here passed the canonical requirement check before it was written: it parses as the next analysis parses it, and it is a form the analysis decides."
                  if [ "${SPEC_GROUNDED:-0}" -gt 0 ] 2>/dev/null; then
                    echo "Each one also names one of the ${SPEC_GROUNDED} functions of this repository's last analysis, and only that function's own parameters."
                  else
                    echo "This repository had no analysed functions to ground them in, so a requirement may name a function the next analysis cannot find — it then gets no verdict."
                  fi
                  REJECTED="${RUNNER_TEMP}/pc-spec-rejected.md"
                  if [ -s "$REJECTED" ]; then
                    echo
                    echo "### Left out: not canonical after three attempts"
                    echo
                    echo "The model proposed these and none passed the check, so they are **not** in the spec. Add any you want by hand, as a canonical sentence:"
                    echo
                    cat "$REJECTED"
                  fi
                  echo
                  echo "Review them as you would a colleague's: a requirement that reaches a verdict says whether the code does this, not whether this is what you want."
                else
                  echo "A person wrote this in the Predictable Control Center, and \`${TAG}\` recorded it in the spec's Markillo file with a deterministic command in this repository's own Actions — **no AI generated this text**. Only the spec file is in this change."
                fi
                echo
                echo "Later edits to the same spec are added to this branch, so the diff is the full record of what changed. The requirements are checked against the code by the next analysis; nothing here claims they hold yet."
              } > /tmp/pc-spec-body.md
              # ONE PULL REQUEST PER BRANCH: a later edit's push already updated it, so an
              # existing one is reported rather than refused.
              EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
              if [ -n "$EXISTING" ]; then
                echo "::notice::updated the open pull request for ${SPEC_FILE}: ${EXISTING}"
                echo "Added to the open pull request for this spec: ${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
              else
                # BASED ON THE BRANCH THIS RAN ON, which the spec branch was cut from: the same rule
                # as the fix, or a spec written against `feature/x` is proposed
                # against the default branch with every commit of `feature/x` beside it.
                # Through the ONE opener (`open_pull_request`, above), so the repository's CI runs
                # on it: a pull request this job opened with its own token would start none.
                if [ "$PC_NO_REQS" = "yes" ]; then
                  open_pull_request "$BRANCH" "spec(${SPEC_ID:-spec}): ${VERB} ${SPEC_NAME:-${SPEC_FILE}} — no requirements derived" /tmp/pc-spec-body.md hold
                else
                  open_pull_request "$BRANCH" "spec(${SPEC_ID:-spec}): ${VERB} ${SPEC_NAME:-${SPEC_FILE}}" /tmp/pc-spec-body.md
                fi
              fi
              exit 0
              ;;
          esac

          # ──────────────────────────────────────────────────────────────────────────
          # AN IMPLEMENTED SPEC (#2339): THE SPEC AND ITS CODE, ONE PULL REQUEST.
          #
          # On the spec's branch (`spec_branch_for`, the one slug rule), which the resolve step
          # continued while the spec's pull request was open — so this commit lands on top of the
          # spec and that pull request now carries both. STAGED LIKE A FIX (`stage_agent_work`): the
          # tree, less our state directory, the agent's per-machine settings file and the pages the
          # run's own syncs inferred, for the reasons the fix path below gives at length.
          #
          # THE GATE DECIDES ITS STATE, never the agent's word: the driver's own last `spec-check`
          # (`predictable_implement`). Met → READY, and auto-merge applies as for any of ours. Not met
          # → a DRAFT that lists what is still unverified (#2339's decision 5): the work is kept and
          # shown, never a silent nothing, and a draft cannot be merged by anyone's automation.
          # ──────────────────────────────────────────────────────────────────────────
          case "${PC_COMMAND}" in
            spec-implement)
              BRANCH="${SPEC_BRANCH}"
              [ -n "$BRANCH" ] && [ -n "$SPEC_FILE" ] || {
                echo "::error::the run resolved no spec file or branch to propose"
                exit 1
              }
              AGENT_OUT="${RUNNER_TEMP}/predictable-agent.ndjson"
              IMPL=$(jq -c 'select(.type == "result") | .predictable_implement // empty' "$AGENT_OUT" 2>/dev/null | tail -n 1 || true)
              [ -n "$IMPL" ] || IMPL='{}'
              OUTCOME=$(printf '%s' "$IMPL" | jq -r '.outcome // empty' 2>/dev/null || true)
              case "$OUTCOME" in
                met|not-met|failed) ;;
                *) OUTCOME=failed ;;
              esac
              git checkout -B "$BRANCH"
              stage_agent_work
              CHANGED=no
              if ! git diff --cached --quiet; then
                CHANGED=yes
                git commit -q -m "feat(${SPEC_ID:-spec}): implement ${SPEC_FILE}" \
                  -m "Implemented by an agent in this repository's own Actions until the analysis verified the spec (${OUTCOME}); produced by ${TAG} on ${GITHUB_SHA}." \
                  -m "Predictable-Implement-Spec: ${SPEC_ID:-}"
              fi
              # WHAT THE GATE SAID, as the reader sees it. The requirement sentences are the spec's
              # own (a model may have written them), so each is set INERT, like every model text here.
              jq -r 'def inert: tostring | gsub("[[:cntrl:]]+"; " ") | gsub("`+"; "`") | "`` " + . + " ``";
                (.last // {}) as $c |
                "Requirements verified: **\($c.verified // 0) of \($c.total // 0)** · findings at the start \($c.findingsBefore // "?"), now \($c.findingsNow // "?") · rounds: \(.rounds // 0)",
                "",
                "The verdict: \(.reason | inert)",
                (if (($c.pending // []) | length) > 0 then "", "### Not verified yet", "", ($c.pending[] | "- `\(.reqId)` (\(.status)) — \(.description | inert)") else empty end),
                (if (($c.introduced // []) | length) > 0 then "", "### Findings the change added", "", ($c.introduced[:50][] | "- \(. | inert)") else empty end)' \
                > "${RUNNER_TEMP}/pc-implement-gate.md" 2>/dev/null <<< "$IMPL" || : > "${RUNNER_TEMP}/pc-implement-gate.md"
              {
                echo "**Implementing spec \`${SPEC_ID:-?}\`** · \`${SPEC_FILE}\`"
                echo
                if [ "$OUTCOME" = "met" ]; then
                  echo "**The analysis verifies every requirement of this spec, and the change added no finding.** An agent wrote the code with this repository's own key, in its own Actions (\`${TAG}\`); after each of its turns this run re-analysed the repository with \`predictable spec-check\`, and that check — not the agent — decided it was done."
                else
                  echo "> [!WARNING]"
                  echo "> **Not done: the analysis does not verify this spec yet**, so this pull request stays a draft. What the agent wrote is here so it is not lost; the requirements still unverified are listed below. Implement it again from the Control Center, or finish it by hand."
                fi
                echo
                cat "${RUNNER_TEMP}/pc-implement-gate.md"
                echo
                echo "Review the code as you would a colleague's: a verified requirement says the code does what the spec states, not that the spec is what you want."
              } > "${RUNNER_TEMP}/pc-implement-body-whole.md"
              head -c 59000 "${RUNNER_TEMP}/pc-implement-body-whole.md" > "${RUNNER_TEMP}/pc-implement-body.md"
              {
                echo "### Implement \`${SPEC_ID:-?}\`: ${OUTCOME}"
                echo
                cat "${RUNNER_TEMP}/pc-implement-gate.md"
              } >> "$GITHUB_STEP_SUMMARY"
              EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
              if [ "$CHANGED" = "no" ] && [ -z "$EXISTING" ]; then
                # NOTHING TO CARRY: the spec is already merged and the code met it as it stood, or the
                # agent changed nothing. The verdict above is the whole answer.
                echo "::notice::no change to propose (${OUTCOME})"
                [ "$OUTCOME" = "met" ] && exit 0
                echo "::error::the spec is not met and nothing was changed"
                exit 1
              fi
              if [ "$CHANGED" = "yes" ]; then
                if [ "${SPEC_CONTINUED:-no}" = "yes" ]; then
                  push_or_explain
                else
                  STALE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
                  push_or_explain --force-with-lease="${BRANCH}:${STALE}"
                fi
              fi
              TITLE="feat(${SPEC_ID:-spec}): implement ${SPEC_FILE}"
              [ "$OUTCOME" = "met" ] || TITLE="${TITLE} — not verified yet"
              if [ -n "$EXISTING" ]; then
                # THE PLANE'S MARKERS SURVIVE THE NEW BODY: the auto-merge intent is a marker in the
                # body, never process memory, so a body written without it would silently drop the
                # merge the spec's pull request was opened with.
                gh pr view "$EXISTING" --json body --jq '.body' 2>/dev/null \
                  | grep -o '<!-- predictable-code:[^>]*-->' > "${RUNNER_TEMP}/pc-implement-markers.txt" || true
                if [ -s "${RUNNER_TEMP}/pc-implement-markers.txt" ]; then
                  { echo; cat "${RUNNER_TEMP}/pc-implement-markers.txt"; } >> "${RUNNER_TEMP}/pc-implement-body.md"
                fi
                gh pr edit "$EXISTING" --title "$TITLE" --body-file "${RUNNER_TEMP}/pc-implement-body.md" >/dev/null \
                  || echo "::warning::could not update ${EXISTING}'s title and description"
                if [ "$OUTCOME" = "met" ]; then
                  gh pr ready "$EXISTING" >/dev/null 2>&1 || echo "::warning::could not mark ${EXISTING} ready for review"
                else
                  gh pr ready --undo "$EXISTING" >/dev/null 2>&1 || true
                fi
                echo "Updated the pull request: ${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
              elif [ "$OUTCOME" = "met" ]; then
                open_pull_request "$BRANCH" "$TITLE" "${RUNNER_TEMP}/pc-implement-body.md"
              else
                open_pull_request "$BRANCH" "$TITLE" "${RUNNER_TEMP}/pc-implement-body.md" draft
              fi
              [ "$OUTCOME" = "failed" ] && exit 1
              exit 0
              ;;
          esac

          # ──────────────────────────────────────────────────────────────────────────
          # A SET OF FILES (#2103): the description run. STAGED LIKE A SPEC —
          # exactly the files the command reported (`pc-files.txt`, resolved inside the checkout
          # by the Run step) and nothing else, committed with those paths as `--only` — on the
          # branch the "Resolve an authored spec" step named and, while its pull request is
          # open, continued.
          # ──────────────────────────────────────────────────────────────────────────
          case "${PC_COMMAND}" in
            spec-fill-descriptions)
              BRANCH="${FILES_BRANCH}"
              LIST="${RUNNER_TEMP}/pc-files.txt"
              [ -n "$BRANCH" ] || {
                echo "::error::the run named no branch to propose on"
                exit 1
              }
              # THE PULL REQUEST IS THE LOOP'S FINAL PACKAGE (#2264). A run that owes another
              # (`another_run`, from its own report) commits and pushes what it wrote and opens
              # NOTHING: a pull request opened after a first batch would be merged by auto-merge
              # and cut the loop short. The run that owes none — complete, or stopped at the model
              # wall — opens it, over everything the loop's runs wrote on this branch.
              ANOTHER="${ANOTHER_RUN:-false}"
              git checkout -B "$BRANCH"
              if [ -s "$LIST" ]; then
                set --
                while IFS= read -r _f; do
                  [ -n "$_f" ] && set -- "$@" "$_f"
                done < "$LIST"
                git add -- "$@"
                if git diff --cached --quiet -- "$@"; then
                  echo "::notice::every file this run wrote already said this"
                else
                  RUN_TITLE="docs(specs): descriptions for $# spec(s), written by a model"
                  # THE LOOP THIS RUN BELONGS TO (#2279), as a trailer on its own line: the next run of
                  # the same loop continues this branch only when its tip carries the same id.
                  LOOP_ID="${PC_TARGET:-}"
                  # Only an id's own characters reach a commit message; anything else is no id.
                  if printf '%s' "$LOOP_ID" | grep -c '[^0-9a-f-]' >/dev/null; then LOOP_ID=""; fi
                  RUN_MADE="written by a model with this repository's key; produced by ${TAG} on ${GITHUB_SHA}."
                  if [ -n "$LOOP_ID" ]; then
                    git commit -m "$RUN_TITLE" -m "$RUN_MADE" -m "Predictable-Describe-Loop: ${LOOP_ID}" -- "$@"
                  else
                    git commit -m "$RUN_TITLE" -m "$RUN_MADE" -- "$@"
                  fi
                  if [ "${SPEC_CONTINUED:-no}" = "yes" ]; then
                    push_or_explain
                  else
                    # Replaced, never built on, when a pull request already carried it — with a
                    # lease on what the remote holds, as for a spec.
                    STALE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
                    push_or_explain --force-with-lease="${BRANCH}:${STALE}"
                  fi
                fi
              fi
              if [ "$ANOTHER" = "true" ]; then
                echo "::notice::more specs remain for the next run; the pull request opens when the documentation is complete"
                echo "Pushed to \`${BRANCH}\`. More specs remain for the next run, which the Control Center starts; the pull request opens once, when the documentation is complete." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              # WHAT THE WHOLE LOOP WROTE, read from the branch itself rather than from this run's
              # report: the pull request carries every run's commits, and its body says so.
              git fetch -q origin "${GITHUB_REF_NAME}" 2>/dev/null || true
              CHANGED="${RUNNER_TEMP}/pc-fill-changed.txt"
              git diff --name-only "origin/${GITHUB_REF_NAME}...HEAD" > "$CHANGED" 2>/dev/null || : > "$CHANGED"
              if [ ! -s "$CHANGED" ]; then
                echo "::notice::${PC_COMMAND} wrote nothing; nothing to propose"
                echo "Nothing was written, so there is nothing to propose." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              N_FILES=$(wc -l < "$CHANGED" | tr -d ' ')
              N_RUNS=$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD" 2>/dev/null || echo 1)
              TITLE="docs(specs): descriptions for ${N_FILES} spec(s), written by a model"
              {
                echo "This pull request carries descriptions a model wrote for **${N_FILES} spec file(s)**, across ${N_RUNS} commit(s) of one documentation run. Each sentence is in the diff."
                echo
                echo "What the last run did:"
                echo
                cat "${RUNNER_TEMP}/pc-fill-body.md"
              } > "${RUNNER_TEMP}/pc-files-body-whole.md"
              # CUT FROM A FILE, never a pipe into `head`: past the limit `head` stops reading, the
              # writer dies of the broken pipe, and `pipefail` fails the step that was proposing.
              head -c 59000 "${RUNNER_TEMP}/pc-files-body-whole.md" > /tmp/pc-files-body.md
              EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
              if [ -n "$EXISTING" ]; then
                echo "::notice::updated the open pull request: ${EXISTING}"
                echo "Added to the open pull request: ${EXISTING}" >> "$GITHUB_STEP_SUMMARY"
              else
                open_pull_request "$BRANCH" "$TITLE" /tmp/pc-files-body.md
              fi
              exit 0
              ;;
          esac

          # A REPUBLISH IS PUBLISHED LIKE THE ANALYSIS IT STANDS IN FOR (#2257), below — and a
          # discovery (#2355) like the sync it ends in: it proposes nothing, because its checks are
          # in the database that sync published, never in the code.
          if [ "${PC_COMMAND}" != "sync" ] && [ "${PC_COMMAND}" != "republish" ] \
            && [ "${PC_COMMAND}" != "plugins-discover" ]; then
            # Named by the branch-resolution step (`fix_branch_for`), the one slug rule. `-B`, not
            # `-b`: a fix chain's retry already has this branch checked out (#2240), and `-B` at
            # HEAD leaves it as it is.
            BRANCH="${FIX_BRANCH}"
            [ -n "$BRANCH" ] || {
              echo "::error::the run named no branch to propose the fix on"
              exit 1
            }
            # FIX ALL DEFECTS (#2313): the driver already COMMITTED every round the gate verified;
            # what is left uncommitted nothing verified, so it is never staged. This step pushes those
            # commits and opens the batch's DRAFT pull request once — a draft, so auto-merge cannot
            # take a batch in progress. The Control Center keeps its checklist current from the run's
            # own stream; THIS step marks it ready when the batch ends, so its end state never
            # depends on the Control Center surviving a multi-hour batch.
            if [ "${PC_COMMAND}" = "fix-all-agent" ]; then
              FIX_OUTCOME=$(jq -r 'select(.type == "result") | .predictable_fix.outcome // empty' \
                "${RUNNER_TEMP}/predictable-agent.ndjson" 2>/dev/null | tail -n 1 || true)
              # How many defects the branch holds verified fixes for, off the driver's last round.
              VERIFIED=$(jq -s '[.[] | select(.subtype == "predictable_fix_round")] | last | (.verified // []) | length' \
                "${RUNNER_TEMP}/predictable-agent.ndjson" 2>/dev/null || echo 0)
              # NOTHING VERIFIED, NOTHING PROPOSED. MEASURED on staging (2026-10-20): a batch that
              # verified 0 of 27 opened draft #3 with no changed file, and the Control Center offered
              # it for review and merge. The branch is pushed only when it holds a verified commit or
              # the batch continues in a new job (which builds on it); the draft opens only over a
              # verified commit, as a connected machine's batch does (`syncConnectedFixAll`).
              if [ "${VERIFIED:-0}" -eq 0 ] && [ "$FIX_OUTCOME" != "continue" ]; then
                {
                  echo "### Fix all defects: ${FIX_OUTCOME:-unknown}"
                  echo
                  echo "No defect was verified fixed, so nothing is pushed and no pull request is opened."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              STALE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
              push_or_explain --force-with-lease="${BRANCH}:${STALE}"
              OPEN=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
              if [ -z "$OPEN" ] && [ "${VERIFIED:-0}" -gt 0 ]; then
                printf '%s\n' "Predictable Code is fixing every defect in this repository in one agent session. The Control Center keeps this checklist current as each round is verified." \
                  > "${RUNNER_TEMP}/pc-fix-all-body.md"
                # THE ONE OPENER, as a draft: the plane opens it with the App's token (so the
                # repository's CI runs on it) and keeps auto-merge off until it is marked ready.
                OPEN=$(open_pull_request "$BRANCH" "Fix all defects (Predictable Code)" \
                  "${RUNNER_TEMP}/pc-fix-all-body.md" draft | tail -n 1)
              fi
              # READY when every defect is gone, or stuck with some fixed — `marksReady`'s rule, the
              # count read off the driver's last round.
              if [ -n "$OPEN" ] && { [ "$FIX_OUTCOME" = "fixed" ] \
                || { [ "$FIX_OUTCOME" = "not-fixed" ] && [ "${VERIFIED:-0}" -gt 0 ]; }; }; then
                gh pr ready "$OPEN" || echo "::warning::could not mark ${OPEN} ready for review"
              fi
              {
                echo "### Fix all defects: ${FIX_OUTCOME:-unknown}"
                echo
                echo "Verified commits are on \`${BRANCH}\`: ${OPEN}"
                if [ "$FIX_OUTCOME" = "continue" ]; then
                  echo
                  echo "This run's time is up; the batch continues in a new run."
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git checkout -B "$BRANCH"

            # THE CHANGE SET IS THE VERDICT. `fix-issue` keeps its edit only if its own
            # accept gates hold and restores the snapshot otherwise, so no change means
            # the fix was tried and DECLINED — an ordinary outcome, reported as itself.
            # Saying "fixed" here on an unchanged tree is the exact false success
            # `fix-verdict.ts` exists to prevent.
            # SOURCE ONLY. `git add -A` swept in `.predictable-code/` — MEASURED: a
            # hosted fix published a pull request whose entire diff was
            # `.predictable-code/logs/2026-09-21/01.log`, 81 lines of our own logging,
            # under the title "Predictable Code fix". The CLI writes its logs and its
            # re-analysis into the state directory as it works, so an unscoped stage in
            # THIS branch commits our machinery and calls it the customer's fix.
            #
            # The analysis force-ADDS that directory on purpose, into the data branch,
            # because there it is the product. Here it is exhaust: a fix's product is the
            # source edit, and the state is re-derived by the next sync.
            #
            # AND THE AGENT'S OWN SETTINGS FILE, which is the THIRD thing our machinery has
            # put in a customer's fix. MEASURED on the first hosted run where the agent
            # actually worked: the pull request carried a correct one-line source fix AND a
            # new `.claude/settings.local.json` pointing at
            # `/home/runner/work/_temp/predictable-plugin/scripts/statusline.sh` — a path
            # that exists only on that runner, for a status line the customer never asked
            # for, written by the agent because we launch it with our plugin attached.
            #
            # SCOPED TO THAT ONE FILE, not to `.claude/`. A repository may legitimately
            # keep `.claude/commands` or a shared `settings.json` under version control, and
            # excluding the directory would silently drop a real change. `settings.local.json`
            # is by convention the PER-MACHINE file — that is what `.local.` means, and
            # Claude Code's own scaffolding gitignores it — so it is never part of a fix.
            # STAGED THEN UNSTAGED, NOT EXCLUDED BY PATHSPEC, and this is the whole
            # reason the staging is two git commands instead of one.
            #
            # A NEGATIVE PATHSPEC FLIPS `git add` INTO EXPLICIT MODE. With a plain
            # `git add -A -- .` git walks the tree and SILENTLY SKIPS ignored files;
            # add any `:!` pathspec and it starts reporting the ignored files the walk
            # met as if they had been named on the command line, and exits 1:
            #
            #   The following paths are ignored by one of your .gitignore files:
            #   .claude/settings.local.json
            #   hint: Use -f if you really want to add them.
            #
            # MEASURED end to end on sunner-predictable, run 35634785114: a `fix-agent`
            # for FIN-0001 did its work, and this step then died on the line meant to
            # stage it. The step runs under `bash -e`, so a non-zero `git add` ends the
            # job — a complete fix thrown away at the last step, exactly the shape the
            # `.predictable-code` ignore defect already had once, arriving through the
            # exclusion written to prevent the OTHER half of it.
            #
            # The unstage keeps both exclusions where they actually matter: a repository
            # that does NOT ignore these paths would otherwise have our state directory and
            # the agent's per-machine settings file in its pull request. `git reset` on a
            # path with nothing staged is a no-op and exits 0, so this is safe in both worlds.
            #
            # AND THE PAGES THE RUN'S OWN SYNCS INFERRED, the fourth thing: every fix-check
            # the driver runs is a sync, and a sync writes a per-source page for each source
            # file into the checkout. That shape, all four exclusions, lives in the CLI
            # (`stage_agent_work`, above), so this path, the implemented spec and a batch of
            # fixes stage by one rule.
            stage_agent_work
            # WHAT THE AGENT SAID IT REACHED, from its own last message (`RESULT: fixed` or
            # `RESULT: not fixed — why`), quoted beside the run's verdict. Only ever quoted: the
            # verdict is this run's own re-analysis, never the agent's word.
            agent_result() {
              jq -r 'select(.type == "result") | .result // empty' \
                "${RUNNER_TEMP}/predictable-agent.ndjson" 2>/dev/null \
                | grep -E '^[[:space:]]*RESULT:' | tail -n 1 | sed 's/^[[:space:]]*//' || true
            }
            not_fixed() {
              echo "::error::$1"
              {
                echo "### Not fixed: no pull request was opened"
                echo
                echo "$1"
                SAID=$(agent_result)
                if [ -n "$SAID" ]; then
                  echo
                  echo "The agent ended with: \`${SAID}\`"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            }
            # THE DRIVER'S OWN OUTCOME (#2306), from its one `result` line: `fixed`, `not-fixed`,
            # `continue` or `failed`. Read, never trusted alone: a `fixed` is still verified below.
            FIX_OUTCOME=""
            if [ "${PC_COMMAND}" = "fix-agent" ]; then
              FIX_OUTCOME=$(jq -r 'select(.type == "result") | .predictable_fix.outcome // empty' \
                "${RUNNER_TEMP}/predictable-agent.ndjson" 2>/dev/null | tail -n 1 || true)
              # No result line, but the Run step found the last round verified (see there).
              if [ -z "$FIX_OUTCOME" ] && [ "${PC_FIX_VERIFIED_DESPITE_EXIT:-}" = "yes" ]; then
                FIX_OUTCOME=fixed
              fi
              FIX_REASON=$(jq -r 'select(.type == "result") | .predictable_fix.reason // empty' \
                "${RUNNER_TEMP}/predictable-agent.ndjson" 2>/dev/null | tail -n 1 || true)
              FIX_ROUNDS=$(jq -r 'select(.type == "result") | .predictable_fix.rounds // empty' \
                "${RUNNER_TEMP}/predictable-agent.ndjson" 2>/dev/null | tail -n 1 || true)
              # A RUN THAT ENDED BEFORE THE AGENT HAD A TURN says its own reason: "the agent changed no
              # source, so it is still reported" was printed over a defect the analysis could not see.
              # Only when nothing in the source moved: an agent that edited and then died before its
              # first turn ended DID start, and the paths below say what became of its change.
              if [ "$FIX_OUTCOME" = "failed" ] && [ "$FIX_ROUNDS" = 0 ] && [ -n "$FIX_REASON" ] \
                && [ -z "$(git status --porcelain -- . ':(exclude).predictable-code' 2>/dev/null)" ]; then
                not_fixed "The fix did not start: ${FIX_REASON}"
              fi
            fi
            # OUT OF TIME, NOT OUT OF IDEAS: the work so far is pushed to the fix branch — never a
            # pull request — stamped with this attempt's id, and the run SUCCEEDS so the Control
            # Center dispatches the same attempt again, which continues from that commit.
            if [ "$FIX_OUTCOME" = "continue" ]; then
              if ! git diff --cached --quiet; then
                git commit -q -m "Predictable Code fix for ${PC_TARGET} (work in progress)" \
                  -m "Not finished: the run's time ran out and the fix continues in a new run." \
                  -m "Predictable-Fix-Attempt: ${PC_ATTEMPT}" \
                  -m "Predictable-Fix-Base: ${PC_FIX_BASE:-$GITHUB_SHA}"
                STALE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
                push_or_explain --force-with-lease="${BRANCH}:${STALE}"
              fi
              {
                echo "### Continuing in a new run"
                echo
                echo "The fix for \`${PC_TARGET}\` is not verified yet and this run's time is up. Its work so far is on \`${BRANCH}\` (no pull request is opened for it), and the next run of this fix continues from there."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if git diff --cached --quiet; then
              # AN AGENT THAT CHANGED NOTHING FIXED NOTHING, and the run fails saying so. For the
              # deterministic fix it is an ordinary outcome: its accept gates declined the edit.
              [ "${PC_COMMAND}" = "fix-agent" ] \
                && not_fixed "The agent changed no source, so the defect \`${PC_TARGET}\` is still reported."
              echo "::notice::the fix did not change any source; nothing to propose"
              echo "No change was kept. \`fix-issue\` restores its snapshot when its accept gates do not hold, so this finding needs a different remedy." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # WHO WROTE THIS CHANGE IS THE FIRST THING A REVIEWER NEEDS, and the two
            # verbs are not the same claim. Saying "this is not an agent's work" over
            # an agent's diff would be false in the one sentence a reviewer most relies
            # on, so the provenance is chosen here rather than written once for both.
            if [ "${PC_COMMAND}" = "fix-agent" ]; then
              MADE_BY="\`predictable fix\`, an agent working in a checkout of this repository until the analysis verified its change"
              HOW="**An agent wrote this.** It was given the finding and asked to fix the underlying defect, not to silence it. This run re-analysed the change before proposing it, and the analysis no longer reports the finding — still, read it as you would any pull request from a colleague."
            else
              MADE_BY="\`predictable analyze fix-issue\`"
              HOW="**This is not an agent's work.** \`predictable analyze fix-issue\` edits narrowly and keeps the edit only if its own accept gates hold, so what is here was re-checked before it was proposed. It is still a change to your source, and it is here to be reviewed."
            fi
            # WHAT THIS ATTEMPT CHANGED, read from the index before it is committed, for the fix
            # branch's `.analysis.json` (#2240): the Control Center holds no tree, so this is the
            # one measurement of the change set it can rest an `applied` verdict on.
            git diff --cached --numstat > "${RUNNER_TEMP}/pc-fix-numstat.txt"
            git commit -m "Predictable Code fix for ${PC_TARGET}" \
              -m "Produced by ${TAG} on ${GITHUB_SHA} by ${MADE_BY}."

            # ────────────────────────────────────────────────────────────────────────
            # AN AGENT FIX IS VERIFIED BEFORE ANYTHING LEAVES THIS RUNNER.
            #
            # The commit above is re-analysed exactly as committed, and the pull request is opened
            # ONLY when that analysis no longer reports the finding. Otherwise nothing is pushed,
            # no pull request exists, and the run FAILS saying the fix did not work. Proposing
            # first and checking after was how a fix whose finding was still reported got merged:
            # a pull request can be merged by auto-merge before any check of ours has run.
            #
            # The agent already looped fix → sync → check inside its session; this is the gate that
            # does not take its word for it.
            #
            # A SYNC IS NEVER HANDED A MODEL KEY (#2103): the agent's key is in this job, so the
            # re-analysis runs with the model key and the job's token unset — it asks no model, and
            # it must not be able to. It PUBLISHES NOTHING (`PREDICTABLE_REPORTED_RUN`): the fix
            # branch is not pushed yet, and an analysis of a fix that did not work is not one
            # anybody reads. A verified one is published below, once its branch is on origin.
            # ────────────────────────────────────────────────────────────────────────
            if [ "${PC_COMMAND}" = "fix-agent" ]; then
              [ -n "${PC_FINDING:-}" ] || not_fixed "This run was not told which finding to check (\`finding\` is empty), so the fix cannot be verified."
              VERIFY_JSON="${RUNNER_TEMP}/pc-verify-result.json"
              VERIFY_LOG="${RUNNER_TEMP}/pc-verify-progress.ndjson"
              # THE FIX BRANCH STARTS FROM THE ANALYSIS THAT FOUND THE FINDING, reused only when it
              # was written by THIS build, exactly as the open step decides for a sync, because
              # reporting an old build's dataset as current costs trust.
              #
              # AS COMMITTED, not as the agent left it on disk: its own syncs ran over the base
              # branch's entry (publishing nothing, but writing the files), and it could edit them.
              # The committed entry is put back and anything untracked in it removed; what stays is
              # the ignored build cache, which is keyed by the content it was built from.
              BASE_ENTRY=".predictable-code/${GITHUB_REF_NAME}"
              FIX_ENTRY=".predictable-code/${BRANCH}"
              git -C .predictable-code checkout -q -- "${GITHUB_REF_NAME}" 2>/dev/null || true
              git -C .predictable-code clean -q -f -d -- "${GITHUB_REF_NAME}" 2>/dev/null || true
              if [ ! -e "${FIX_ENTRY}/.analysis.json" ] && [ -d "$BASE_ENTRY" ]; then
                mkdir -p "$FIX_ENTRY"
                cp -R "${BASE_ENTRY}/." "${FIX_ENTRY}/"
              fi
              if [ -d "${FIX_ENTRY}/.predictable-code" ]; then
                FOUND=""
                [ -f "${FIX_ENTRY}/.predictable-code/schema-hash" ] && FOUND=$(tr -d '[:space:]' < "${FIX_ENTRY}/.predictable-code/schema-hash")
                if [ -z "${EXPECTED}" ] || [ "$FOUND" != "${EXPECTED}" ]; then
                  find "${FIX_ENTRY}/.predictable-code" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
                fi
              fi
              echo "Re-analysing ${BRANCH} to tell whether ${PC_TARGET} is fixed."
              # THE SAME CHECK the agent, its Stop hook and the driver ran (#2306): `fix-check`,
              # against the starting point the driver recorded. `gone` needs the finding absent
              # from a COMPLETE analysis of this tree, the function still analysed, and the
              # project's findings fewer than at the start with none new; a `jq` over a sync read
              # a renamed function as fixed.
              if ( export PREDICTABLE_REPORTED_RUN=1
                   unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN PC_MODEL_KEY GH_TOKEN
                   PREDICTABLE_HOME="$PC_HOME" "$PC_HOME/launcher.sh" fix-check --key "${PC_FINDING}" \
                     --json --path "$PWD/.predictable-code" > "$VERIFY_JSON" 2> "$VERIFY_LOG" ); then
                VERIFY_STATUS=0
              else
                VERIFY_STATUS=$?
              fi
              if [ -s "$VERIFY_LOG" ]; then
                echo "::group::Re-analysis of the fix ($(wc -l < "$VERIFY_LOG" | tr -d ' ') lines)"
                cat "$VERIFY_LOG"
                echo "::endgroup::"
              fi
              VERIFY_VERDICT=$(jq -r '.verdict // empty' "$VERIFY_JSON" 2>/dev/null || true)
              VERIFY_REASON=$(jq -r '.reason // empty' "$VERIFY_JSON" 2>/dev/null || true)
              if [ "$VERIFY_STATUS" -ne 0 ] || [ -z "$VERIFY_VERDICT" ]; then
                not_fixed "Re-analysing the fix did not finish (exit ${VERIFY_STATUS}), so there is no evidence that \`${PC_TARGET}\` is gone. The re-analysis output above says why."
              fi
              [ "$VERIFY_VERDICT" = "gone" ] \
                || not_fixed "The analysis of the fixed code does not show \`${PC_TARGET}\` fixed (${VERIFY_VERDICT}): ${VERIFY_REASON}"
              echo "The analysis of the fixed code no longer reports ${PC_TARGET}: ${VERIFY_REASON}"
            fi

            if [ "${PC_COMMAND}" = "fix-agent" ] && [ "${SPEC_CONTINUED:-no}" = "yes" ]; then
              # A RETRY ON THE OPEN PULL REQUEST: built on its branch, so the push fast-forwards
              # and that pull request is the one that updates. No second pull request is opened.
              push_or_explain
              echo "Added this attempt to the open pull request for \`${PC_TARGET}\`." >> "$GITHUB_STEP_SUMMARY"
            else
              if [ "${PC_COMMAND}" = "fix-agent" ]; then
                # REPLACED, never built on, when the earlier attempt's pull request was closed or
                # merged — with a lease on what the remote holds, as for a spec. Without it a
                # branch left behind by a merged pull request refused every later fix's push.
                STALE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
                push_or_explain --force-with-lease="${BRANCH}:${STALE}"
              else
                push_or_explain
              fi
              {
                echo "A fix for \`${PC_TARGET}\`, produced by \`${TAG}\` in this repository's own Actions with ${MADE_BY}."
                echo
                echo "${HOW}"
                echo
                echo "The finding still stands on \`${GITHUB_REF_NAME}\` until this merges."
              } > /tmp/pc-fix-body.md
              # BASED ON THE BRANCH THIS RAN ON (`open_pull_request` sends `${GITHUB_REF_NAME}`),
              # which is the one the fix branch was cut from.
              open_pull_request "$BRANCH" "Predictable Code fix: ${PC_TARGET}" /tmp/pc-fix-body.md
            fi
            # THE DETERMINISTIC FIX ENDS HERE: it is one pass, and its own accept gates already
            # re-checked it before it was kept.
            [ "${PC_COMMAND}" = "fix-agent" ] || exit 0

            # ────────────────────────────────────────────────────────────────────────
            # THE VERIFIED ANALYSIS IS PUBLISHED UNDER THE FIX BRANCH'S NAME (#2240), now that the
            # branch is on origin, by the same publisher a sync ends with; the plane reads it like
            # any branch's analysis. Nothing is analysed again: `publish` records what the
            # verification above wrote.
            #
            # IT NEVER FAILS THE FIX. The pull request above is already verified; an analysis that
            # is not published only means the Control Center says it could not read it.
            # ────────────────────────────────────────────────────────────────────────
            # WHAT THE RECORD SAYS DIFFERENTLY FOR A FIX, and nothing else: the entry and the
            # `branch` are the fix branch's, and the record says which attempt it answers and what
            # that attempt changed (`PREDICTABLE_ANALYSIS_FIX`).
            PC_FIX_JSON=$(jq -cRn \
              --arg attempt "${PC_ATTEMPT:-}" --arg finding "${PC_TARGET}" --arg base "${GITHUB_REF_NAME}" \
              '{attempt: (if $attempt == "" then null else $attempt end), finding: $finding, base: $base,
                changed: [inputs | split("\t") | select(length >= 3)
                  | {path: (.[2:] | join("\t")), added: ((.[0] | tonumber?) // 0), removed: ((.[1] | tonumber?) // 0)}]}' \
              < "${RUNNER_TEMP}/pc-fix-numstat.txt")
            # The model key's VALUE goes in as `PREDICTABLE_PUBLISH_REFUSE`, the one thing the
            # publish refuses to commit — this job's agent had the key, and could have written it
            # into the state directory.
            ( export PREDICTABLE_PUBLISH_REFUSE="${PC_MODEL_KEY:-}" PREDICTABLE_ANALYSIS_FIX="$PC_FIX_JSON"
              unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN PC_MODEL_KEY GH_TOKEN PREDICTABLE_REPORTED_RUN
              PREDICTABLE_HOME="$PC_HOME" "$PC_HOME/launcher.sh" publish ) \
              || echo "::warning::the verified analysis of ${BRANCH} was not published; the check below says what origin holds"
            PC_ANALYSED_BRANCH="$BRANCH"
            VERDICT="$VERIFY_VERDICT"
          fi

          # ──────────────────────────────────────────────────────────────────────────
          # AN ANALYSIS IS A COMMIT ON `predictable-code-database`, never a pull request, and the
          # SYNC MADE IT: `predictable sync` commits the branch's analysis to the database it checked
          # out at `.predictable-code/` and pushes it, exactly as on a developer's machine. What is
          # checked here is the outcome — origin's database records THIS commit as this branch's
          # analysis — and the run says so, or says why not.
          # ──────────────────────────────────────────────────────────────────────────
          DATA_BRANCH=predictable-code-database
          DATA_REF="refs/remotes/origin/${DATA_BRANCH}"
          # WHOSE ANALYSIS THIS IS: the branch the run was dispatched on, or — for an agent fix,
          # which set it above — the fix branch it committed to (#2240).
          PC_ANALYSED_BRANCH="${PC_ANALYSED_BRANCH:-${GITHUB_REF_NAME}}"
          ANALYSED=$(git rev-parse HEAD)
          git fetch -q --no-tags origin "+refs/heads/${DATA_BRANCH}:${DATA_REF}" 2>/dev/null || true
          RECORDED=$(git show "${DATA_REF}:${PC_ANALYSED_BRANCH}/.analysis.json" 2>/dev/null \
            | jq -r '.analysedCommit // empty' 2>/dev/null || true)
          if [ "$RECORDED" != "$ANALYSED" ]; then
            # WHY, IN THE SYNC'S OWN WORDS. Its publish outcome ("Not published: …", "already
            # carries …") is written to its log under the state directory, not to this job's
            # output (under --json its stderr is the progress stream), so this summary used to say
            # "the output above says why" over a log that never said it, and a failed publish
            # could not be diagnosed afterwards. The lines are copied here; `tail` reads to the end.
            PUBLISH_SAID=$(find "$PWD/.predictable-code" -path '*/logs/*' -name '*.log' -type f \
              -exec grep -hE 'Published the analysis|already carries this analysis|Not published:' {} + \
              2>/dev/null | tail -n 3 || true)
            if [ -n "$PUBLISH_SAID" ]; then
              echo "The sync's publish said:"
              printf '%s\n' "$PUBLISH_SAID"
            fi
            # A RULE ON THE REPOSITORY is the one refusal a re-run will not fix, so it is named:
            # a ruleset that covers every branch also covers this one.
            {
              echo "### The analysis could not be published"
              echo
              echo "Origin's \`${DATA_BRANCH}\` does not hold this analysis of \`${PC_ANALYSED_BRANCH}\`. If a ruleset or branch protection covers every branch of this repository, exempt \`${DATA_BRANCH}\`: it carries only Predictable's data and is never merged."
              if [ -n "$PUBLISH_SAID" ]; then
                echo
                echo "What the sync's publish said:"
                echo
                echo '```'
                printf '%s\n' "$PUBLISH_SAID"
                echo '```'
              else
                echo
                echo "The sync recorded no publish outcome in its log, so it never reached the publish: the analysis step's output above says how it ended."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            # AN AGENT FIX IS NOT FAILED BY ITS CHECK (#2240): its pull request is already open, so
            # a failed run would read as a failed fix — the chain's hard stop. Nothing published is
            # what the Control Center reads, and it says it could not tell.
            if [ -n "${PC_FIX_JSON:-}" ]; then
              echo "::warning::the fix is proposed, but its analysis could not be published, so the Control Center cannot tell whether it closed ${PC_TARGET}"
              exit 0
            fi
            echo "::error::the analysis of ${PC_ANALYSED_BRANCH} was not published to ${DATA_BRANCH}"
            exit 1
          fi
          echo "Published the analysis of ${PC_ANALYSED_BRANCH} (${ANALYSED}) to ${DATA_BRANCH}."

          # THE VERDICT AND WHY, where a reader of this run looks. A `degraded` run analysed part
          # of the project, and saying so beside the result is what keeps it from reading as a
          # full one; the reasons were extracted once, by the analyse step.
          {
            echo "### Analysis of \`${PC_ANALYSED_BRANCH}\` at \`${ANALYSED}\`"
            echo
            echo "**Verdict: \`${VERDICT}\`** — \`degraded\` means only part of the project translated, and \`mechanical\` means the run stopped before the proving tail. Neither is a failure, and neither is a clean bill."
            echo
            WHY_FILE="${RUNNER_TEMP}/pc-degraded-why.txt"
            if [ -s "$WHY_FILE" ]; then
              echo "#### Why this run covered less than the project"
              echo
              cat "$WHY_FILE"
              echo
              echo "**Nothing here says your code is wrong.**"
              echo
            fi
            # Only a republish that compiled sets this to `compile`.
            if [ "${PC_REPUBLISH:-}" = "compile" ]; then
              # SAID, because the verdict above is the earlier analysis's and nothing was analysed.
              echo "**Nothing was analysed.** Only module summaries changed since this branch's last analysis, so the specs were recompiled over it and its verdict carried; the merged summaries now show."
              echo
            fi
            if [ -n "${PC_FIX_JSON:-}" ]; then
              # A fix DID change a branch — its own, above — so the sync's sentence would be false here.
              echo "Published to \`${DATA_BRANCH}\` under \`${PC_ANALYSED_BRANCH}/\`, so the Control Center can tell whether this fix closed \`${PC_TARGET}\`."
            else
              echo "Published to \`${DATA_BRANCH}\` under \`${PC_ANALYSED_BRANCH}/\`. No branch of your code was changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
